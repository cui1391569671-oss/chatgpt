name: Workbench checks
on:
  pull_request:
    paths: ['project-tracker/**', '.github/workflows/workbench-checks.yml']
  push:
    branches: [main]
    paths: ['project-tracker/**', '.github/workflows/workbench-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            project-tracker/package-lock.json
            project-tracker/tasks-ui/package-lock.json
            project-tracker/calendar-ui/package-lock.json
      - run: npm ci
      - run: npm run build:ui
      - run: npm run build:pages
      - run: npm run verify
      - run: npm run test:d1
      - run: python3 scripts/rehearse-recovery.py
      - name: Check committed generated resources
        run: |
          files="pages.mjs tasks-assets.mjs ilamy-assets.mjs ilamy-recurrence-runtime.mjs glass-theme.mjs glass-preset.css index.html workbench.html landing.html google-apps-script/project-core-sync.gs"
          for file in $(git diff --name-only -- $files); do
            detail=$(git diff --numstat -- "$file")
            echo "::error file=project-tracker/$file::Generated output differs: $detail"
          done
          git diff --exit-code -- $files
