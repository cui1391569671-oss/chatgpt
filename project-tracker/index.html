<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目问题跟进表 - 云端版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--primary:#18243a;--accent:#435ae8;--success:#277856;--warning:#b77910;--danger:#b42318;--done-bg:#e9f5ef;--warn-bg:#fff8e6;--danger-bg:#fff1ef;--text:#18243a;--text-light:#67748b;--border:#e3e8f0;--soft:#eef1ff;--shadow:none;--shadow-lg:0 12px 40px #18243a18}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:32px 24px}.header{background:transparent;color:var(--text);padding:0;margin-bottom:24px}.header h1{font-size:30px;line-height:1.3;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:8px}.backlink{display:inline-block;padding:8px 0;text-decoration:none;color:var(--accent)}
.sync-status{padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text-light);font-size:13px;margin-bottom:20px}
.toolbar{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;position:relative;z-index:100}
.search-box{position:relative;width:100%}.search-box input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);min-height:44px;outline-offset:3px}.search-box::before{content:'';position:absolute;left:14px;top:15px;width:15px;height:15px;border:1.5px solid var(--text-light);border-radius:50%;pointer-events:none}.search-box::after{content:'';position:absolute;left:27px;top:28px;width:6px;height:1.5px;background:var(--text-light);transform:rotate(45deg);pointer-events:none}
.toolbar-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.toolbar-row>select{width:160px;height:44px;flex:0 0 160px}select{padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer}input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{padding:10px 16px;min-height:44px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-weight:500;background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;touch-action:manipulation}.btn:hover{background:var(--bg)}.btn-primary,.btn-success,.btn-add{background:var(--accent);border-color:var(--accent);color:white}.btn-primary:hover,.btn-success:hover,.btn-add:hover{background:#3448c7}.btn-outline,.btn-sync{background:var(--card);color:var(--text)}.btn-sync:hover{background:var(--soft);color:var(--accent)}.btn-del{color:var(--danger);background:var(--card)}.btn-del:hover{background:var(--danger-bg)}.btn svg{width:16px;height:16px}.btn-sync.syncing{pointer-events:none;opacity:.6}.btn-sync.syncing .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.table-wrapper{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow-x:auto;margin-bottom:20px}table{width:100%;min-width:1100px;border-collapse:collapse}thead th{background:#f8f9fc;color:var(--text-light);padding:14px 16px;font-size:13px;font-weight:600;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}thead th:first-child{padding-left:20px}tbody td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}tbody td:first-child{padding-left:20px}tbody tr:hover{background:#fafbff}tbody tr.done-row{background:var(--done-bg)}tbody tr.done-row td{color:#277856}tbody tr.warn-row{background:var(--warn-bg)}tbody tr.danger-row{background:var(--danger-bg)}
.project-group-header{padding:14px 20px;background:var(--soft);color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}.project-group-header .badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card);color:var(--accent)}.project-group-header.collapsed .toggle-icon{transform:rotate(-90deg)}
td[contenteditable=true],.proj-name{outline-offset:2px;cursor:text}td[contenteditable=true]:focus,.proj-name:focus{background:var(--soft);outline:2px solid var(--accent)}.cb-wrap{text-align:center}.cb-wrap input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}.status-badge{white-space:nowrap;display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}.status-badge.进行中{background:var(--soft);color:var(--accent)}.status-badge.已完成{background:#dceee3;color:#277856}.status-badge.暂停{background:#fff0c9;color:#8e6413}.overdue-tag{font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap}.overdue-tag.yellow{background:#fff0c9;color:#8e6413}.overdue-tag.red{background:#ffe2dc;color:var(--danger)}
.date-cell{white-space:nowrap;font-variant-numeric:tabular-nums}.date-cell input{width:140px;min-height:36px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--text);background:var(--card);cursor:pointer}.date-cell input.empty-date{border-style:dashed;color:var(--text-light)}.seq-cell{text-align:center;color:var(--text-light);font-size:13px;font-weight:500}.legend{display:flex;flex-wrap:wrap;gap:16px;padding:14px 20px;border-top:1px solid var(--border);color:var(--text-light);font-size:12px;background:var(--card)}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:10px;height:10px;border-radius:3px}.table-actions{display:flex;flex-wrap:wrap;gap:8px}
.proj-cell-wrap,.status-cell-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}.proj-name{font-weight:600;color:var(--text);white-space:normal;overflow-wrap:anywhere}.priority-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:26px}.priority-badge:hover{outline:1px solid currentColor}.priority-urgent{background:#ffe2dc;color:var(--danger)}.priority-high{background:#fff0d9;color:#a85d13}.priority-medium{background:var(--soft);color:var(--accent)}.priority-low,.priority-none{background:#f0f3f8;color:var(--text-light)}.priority-none{border:1px dashed var(--border)}
.priority-dropdown,.status-dropdown{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:var(--shadow-lg);z-index:200;display:flex;flex-direction:column;gap:3px;min-width:120px}.priority-dropdown .pd-item,.status-dropdown .sd-item{padding:10px 12px;min-height:40px;background:none;border:0;border-radius:6px;text-align:left;font-size:13px;color:var(--text);cursor:pointer}.priority-dropdown .pd-item:hover,.status-dropdown .sd-item:hover{background:var(--bg)}.priority-dropdown .pd-item.active{background:var(--soft);color:var(--accent)}
.modal-overlay{display:none;position:fixed;inset:0;background:#18243a70;z-index:1000;align-items:center;justify-content:center}.modal-overlay.active{display:flex}.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:28px;width:min(560px,calc(100% - 32px));max-height:90dvh;overflow:auto;box-shadow:0 24px 80px #18243a25}.modal h3{font-size:20px;margin:0 0 16px}.modal label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}.modal input[type=text],.modal input[type=date],.modal select,.modal textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;color:var(--text);background:var(--card);font:inherit}.modal textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:white;border-radius:10px;padding:12px 18px;font-size:14px;z-index:2000;max-width:calc(100% - 32px);display:none;align-items:center;gap:8px}.toast.show{display:flex}.toast.success{background:var(--text)}.toast.error{background:var(--danger)}.toast svg{flex-shrink:0;stroke:currentColor}
@media(max-width:760px){.container{padding:20px 16px}.header h1{font-size:25px}.toolbar{padding:16px}.toolbar-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toolbar-row>*{width:100%;min-width:0}.toolbar-row>select{width:100%;height:44px;flex:none}.toolbar-row>.btn:last-child{grid-column:1/-1}.btn,select{font-size:13px;padding:10px 12px;min-height:44px}.table-wrapper{border-radius:16px}table{min-width:1050px}.modal{padding:24px 20px}.modal-actions{flex-wrap:wrap}.table-actions .btn{flex:1}.date-cell input{min-height:40px}.legend{padding:14px 16px;gap:12px}}
@media(prefers-reduced-motion:reduce){.btn-sync.syncing .spin{animation:none}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span id="titleIcon"></span> 项目问题跟进表</h1>
    <a href="/work" class="backlink">← 返回工作工作台</a>
  </div>

<div id="pendingNotice" role="status" style="display:none;margin-bottom:16px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--soft)"><span id="pendingMessage"></span> <button class="btn btn-outline" onclick="reviewPending()">查看本地副本</button></div>
<div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索问题 / 原因 / 备注 / 项目…">
    </div>
    <div class="toolbar-row">
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="未完成">未完成</option>
        <option value="已完成">已完成</option>
      </select>
      <select id="filterOverdue">
        <option value="">全部超期</option>
        <option value="7">超7天（黄）</option>
        <option value="14">超14天（红）</option>
      </select>
      <select id="filterPriority">
        <option value="">全部优先级</option>
        <option value="urgent">🔴 紧急</option>
        <option value="high">🟠 高</option>
        <option value="medium">🔵 中</option>
        <option value="low">⚪ 低</option>
        <option value="none">无标记</option>
      </select>
      <button class="btn btn-add" onclick="showAddModal()" title="添加新问题" id="btnAdd"></button>
      <button class="btn btn-del" onclick="deleteCompleted()" title="删除所有已完成的问题" id="btnDel"></button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="min-width:140px">项目名称</th>
          <th style="width:50px">序号</th>
          <th style="min-width:240px">问题/待办事项</th>
          <th style="min-width:200px">问题原因</th>
          <th style="width:100px">当前状态</th>
          <th style="width:90px">超期</th>
          <th style="width:130px">计划完成日期</th>
          <th style="width:60px">✓</th>
          <th style="min-width:200px">备注</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#d1fae5"></div>已完成</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fef3c7"></div>未完成超7天</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fee2e2"></div>未完成超14天</div>
      <div class="legend-item"><div class="legend-dot" style="background:#dbeafe"></div>进行中/暂停</div>
    </div>
  </div>

  <div class="table-actions"><button class="btn btn-outline" onclick="viewArchive()">查看已完成记录</button></div>

</div>

<!-- Add Issue Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="modalTitle">添加新问题</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px"><label style="margin:0">所属项目</label><button type="button" class="btn btn-outline" onclick="manageProjects()">项目管理</button></div>
    <select id="addProject"></select>
    <div id="newProjectRow" style="display:none;margin-top:6px;display:none;gap:8px;align-items:center">
      <input type="text" id="newProjectInput" placeholder="输入新项目名，如 P016 XXX项目" style="flex:1;padding:8px 12px;border:2px solid var(--accent);border-radius:8px;font-size:14px;outline:none">
      <button class="btn btn-primary" style="padding:8px 14px;font-size:13px" onclick="confirmNewProject()">确认</button>
      <button class="btn btn-outline" style="padding:8px 10px;font-size:13px" onclick="cancelNewProject()">取消</button>
    </div>
    <label>问题/待办事项</label>
    <textarea id="addTask" placeholder="描述问题或待办事项…"></textarea>
    <label>问题原因</label>
    <input type="text" id="addReason" placeholder="原因（可选）">
    <label>计划完成日期</label>
    <input type="date" id="addDate">
    <label>备注</label>
    <textarea id="addNote" placeholder="备注信息（可选）" style="height:60px"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
      <button class="btn btn-success" onclick="addIssue()">确认添加</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const DEFAULT_DATA = [];

const ALL_PROJECTS = [];

const STORAGE_KEY = 'project_tracker_data_v2';
const API_BASE = '';
const ICON = {
  clipboard: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  sync: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
};
let data = [];
let dataDirty = false;
const today = new Date();
today.setHours(0,0,0,0);

// ========== 项目优先级 ==========
const PRIORITY_LEVELS = [
  { key: '', label: '无', cls: 'priority-none' },
  { key: 'low', label: '低', cls: 'priority-low' },
  { key: 'medium', label: '中', cls: 'priority-medium' },
  { key: 'high', label: '高', cls: 'priority-high' },
  { key: 'urgent', label: '紧急', cls: 'priority-urgent' }
];
let projectPriorities = {};
const PRIORITY_STORAGE_KEY = 'project_tracker_priorities';

async function loadPriorities() {}

async function savePriorities() { return saveData(); }

function getPriority(project) {
  return projectPriorities[project] || '';
}

function getPriorityInfo(key) {
  return PRIORITY_LEVELS.find(l => l.key === key) || PRIORITY_LEVELS[0];
}

function cyclePriority(project) {
  const current = getPriority(project);
  const idx = PRIORITY_LEVELS.findIndex(l => l.key === current);
  const next = PRIORITY_LEVELS[(idx + 1) % PRIORITY_LEVELS.length];
  if (next.key) {
    projectPriorities[project] = next.key;
  } else {
    delete projectPriorities[project];
  }
  savePriorities();
  console.log("[init] data length:", data.length); console.log("[init] About to render, data.length=", data.length);
  renderTable();
}

function showPriorityDropdown(project, anchorEl) {
  closePriorityDropdown();
  const dd = document.createElement('div');
  dd.className = 'priority-dropdown';
  dd.id = 'priorityDropdown';
  const current = getPriority(project);
  PRIORITY_LEVELS.forEach(level => {
    const btn = document.createElement('button');
    btn.className = 'pd-item' + (level.key === current ? ' active' : '');
    const info = getPriorityInfo(level.key);
    btn.innerHTML = '<span class="priority-badge ' + info.cls + '">' + level.label + '</span> ' + level.label;
    btn.onclick = function(e) {
      e.stopPropagation();
      if (level.key) {
        projectPriorities[project] = level.key;
      } else {
        delete projectPriorities[project];
      }
      savePriorities();
      closePriorityDropdown();
      console.log("[init] data length:", data.length); renderTable();
    };
    dd.appendChild(btn);
  });
  document.body.appendChild(dd);
  const rect = anchorEl.getBoundingClientRect();
  dd.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  dd.style.left = (rect.left + window.scrollX) + 'px';
  setTimeout(() => {
    document.addEventListener('click', closePriorityDropdown, { once: true });
  }, 10);
}


function showStatusDropdown(idx, anchorEl) {
  closeStatusDropdown();
  const dd = document.createElement('div');
  dd.className = 'status-dropdown';
  dd.id = 'statusDropdown';
  const statuses = ['进行中', '已完成', '暂停'];
  statuses.forEach(function(s) {
    const btn = document.createElement('button');
    btn.className = 'sd-item';
    const info = getPriorityInfo('');
    btn.innerHTML = '<span class="status-badge ' + s + '">' + s + '</span>';
    btn.onclick = function(e) {
      e.stopPropagation();
      data[idx].status = s;
      if (s === '已完成') {
        data[idx].done = true;
        data[idx].completedDate = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
      } else {
        if (data[idx].done) {
          data[idx].done = false;
          delete data[idx].completedDate;
        }
      }
      saveData();
      closeStatusDropdown();
      console.log("[init] data length:", data.length); renderTable();
      updateStats();
    };
    dd.appendChild(btn);
  });
  document.body.appendChild(dd);
  const rect = anchorEl.getBoundingClientRect();
  dd.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  dd.style.left = (rect.left + window.scrollX) + 'px';
  setTimeout(function() {
    document.addEventListener('click', closeStatusDropdown, { once: true });
  }, 10);
}

function closeStatusDropdown() {
  const dd = document.getElementById('statusDropdown');
  if (dd) dd.remove();
}

function closePriorityDropdown() {
  const dd = document.getElementById('priorityDropdown');
  if (dd) dd.remove();
}

async function init() {
  // 设置 SVG 图标
  document.getElementById('titleIcon').innerHTML = ICON.clipboard;
  document.getElementById('btnAdd').innerHTML = ICON.plus + ' 添加';
  document.getElementById('btnDel').innerHTML = ICON.trash + ' 归档完成';
  document.querySelector('.modal h3').innerHTML = ICON.plus + ' 添加新问题';

  await loadData();
  await loadPriorities();
  console.log("[init] data length:", data.length); renderTable();
  updateStats();
  document.getElementById('searchInput').addEventListener('input', debounce(renderTable, 300));
  document.getElementById('filterStatus').addEventListener('change', renderTable);
  document.getElementById('filterOverdue').addEventListener('change', renderTable);
  document.getElementById('filterPriority').addEventListener('change', renderTable);
}

async function loadData() {
  try {
    const r=await fetch('/api/state',{cache:'no-store'});
    if(!r.ok) throw new Error('读取失败 '+r.status);
    const s=await r.json();
    data=s.data; projectPriorities=s.priorities; archive=s.archive; projects=s.projects||[...new Set([...data.map(x=>x.project),...archive.map(x=>x.project)])]; deletedProjects=s.deletedProjects||[]; cloudVersion=s.version;
    cloudBase=structuredClone(currentTracker());ready=true; localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); setSync('云端已连接');
    inspectPending();
  } catch(e) {
    ready=false; data=[]; setSync('云端读取失败，请刷新重试。已停止编辑，避免覆盖数据');
    document.querySelectorAll('.toolbar button').forEach(b=>b.disabled=true);
  }
}

let projectRefreshing=false;
async function refreshProjectTable(){
 if(!ready||conflicted||unresolvedPending||dataDirty||pendingState||saving||projectRefreshing||document.querySelector('.modal-overlay.active')||document.activeElement?.closest('[contenteditable="true"],.date-cell input'))return;
 projectRefreshing=true;const priorVersion=cloudVersion;
 try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('云端更新检查失败 '+r.status);const latest=await r.json();if(dataDirty||pendingState||saving||cloudVersion!==priorVersion||document.querySelector('.modal-overlay.active')||document.activeElement?.closest('[contenteditable="true"],.date-cell input'))return;
  if(latest.version!==cloudVersion){const changed=!sameTracker(latest,currentTracker());data=latest.data;archive=latest.archive;projectPriorities=latest.priorities;projects=latest.projects;deletedProjects=latest.deletedProjects;cloudVersion=latest.version;cloudBase=structuredClone(currentTracker());if(changed){renderTable();updateStats();if(window.parent!==window)window.parent.postMessage({type:'project-saved'},location.origin);}}
 }catch(e){setSync(e.message+'；当前数据仍保留');}finally{projectRefreshing=false;}
}
setInterval(()=>{if(!document.hidden){if(pendingState&&!conflicted&&!unresolvedPending)flushSave();else refreshProjectTable();}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pendingState&&!conflicted&&!unresolvedPending)flushSave();else refreshProjectTable();}});
window.addEventListener('online',()=>{if(pendingState&&!conflicted&&!unresolvedPending)flushSave();else refreshProjectTable();});

function cleanupDoneItems() {}

function saveData() {
  if(unresolvedPending){reviewPending();return Promise.resolve(false);}
  if(!ready || conflicted) {showToast('同步已暂停，本地副本已保留，请核对云端数据','error'); return Promise.resolve(false);}
  dataDirty=true;
  pendingState={base:structuredClone(cloudBase),data:structuredClone(data),priorities:structuredClone(projectPriorities),archive:structuredClone(archive),projects:structuredClone(projects),deletedProjects:structuredClone(deletedProjects)};
  try {localStorage.setItem(PENDING_KEY,JSON.stringify(pendingState));} catch(e) {setSync('本地保存失败，请保持页面打开并检查浏览器存储空间');}
  return flushSave();
}
async function flushSave() {
  if(saving) return saving;
  saving=(async()=>{
    while(pendingState && !conflicted) {
      const snapshot=pendingState; pendingState=null; setSync('正在保存…');
      try {
        const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...snapshot,version:cloudVersion})});
        if(r.status===409) {conflicted=true; throw new Error('问题表已被其他页面或归档任务修改，同步已暂停，请核对本地副本');}
        if(!r.ok) throw new Error('保存失败 '+r.status);
        cloudVersion=(await r.json()).version;cloudBase=structuredClone(trackerSnapshot(snapshot));if(pendingState){pendingState.base=structuredClone(cloudBase);try{localStorage.setItem(PENDING_KEY,JSON.stringify(pendingState));}catch{}}if(window.parent!==window)window.parent.postMessage({type:'project-saved'},location.origin);
        if(!pendingState) {dataDirty=false;localStorage.removeItem(PENDING_KEY);setSync('已保存至云端');}
      } catch(e) {
        pendingState=pendingState || snapshot;if(conflicted){unresolvedPending=structuredClone(pendingState);pendingCloud=structuredClone(cloudBase);document.getElementById('pendingMessage').textContent='问题表存在同步冲突，请查看本地副本并核对云端内容。';document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);}setSync(e.message+'；本地修改仍保留');return false;
      }
    }
    return !conflicted;
  })();
  try {return await saving;} finally {saving=null;}
}

function deleteCompleted() {
  if(!ready || conflicted)return;
  const done=data.filter(x=>x.done);
  if(!done.length){showToast('没有已完成的问题','info');return;}
  if(!confirm('将 '+done.length+' 条已完成问题移入归档？历史记录会保留。'))return;
  archive.push(...done.map(x=>({...x,archivedAt:new Date().toISOString()})));
  data=data.filter(x=>!x.done);saveData();renderTable();updateStats();
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function getOverdueDays(dateStr) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr||''))return null;
  const now=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const diff=Math.floor((Date.parse(now+'T00:00:00Z')-Date.parse(dateStr+'T00:00:00Z'))/86400000);
  return diff>0?diff:null;
}

function getFilteredData() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const statusFilter = document.getElementById('filterStatus').value;
  const overdueFilter = document.getElementById('filterOverdue').value;
  const priorityFilter = document.getElementById('filterPriority').value;

  return data.map((item, idx) => ({...item, _idx: idx})).filter(item => {
    if (statusFilter === '未完成' && item.done) return false;
    if (statusFilter === '已完成' && !item.done) return false;
    if (overdueFilter) {
      const od = getOverdueDays(item.plannedDate);
      if (overdueFilter === '7' && (!od || od < 7)) return false;
      if (overdueFilter === '14' && (!od || od < 14)) return false;
    }
    if (priorityFilter) {
      const itemPri = getPriority(item.project);
      if (priorityFilter === 'none') {
        if (itemPri) return false;
      } else {
        if (itemPri !== priorityFilter) return false;
      }
    }
    if (search) {
      const haystack = (item.task + item.reason + item.note + item.project + item.status).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

  const priOrder = { urgent: 0, high: 1, medium: 2, low: 3, '': 4 };
  Object.keys(groups).sort((a, b) => {
    const pa = priOrder[getPriority(a)] ?? 4;

          const projTd = document.createElement('td');

          projTd.dataset.field = 'project';
          projTd.dataset.idx = item._idx;
          projTd.style.verticalAlign = 'middle';

          } else if (projPri === 'high') {

        // 问题原因

        // 当前状态（优先级 + 状态合并显示）
        const statusTd = document.createElement('td');
        const statusWrap = document.createElement('div');
        statusWrap.className = 'status-cell-wrap';

        // 优先级标签（仅在项目第一行显示）
        if (ri === 0) {
          const priKey2 = getPriority(item.project);

          const idx = parseInt(e.target.dataset.idx);

  if (filtered.length === 0) {
    const emptyTr = document.createElement('tr');
    emptyTr.innerHTML = '<td colspan="9" style="text-align:center;padding:40px;color:var(--text-light)">无匹配数据</td>';

function handleCellEdit(e) {
  const idx=Number(e.target.dataset.idx),field=e.target.dataset.field,val=e.target.textContent.trim();
  if(!ready || conflicted || !data[idx])return;
  if(field==='project'){
    if(!val){renderTable();showToast('项目名称不能为空','error');return;}
    const old=data[idx].project;
    if(val!==old && data.some(x=>x.project===val)){renderTable();showToast('已有同名项目，请使用不同名称','error');return;}
    projects=projectNames().map(x=>x===old?val:x);data.forEach(x=>{if(x.project===old)x.project=val;});
    if(projectPriorities[old]){projectPriorities[val]=projectPriorities[old];delete projectPriorities[old];}
    archive.forEach(x=>{if(x.project===old)x.project=val;});
  }else data[idx][field]=val;
  saveData();renderTable();updateStats();
}

function handleCheckboxChange(e) {
  const idx = parseInt(e.target.dataset.idx);
  data[idx].done = e.target.checked;
  data[idx].status = e.target.checked ? '已完成' : '进行中';
  if (e.target.checked) {
    data[idx].completedDate = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  } else {
    delete data[idx].completedDate;
  }
  saveData();
  console.log("[init] data length:", data.length); renderTable();
  updateStats();
}

function updateStats() {
  const total = data.length;
  const done = data.filter(d => d.done).length;
  const undone = total - done;
  let warn = 0, danger = 0;
  data.forEach(item => {
    if (item.done) return;
    const od = getOverdueDays(item.plannedDate);
    if (od && od >= 14) danger++;
    else if (od && od >= 7) warn++;
  });
}

function escapeHtml(str) {

}

function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

function stableValue(value){if(Array.isArray(value))return value.map(stableValue);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,stableValue(value[k])]));return value;}

  }catch(e){showToast(e.message,'error');}
 });
 button('保留云端数据',async()=>{if(!confirm('确认保留云端数据，并丢弃这份本地未同步副本？'))return;localStorage.removeItem(PENDING_KEY);unresolvedPending=null;pendingState=null;conflicted=false;dataDirty=false;await loadData();renderTable();updateStats();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);overlay.remove();});
 button('稍后处理',()=>overlay.remove());panel.appendChild(actions);overlay.appendChild(panel);document.body.appendChild(overlay);
}
function setSync(msg){if(/失败|暂停|未同步|仍保留/.test(msg))showToast(msg,'error');}
function viewArchive(){
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const title=document.createElement('h3');title.textContent='已完成记录（'+archive.length+'）';panel.appendChild(title);
 archive.forEach(x=>{const p=document.createElement('p');p.style.marginBottom='16px';p.textContent=x.project+' · '+x.task+' · 完成日期：'+(x.completedDate||'未记录')+' · 备注：'+(x.note||'');panel.appendChild(p);});
 const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.onclick=()=>overlay.remove();panel.appendChild(close);overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}
window.addEventListener('beforeunload',e=>{if(dataDirty){e.preventDefault();e.returnValue='';}});
function projectNames(){return [...new Set([...projects,...data.map(x=>x.project),...archive.map(x=>x.project)])];}
function addProjectByName(name){
 if(!ready||conflicted)return false;
 name=name.trim();
 if(!name||name.length>120){showToast('请输入不超过120字的项目名称','error');return false;}
 if(projectNames().includes(name)){showToast('项目已存在','error');return false;}
 projects.push(name);saveData();return true;
}
function removeProject(name){
 if(!ready||conflicted)return false;
 const issues=data.filter(x=>x.project===name),records=archive.filter(x=>x.project===name);
 if(!confirm('删除项目「'+name+'」？关联 '+issues.length+' 条当前问题、'+records.length+' 条归档记录将一起移入项目回收站，可恢复。'))return false;
 deletedProjects.push({name,data:issues,archive:records,priority:projectPriorities[name]||'',deletedAt:new Date().toISOString()});
 projects=projectNames().filter(x=>x!==name);data=data.filter(x=>x.project!==name);archive=archive.filter(x=>x.project!==name);delete projectPriorities[name];saveData();renderTable();return true;
}
function restoreProject(index){
 if(!ready||conflicted)return false;
 const p=deletedProjects[index];if(!p)return false;
 if(projectNames().includes(p.name)){showToast('已有同名项目，请先重命名后再恢复','error');return false;}
 projects.push(p.name);data.push(...p.data);archive.push(...p.archive);if(p.priority)projectPriorities[p.name]=p.priority;deletedProjects.splice(index,1);saveData();renderTable();return true;
}
function manageProjects(){
 if(!ready||conflicted){showToast('请先恢复云端连接并处理同步冲突','error');return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const draw=()=>{
  populateProjectSelect();
  panel.replaceChildren();
  const h=document.createElement('h3');h.textContent='项目管理';panel.appendChild(h);
  const input=document.createElement('input');input.type='text';input.placeholder='项目编号 + 名称，如 P017 新项目';input.maxLength=120;input.setAttribute('aria-label','新项目名称');panel.appendChild(input);
  const add=document.createElement('button');add.className='btn btn-success';add.textContent='添加项目';add.onclick=()=>{if(addProjectByName(input.value))draw();};panel.appendChild(add);
  projectNames().sort((a,b)=>a.localeCompare(b,'zh')).forEach(name=>{
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb';
   const label=document.createElement('span');label.textContent=name+'（'+data.filter(x=>x.project===name).length+' 条问题）';row.appendChild(label);
   const del=document.createElement('button');del.className='btn btn-outline';del.textContent='删除';del.onclick=()=>{if(removeProject(name))draw();};row.appendChild(del);panel.appendChild(row);
  });
  const rh=document.createElement('h3');rh.textContent='项目回收站（'+deletedProjects.length+'）';rh.style.marginTop='20px';panel.appendChild(rh);
  deletedProjects.forEach((p,i)=>{const row=document.createElement('div');row.style.padding='8px 0';const label=document.createElement('span');label.textContent=p.name+' ';row.appendChild(label);const b=document.createElement('button');b.className='btn btn-outline';b.textContent='恢复';b.onclick=()=>{if(restoreProject(i))draw();};row.appendChild(b);panel.appendChild(row);});
  const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.style.marginTop='16px';close.onclick=()=>overlay.remove();panel.appendChild(close);
 };
 draw();overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
