/* ========================================
   ANIMATION TOKENS
   @keyframes definitions and animation utilities
   ======================================== */

@theme {
  /* ========================================
     ANIMATION SHORTCUTS
     ======================================== */
  --animate-fade-in: fade-in 0.15s ease-out;
  --animate-slide-in: slide-in 0.2s ease-out;
  --animate-scale-in: scale-in 0.2s ease-out;
  --animate-float: float 3s ease-in-out infinite;
  --animate-orb-float: orb-float 8s ease-in-out infinite;
  --animate-pulse-glow: pulse-glow 2s ease-in-out infinite;
  --animate-shimmer: shimmer 2s infinite;
  --animate-accordion-down: accordion-down 0.2s ease-out;
  --animate-accordion-up: accordion-up 0.2s ease-out;
}

/* ========================================
   KEYFRAME DEFINITIONS
   ======================================== */

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slide-in {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}

@keyframes scale-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}

@keyframes orb-float {
  0%,
  100% {
    transform: translate(0, 0) scale(1);
  }
  33% {
    transform: translate(10px, -10px) scale(1.05);
  }
  66% {
    transform: translate(-5px, 5px) scale(0.95);
  }
}

@keyframes pulse-glow {
  0%,
  100% {
    box-shadow: var(--shadow-md);
  }
  50% {
    box-shadow: var(--glow-primary);
  }
}

@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes accordion-down {
  from {
    height: 0;
  }
  to {
    height: var(--radix-accordion-content-height);
  }
}

@keyframes accordion-up {
  from {
    height: var(--radix-accordion-content-height);
  }
  to {
    height: 0;
  }
}

@keyframes btn-shine {
  0% {
    left: -100%;
  }
  50%,
  100% {
    left: 100%;
  }
}

@keyframes ripple {
  0% {
    transform: scale(0);
    opacity: 0.6;
  }
  100% {
    transform: scale(4);
    opacity: 0;
  }
}

@keyframes glow-pulse {
  0%,
  100% {
    opacity: 0.6;
    filter: brightness(1);
  }
  50% {
    opacity: 1;
    filter: brightness(1.2);
  }
}

@keyframes skeleton-loading {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes modalFadeIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes dropdownFadeIn {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes circular-progress-spin {
  0% {
    transform: rotate(0deg);
    stroke-dashoffset: 187;
  }
  50% {
    stroke-dashoffset: 47;
  }
  100% {
    transform: rotate(360deg);
    stroke-dashoffset: 187;
  }
}

/* ========================================
   ANIMATION UTILITY CLASSES
   ======================================== */

.animate-fade-in {
  animation: fade-in 0.15s ease-out;
}

.animate-slide-in {
  animation: slide-in 0.2s ease-out;
}

.animate-scale-in {
  animation: scale-in 0.2s ease-out;
}

.animate-float {
  animation: float 3s ease-in-out infinite;
}

.animate-orb-float {
  animation: orb-float 8s ease-in-out infinite;
}

.animate-pulse-glow {
  animation: pulse-glow 2s ease-in-out infinite;
}

.animate-shimmer {
  animation: shimmer 2s infinite;
}

.animate-glow-pulse {
  animation: glow-pulse 2s ease-in-out infinite;
}

.animate-skeleton-loading {
  animation: skeleton-loading 1.5s infinite;
}

.animate-circular-progress-spin {
  animation: circular-progress-spin 1.4s ease-in-out infinite;
  transform-origin: center;
}

/* ========================================
   HOVER TRANSITION UTILITIES
   ======================================== */

.hover-glow {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.hover-glow:hover {
  transform: translateY(-2px);
}

/* ========================================
   SPARKLINE GLASS ANIMATIONS
   ======================================== */

@keyframes sparkline-grow {
  from {
    transform: scaleY(0);
    opacity: 0;
  }
  to {
    transform: scaleY(1);
    opacity: 1;
  }
}

.animate-sparkline-grow {
  animation: sparkline-grow 0.4s ease-out forwards;
  transform-origin: bottom;
}

/* ========================================
   INSIGHT CARD GLASS ANIMATIONS
   ======================================== */

@keyframes insight-fade-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-insight-fade-in {
  animation: insight-fade-in 0.3s ease-out forwards;
}

/* Page-specific business layout. Shared controls belong to workspace.css. */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font: 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
button,input,textarea,select {
  font: inherit;
}
button,a,input,textarea,select {
  outline-offset: 4px;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: .55;
  cursor: wait;
}
a {
  color: var(--accent);
}
.backlink {
  display: inline-block;
  padding: 8px 0;
  text-decoration: none;
  color: var(--accent);
}
.sync-status {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text-light);
  font-size: 15px;
  margin-bottom: 20px;
}
.search-box {
  position: relative;
  width: 100%;
}
.toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
select {
  padding: 10px 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
input:focus,select:focus,textarea:focus {
  border-color: var(--accent);
}
.btn:hover {
  background: var(--bg);
}
.btn-primary,.btn-success,.btn-add {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.btn-primary:hover,.btn-success:hover,.btn-add:hover {
  background: var(--semantic-info-muted);
}
.btn-outline,.btn-sync {
  background: var(--card);
  color: var(--text);
}
.btn-sync:hover {
  background: var(--soft);
  color: var(--accent);
}
.btn-del {
  color: var(--danger);
  background: var(--card);
}
.btn-del:hover {
  background: var(--danger-bg);
}
.btn svg {
  width: 16px;
}
.btn-sync.syncing {
  pointer-events: none;
  opacity: .6;
}
.btn-sync.syncing .spin {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
}
thead th:first-child {
  padding-left: 20px;
}
tbody td {
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody td:first-child {
  padding-left: 20px;
}
tbody tr:hover {
  background: var(--semantic-surface);
}
tbody tr.done-row {
  background: var(--done-bg);

:root {
  --bg: var(--semantic-surface);
  --card: var(--semantic-surface);
  --primary: var(--semantic-info-text);
  --accent: var(--semantic-info-text);
  --success: var(--semantic-success-text);
  --warning: var(--semantic-warning-text);
  --danger: var(--semantic-error-text);
  --done-bg: var(--semantic-text-inverse);
  --warn-bg: var(--semantic-text-inverse);
  --danger-bg: var(--semantic-text-inverse);
  --text: var(--semantic-info-text);
  --text-light: var(--semantic-info-text);
  --border: var(--semantic-border);
  --soft: var(--semantic-surface);
  --shadow: none;
  --shadow-lg: var(--shadow-sm);
  --motion-fast: var(--duration-fast);
  --motion-enter: var(--workspace-motion-control);
  --motion-ease: var(--workspace-motion-ease);
}
.btn,input,select,textarea {
  transition: background-color var(--motion-fast) ease,border-color var(--motion-fast) ease,color var(--motion-fast) ease,opacity var(--motion-fast) ease;
}
.modal {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  width: min(560px,calc(100% - 32px));
  max-height: 90dvh;
  overflow: auto;
  box-shadow: var(--shadow-sm);
  animation: project-modal-enter var(--motion-enter) var(--motion-ease);
}
@keyframes project-modal-enter {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);

async function flushSave(){

  while(pendingState&&!conflicted){
   const snapshot=pendingState;pendingState=null;setSync('正在保存…');
   try{

    const r=await fetch('/api/state/patch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operations})});const saved=await r.json();
    if(!r.ok){if(r.status===409)conflicted=true;throw Error(saved.error||'云端保存失败');}
    const cloud=trackerSnapshot(saved.state);
    if(pendingState){
     const queued=ensureProjectIds(pendingState),queuedOps=recordChanges(local,queued,PROJECT_COLLECTIONS);
     const merged=applyRecordChanges(cloud,queuedOps,PROJECT_COLLECTIONS);useCloudTracker({...merged,version:saved.state.version});cloudBase=structuredClone(cloud);pendingState={...merged,base:structuredClone(cloud)};
    }else{useCloudTracker(saved.state);dataDirty=false;if(legacyPendingRaw&&localStorage.getItem(PENDING_KEY)===legacyPendingRaw){localStorage.removeItem(PENDING_KEY);legacyPendingRaw=null;}renderTable();updateStats();setSync('已保存至云端');}

   }catch(e){pendingState=pendingState||snapshot;dataDirty=true;if(conflicted){unresolvedPending=structuredClone(pendingState);pendingCloud=structuredClone(cloudBase);document.getElementById('pendingMessage').textContent='同一记录有冲突，当前未保存输入仅保留在此页面，请核对后重试。';document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);}setSync(e.message+'；修改尚未保存，请保持页面打开并重试');return false;}
  }

 })();try{return await saving;}finally{saving=null;if(!conflicted&&!unresolvedPending)lockPendingEditing(false);}
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function getOverdueDays(dateStr) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr||''))return null;
  const now=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const diff=Math.floor((Date.parse(now+'T00:00:00Z')-Date.parse(dateStr+'T00:00:00Z'))/86400000);
  return diff>0?diff:null;
}

function handleCellEdit(e) {
  const idx=Number(e.target.dataset.idx),field=e.target.dataset.field,val=e.target.textContent.trim();

  if(field==='project'){

function updateStats() {
  const total = data.length;
  const done = data.filter(d => d.done).length;
  const undone = total - done;
  let warn = 0, danger = 0;
  data.forEach(item => {
    if (item.done) return;
    const od = getOverdueDays(item.plannedDate);
    if (od && od >= 14) danger++;
    else if (od && od >= 7) warn++;
  });
}

  };

  document.getElementById('addModal').dataset.draftId=newItem.id;
  const existing=data.findIndex(x=>x.id===newItem.id);if(existing>=0)data[existing]=newItem;else data.push(newItem);
  if(await saveData()){closeAddModal();delete document.getElementById('addModal').dataset.draftId;showToast('问题已保存到云端','success');}else document.getElementById('addIssueError').textContent='保存未成功，输入仍保留，请检查连接后重试。';
}

// ========== 工具函数 ==========
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg,type){const node=document.getElementById('toast');if(window.WorkspaceFeedback)return window.WorkspaceFeedback.show(node,msg,type==='error'?'error':type==='success'?'success':'info');node.textContent=msg;node.hidden=false;}

// 点击遮罩关闭弹窗
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});


let projects=[],deletedProjects=[],archive=[],cloudVersion=0,ready=false,conflicted=false,pendingState=null,saving=null,unresolvedPending=null,pendingCloud=null,cloudBase=null,legacyPendingRaw=null;
const PENDING_KEY='project_tracker_pending_v3';
// PENDING_HELPERS_START
function stableValue(value){if(Array.isArray(value))return value.map(stableValue);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).filter(k=>k!=='id').sort().map(k=>[k,stableValue(value[k])]));return value;}
function trackerSnapshot(s){return {data:s.data,priorities:s.priorities||{},archive:s.archive||[],projects:s.projects||[],deletedProjects:s.deletedProjects||[]};}
function sameTracker(a,b){return JSON.stringify(stableValue(trackerSnapshot(a)))===JSON.stringify(stableValue(trackerSnapshot(b)));}
function validPending(s){return !!s&&Array.isArray(s.data)&&Array.isArray(s.archive)&&Array.isArray(s.projects)&&Array.isArray(s.deletedProjects)&&s.priorities&&typeof s.priorities==='object'&&!Array.isArray(s.priorities);}
// PENDING_HELPERS_END
function currentTracker(){return trackerSnapshot({data,priorities:projectPriorities,archive,projects,deletedProjects});}
function lockPendingEditing(locked){projectToolbar.querySelectorAll('button').forEach(b=>b.disabled=locked);document.getElementById('tableBody').style.pointerEvents=locked?'none':'';document.getElementById('tableBody').inert=locked;}
function inspectPending(){
 try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(PRIORITY_STORAGE_KEY);}catch{}
 const raw=localStorage.getItem(PENDING_KEY);if(!raw)return;legacyPendingRaw=raw;
 let saved;try{saved=JSON.parse(raw);}catch{}
 if(validPending(saved)&&sameTracker(saved,currentTracker())){localStorage.removeItem(PENDING_KEY);return;}
 unresolvedPending=validPending(saved)?saved:{invalid:true,raw};pendingCloud=currentTracker();
 document.getElementById('pendingMessage').textContent=unresolvedPending.invalid?'本地副本格式异常，请查看后处理。':'本地副本与云端不同，请选择恢复本地副本或保留云端数据后继续编辑。';
 document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);
}
function reviewPending(){return openPendingReview();}
async function openPendingReview(){
 if(!unresolvedPending)return;
 try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法读取云端，请稍后重试');const latest=await r.json();pendingCloud=trackerSnapshot(latest);}catch(e){showToast(e.message,'error');return;}
 const overlay=document.createElement('dialog');overlay.className='workspace-panel';const panel=document.createElement('div');panel.className='workspace-panel-body';
 const h=document.createElement('h3');h.textContent='核对本地副本';panel.appendChild(h);
 const info=document.createElement('p');info.textContent='下方展示最新云端数据与本地副本。恢复会替换问题、项目和归档记录；请先核对。';panel.appendChild(info);
 for(const [label,value] of [['云端数据',pendingCloud],['本地副本',unresolvedPending]]){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=label;details.appendChild(summary);const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:240px;overflow:auto';pre.textContent=JSON.stringify(value,null,2);details.appendChild(pre);panel.appendChild(details);}
 const actions=document.createElement('div');actions.className='modal-actions';
 const button=(label,fn)=>{const b=document.createElement('button');b.className='btn btn-outline';b.textContent=label;b.onclick=fn;actions.appendChild(b);return b;};
 if(!unresolvedPending.invalid)button('恢复本地副本',async()=>{
  if(!await window.WorkspacePrimitives.confirm({title:'确认操作',description:'确认用本地副本替换当前云端问题表？请确保已核对两份数据。',action:'恢复本地副本'}))return;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法核对云端，请稍后重试');const latest=await r.json();if(!sameTracker(latest,pendingCloud)){showToast('云端再次更新，请刷新后重新核对。本地副本仍保留。','error');return;}
   const saved=unresolvedPending;cloudVersion=latest.version;cloudBase=structuredClone(trackerSnapshot(latest));unresolvedPending=null;conflicted=false;data=structuredClone(saved.data);projectPriorities=structuredClone(saved.priorities);archive=structuredClone(saved.archive);projects=structuredClone(saved.projects);deletedProjects=structuredClone(saved.deletedProjects);overlay.remove();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);renderTable();await saveData();
  }catch(e){showToast(e.message,'error');}
 });
 button('保留云端数据',async()=>{if(!await window.WorkspacePrimitives.confirm({title:'确认操作',description:'确认保留云端数据，并丢弃这份本地未同步副本？',action:'保留云端数据'}))return;localStorage.removeItem(PENDING_KEY);unresolvedPending=null;pendingState=null;conflicted=false;dataDirty=false;await loadData();renderTable();updateStats();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);overlay.remove();});
 button('稍后处理',()=>overlay.remove());panel.appendChild(actions);overlay.appendChild(panel);document.body.appendChild(overlay);window.WorkspacePrimitives.openDialog(overlay);
}
function setSync(msg){
 if(/失败|暂停|未同步|仍保留|尚未保存/.test(msg))showToast(msg,'error');
}
function viewArchive(){
 const overlay=document.createElement('dialog');overlay.className='workspace-panel';
 const panel=document.createElement('div');panel.className='workspace-panel-body';
 const title=document.createElement('h3');title.textContent='已完成记录（'+archive.length+'）';panel.appendChild(title);
 archive.forEach(x=>{const p=document.createElement('p');p.style.marginBottom='16px';p.textContent=displayProject(x.project)+' · '+x.task+' · 完成日期：'+(x.completedDate||'未记录')+' · 备注：'+(x.note||'');panel.appendChild(p);});
 const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.onclick=()=>overlay.remove();panel.appendChild(close);overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);window.WorkspacePrimitives.openDialog(overlay);
}
window.addEventListener('beforeunload',e=>{if(dataDirty){e.preventDefault();e.returnValue='';}});
function projectNames(){return [...new Set([...projects,...data.map(x=>x.project),...archive.map(x=>x.project)])];}
async function removeProject(name){
 if(!ready||conflicted)return false;
 const issues=data.filter(x=>x.project===name),records=archive.filter(x=>x.project===name);
 if(!await window.WorkspacePrimitives.confirm({title:'确认操作',description:'删除项目「'+name+'」？关联 '+issues.length+' 条当前问题、'+records.length+' 条归档记录将一起移入项目回收站，可恢复。',action:'移入回收站'}))return false;
 deletedProjects.push({name,data:issues,archive:records,priority:projectPriorities[name]||'',deletedAt:new Date().toISOString()});
 projects=projectNames().filter(x=>x!==name);data=data.filter(x=>x.project!==name);archive=archive.filter(x=>x.project!==name);delete projectPriorities[name];saveData();renderTable();return true;
}
function restoreProject(index){
 if(!ready||conflicted)return false;
 const p=deletedProjects[index];if(!p)return false;
 if(projectNames().includes(p.name)){showToast('已有同名项目，请先重命名后再恢复','error');return false;}
 projects.push(p.name);data.push(...p.data);archive.push(...p.archive);if(p.priority)projectPriorities[p.name]=p.priority;deletedProjects.splice(index,1);saveData();renderTable();return true;
}
function manageProjects(){
 if(!ready||conflicted){showToast('请先恢复云端连接并处理同步冲突','error');return;}
 const overlay=document.createElement('dialog');overlay.className='workspace-panel';
 const panel=document.createElement('div');panel.className='workspace-panel-body';
 const heading=document.createElement('h3');heading.textContent='项目管理';
 const draw=()=>{
  populateProjectSelect();
  panel.replaceChildren();
  panel.appendChild(heading);
  const add=document.createElement('button');add.className='btn btn-success';add.textContent='新建项目';add.onclick=()=>showProjectCreate(()=>{draw();panel.querySelector('button')?.focus();},add);panel.appendChild(add);
  projectNames().sort((a,b)=>a.localeCompare(b,'zh')).forEach(name=>{
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--semantic-border)';
   const label=document.createElement('span');label.textContent=displayProject(name)+'（'+data.filter(x=>x.project===name).length+' 条问题）';row.appendChild(label);
   const del=document.createElement('button');del.className='btn btn-outline';del.textContent='删除';del.onclick=async()=>{if(await removeProject(name))draw();};row.appendChild(del);panel.appendChild(row);
  });
  const rh=document.createElement('h3');rh.textContent='项目回收站（'+deletedProjects.length+'）';rh.style.marginTop='20px';panel.appendChild(rh);
  deletedProjects.forEach((p,i)=>{const row=document.createElement('div');row.style.padding='8px 0';const label=document.createElement('span');label.textContent=displayProject(p.name)+' ';row.appendChild(label);const b=document.createElement('button');b.className='btn btn-outline';b.textContent='恢复';b.onclick=()=>{if(restoreProject(i))draw();};row.appendChild(b);panel.appendChild(row);});
  const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.style.marginTop='16px';close.onclick=()=>overlay.remove();panel.appendChild(close);
 };
 draw();overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);window.WorkspacePrimitives.openDialog(overlay);
}

document.addEventListener('DOMContentLoaded', init);
document.addEventListener('DOMContentLoaded',()=>window.WorkspacePrimitives?.install());
</script>
