<!DOCTYPE html>

<style>

button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:32px 24px}.header{background:transparent;color:var(--text);padding:0;margin-bottom:24px}.header h1{font-size:30px;line-height:1.3;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:8px}.backlink{display:inline-block;padding:8px 0;text-decoration:none;color:var(--accent)}

.toolbar-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.toolbar-row>select{width:160px;height:44px;flex:0 0 160px}select{padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer}input:focus,select:focus,textarea:focus{border-color:var(--accent)}

.table-wrapper{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow-x:auto;margin-bottom:20px}table{width:100%;min-width:1100px;border-collapse:collapse}thead th{background:#f8f9fc;color:var(--text-light);padding:14px 16px;font-size:13px;font-weight:600;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}thead th:first-child{padding-left:20px}tbody td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}tbody td:first-child{padding-left:20px}tbody tr:hover{background:#fafbff}tbody tr.done-row{background:var(--done-bg)}tbody tr.done-row td{color:#277856}tbody tr.warn-row{background:var(--warn-bg)}tbody tr.danger-row{background:var(--danger-bg)}
.project-group-header{padding:14px 20px;background:var(--soft);color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}.project-group-header .badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card);color:var(--accent)}.project-group-header.collapsed .toggle-icon{transform:rotate(-90deg)}
td[contenteditable=true],.proj-name{outline-offset:2px;cursor:text}td[contenteditable=true]:focus,.proj-name:focus{background:var(--soft);outline:2px solid var(--accent)}.cb-wrap{text-align:center}.cb-wrap input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}.status-badge{white-space:nowrap;display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}.status-badge.进行中{background:var(--soft);color:var(--accent)}.status-badge.已完成{background:#dceee3;color:#277856}.status-badge.暂停{background:#fff0c9;color:#8e6413}.overdue-tag{font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap}.overdue-tag.yellow{background:#fff0c9;color:#8e6413}.overdue-tag.red{background:#ffe2dc;color:var(--danger)}
.date-cell{white-space:nowrap;font-variant-numeric:tabular-nums}.date-cell input{width:140px;min-height:36px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--text);background:var(--card);cursor:pointer}.date-cell input.empty-date{border-style:dashed;color:var(--text-light)}.seq-cell{text-align:center;color:var(--text-light);font-size:13px;font-weight:500}.legend{display:flex;flex-wrap:wrap;gap:16px;padding:14px 20px;border-top:1px solid var(--border);color:var(--text-light);font-size:12px;background:var(--card)}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:10px;height:10px;border-radius:3px}.table-actions{display:flex;flex-wrap:wrap;gap:8px}
.proj-cell-wrap,.status-cell-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}.proj-name{font-weight:600;color:var(--text);white-space:normal;overflow-wrap:anywhere}.priority-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:26px}.priority-badge:hover{outline:1px solid currentColor}.priority-urgent{background:#ffe2dc;color:var(--danger)}.priority-high{background:#fff0d9;color:#a85d13}.priority-medium{background:var(--soft);color:var(--accent)}.priority-low,.priority-none{background:#f0f3f8;color:var(--text-light)}.priority-none{border:1px dashed var(--border)}
.priority-dropdown,.status-dropdown{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:var(--shadow-lg);z-index:200;display:flex;flex-direction:column;gap:3px;min-width:120px}.priority-dropdown .pd-item,.status-dropdown .sd-item{padding:10px 12px;min-height:40px;background:none;border:0;border-radius:6px;text-align:left;font-size:13px;color:var(--text);cursor:pointer}.priority-dropdown .pd-item:hover,.status-dropdown .sd-item:hover{background:var(--bg)}.priority-dropdown .pd-item.active{background:var(--soft);color:var(--accent)}
.modal-overlay{display:none;position:fixed;inset:0;background:#18243a70;z-index:1000;align-items:center;justify-content:center}.modal-overlay.active{display:flex}.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:28px;width:min(560px,calc(100% - 32px));max-height:90dvh;overflow:auto;box-shadow:0 24px 80px #18243a25}.modal h3{font-size:20px;margin:0 0 16px}.modal label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}.modal input[type=text],.modal input[type=date],.modal select,.modal textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;color:var(--text);background:var(--card);font:inherit}.modal textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:white;border-radius:10px;padding:12px 18px;font-size:14px;z-index:2000;max-width:calc(100% - 32px);display:none;align-items:center;gap:8px}.toast.show{display:flex}.toast.success{background:var(--text)}.toast.error{background:var(--danger)}.toast svg{flex-shrink:0;stroke:currentColor}
@media(max-width:760px){.container{padding:20px 16px}.header h1{font-size:25px}.toolbar{padding:16px}.toolbar-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toolbar-row>*{width:100%;min-width:0}.toolbar-row>select{width:100%;height:44px;flex:none}.toolbar-row>.btn:last-child{grid-column:1/-1}.btn,select{font-size:13px;padding:10px 12px;min-height:44px}.table-wrapper{border-radius:16px}table{min-width:1050px}.modal{padding:24px 20px}.modal-actions{flex-wrap:wrap}.table-actions .btn{flex:1}.date-cell input{min-height:40px}.legend{padding:14px 16px;gap:12px}}
@media(prefers-reduced-motion:reduce){.btn-sync.syncing .spin{animation:none}}
/* Compact table: equal filters, smaller gutters, touch targets retained. */
.container{max-width:none;padding:20px 24px}.header{margin-bottom:14px}.header h1{font-size:25px}.toolbar{padding:12px;border-radius:12px;margin-bottom:12px;gap:8px}.toolbar-row>select{height:36px;min-height:36px;padding:6px 10px}.btn{min-height:36px;padding:7px 12px}.table-wrapper{border-radius:12px;margin-bottom:12px}thead th,tbody td{padding:10px 12px}thead th:first-child,tbody td:first-child{padding-left:12px}.status-cell-wrap,.proj-cell-wrap{gap:4px}.legend{gap:12px;padding:8px 12px}.modal{padding:20px;border-radius:14px}.modal label{margin:12px 0 4px}.modal-actions{margin-top:16px}.search-box input{min-height:36px;padding:7px 12px 7px 36px}.search-box::before{top:10px;left:12px}.search-box::after{top:23px;left:25px}
@media(max-width:760px){.container{padding:12px}.toolbar{padding:10px}.toolbar-row>select,.btn,.search-box input{min-height:44px;height:44px}.toolbar-row>.btn:last-child{grid-column:auto}.search-box::before{top:14px}.search-box::after{top:27px}.modal{padding:16px}.legend{gap:10px}.date-cell input{min-height:44px}.status-badge,.priority-badge{min-height:44px;display:inline-flex;align-items:center}}

.project-priority{border:1px solid transparent;gap:5px;min-height:30px;padding:4px 8px}.project-priority::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.issue-status{width:110px;min-height:36px;padding:6px 8px;font-size:13px;background:var(--card);color:var(--accent)}.issue-status[data-status="暂停"]{color:#8e6413}.issue-status[data-status="已完成"]{color:#277856}
@media(max-width:760px){.project-priority,.issue-status{min-height:44px}}

/* Keep controls outside the table's scroll area and freeze column headers. */
.container{height:100dvh;display:flex;flex-direction:column;min-height:0}.container>.header,.container>.toolbar,.container>.table-actions,#pendingNotice{flex-shrink:0}.toolbar{position:relative;z-index:100}.table-wrapper{flex:1;min-height:120px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}thead th{position:sticky;top:0;z-index:50;background:#f8f9fc;box-shadow:0 1px 0 var(--border)}

@media(min-width:1000px){.toolbar{flex-direction:row;align-items:center;gap:8px}.search-box{flex:1;min-width:160px;width:auto}.toolbar-row{flex-wrap:nowrap;flex-shrink:0}.toolbar-row>select{width:125px;flex-basis:125px}.toolbar-row .btn{padding:7px 10px}}

.toolbar .search-box input,.toolbar-row>select,.toolbar-row>.btn{height:40px;min-height:40px;border-radius:8px;font-size:14px;line-height:20px;padding-top:9px;padding-bottom:9px}.toolbar-row>select,.toolbar-row>.btn{width:120px;flex:0 0 120px;padding-left:10px;padding-right:10px}.toolbar .search-box::before{top:12px}.toolbar .search-box::after{top:25px}
@media(max-width:760px){.toolbar .search-box input,.toolbar-row>select,.toolbar-row>.btn{height:44px;min-height:44px}.toolbar-row>select,.toolbar-row>.btn{width:100%;flex:none}.toolbar .search-box::before{top:14px}.toolbar .search-box::after{top:27px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span id="titleIcon"></span> 项目问题跟进表</h1>
    <a href="/work" class="backlink">← 返回工作工作台</a>
  </div>

<div id="pendingNotice" role="status" style="display:none;margin-bottom:16px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--soft)"><span id="pendingMessage"></span> <button class="btn btn-outline" onclick="reviewPending()">查看本地副本</button></div>
<div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索问题 / 原因 / 备注 / 项目…">
    </div>
    <div class="toolbar-row">
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="未完成">未完成</option>
        <option value="已完成">已完成</option>
      </select>
      <select id="filterOverdue">
        <option value="">全部超期</option>
        <option value="7">超7天（黄）</option>
        <option value="14">超14天（红）</option>
      </select>
      <select id="filterPriority">
        <option value="">全部优先级</option>
        <option value="urgent">🔴 紧急</option>
        <option value="high">🟠 高</option>
        <option value="medium">🔵 中</option>
        <option value="low">⚪ 低</option>
        <option value="none">无标记</option>
      </select>
      <button class="btn btn-add" onclick="showAddModal()" title="添加新问题" id="btnAdd"></button>
      <button class="btn btn-outline" id="btnSave" type="button" onmousedown="event.preventDefault()" onclick="manualSave()" title="将当前修改保存到云端">保存</button>
      <button class="btn btn-del" onclick="deleteCompleted()" title="删除所有已完成的问题" id="btnDel"></button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="min-width:140px">项目名称</th>
          <th style="width:50px">序号</th>
          <th style="min-width:240px">问题/待办事项</th>
          <th style="min-width:200px">问题原因</th>
          <th style="width:100px">当前状态</th>
          <th style="width:90px">超期</th>
          <th style="width:130px">计划完成日期</th>
          <th style="width:60px">✓</th>
          <th style="min-width:200px">备注</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#d1fae5"></div>已完成</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fef3c7"></div>未完成超7天</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fee2e2"></div>未完成超14天</div>
      <div class="legend-item"><div class="legend-dot" style="background:#dbeafe"></div>进行中/暂停</div>
    </div>
  </div>

  <div class="table-actions"><button class="btn btn-outline" onclick="viewArchive()">查看已完成记录</button></div>

</div>

<!-- Add Issue Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="modalTitle">添加新问题</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px"><label style="margin:0">所属项目</label><button type="button" class="btn btn-outline" onclick="manageProjects()">项目管理</button></div>
    <select id="addProject"></select>
    <div id="newProjectRow" style="display:none;margin-top:6px;display:none;gap:8px;align-items:center">
      <input type="text" id="newProjectInput" placeholder="输入新项目名，如 P016 XXX项目" style="flex:1;padding:8px 12px;border:2px solid var(--accent);border-radius:8px;font-size:14px;outline:none">
      <button class="btn btn-primary" style="padding:8px 14px;font-size:13px" onclick="confirmNewProject()">确认</button>
      <button class="btn btn-outline" style="padding:8px 10px;font-size:13px" onclick="cancelNewProject()">取消</button>
    </div>
    <label>问题/待办事项</label>
    <textarea id="addTask" placeholder="描述问题或待办事项…"></textarea>
    <label>问题原因</label>
    <input type="text" id="addReason" placeholder="原因（可选）">
    <label>计划完成日期</label>
    <input type="date" id="addDate">
    <label>备注</label>
    <textarea id="addNote" placeholder="备注信息（可选）" style="height:60px"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
      <button class="btn btn-success" onclick="addIssue()">确认添加</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* CLOUD_RECORDS_START */
const WORKSPACE_COLLECTIONS=['tasks','notes','events','expenses','maintenance','dailyRoutines','vocabulary','completedGames','driveLinks','wardrobe','outfits'];
const PROJECT_COLLECTIONS=['data','archive','deletedProjects','projects','priorities'];
function canonical(value){if(Array.isArray(value))return value.map(canonical);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));return value;}
function equalRecord(a,b){return JSON.stringify(canonical(a))===JSON.stringify(canonical(b));}
function ensureProjectIds(source){
 const out=structuredClone(source);for(const collection of ['data','archive','deletedProjects']){const used=new Set();for(const row of out[collection]||[]){if(!row.id){const text=JSON.stringify(canonical(row));let a=2166136261,b=5381;for(const c of text){a=Math.imul(a^c.charCodeAt(0),16777619);b=Math.imul(b,33)^c.charCodeAt(0);}const prefix='legacy-'+(a>>>0).toString(16)+(b>>>0).toString(16);let id=prefix,n=0;while(used.has(id))id=prefix+'-'+(++n);row.id=id;}if(used.has(row.id))throw Error('记录编号重复');used.add(row.id);}}return out;
}
const property=(obj,key)=>Object.hasOwn(obj,key)?{exists:true,value:obj[key]}:{exists:false};
function recordChanges(base,next,collections){
 const operations=[];
 for(const collection of collections){
  if(collection==='priorities'){const b=base[collection]||{},n=next[collection]||{};for(const id of new Set([...Object.keys(b),...Object.keys(n)]))if(!equalRecord(property(b,id),property(n,id)))operations.push({collection,id,action:'value',before:property(b,id),after:property(n,id)});continue;}
  if(collection==='projects'){const b=new Set(base.projects||[]),n=new Set(next.projects||[]);for(const id of new Set([...b,...n]))if(b.has(id)!==n.has(id))operations.push({collection,id,action:'membership',present:n.has(id)});continue;}
  const b=new Map((base[collection]||[]).map(x=>[x.id,x])),n=new Map((next[collection]||[]).map(x=>[x.id,x]));
  for(const id of new Set([...b.keys(),...n.keys()])){const old=b.get(id),row=n.get(id);if(equalRecord(old,row))continue;if(!old){operations.push({collection,id,action:'create',record:row});continue;}if(!row){operations.push({collection,id,action:'delete',before:old});continue;}
   const changes={};for(const field of new Set([...Object.keys(old),...Object.keys(row)]))if(field!=='id'&&!equalRecord(property(old,field),property(row,field)))changes[field]={before:property(old,field),after:property(row,field)};
   operations.push({collection,id,action:'update',changes});
  }
 }
 return operations;
}
class RecordConflict extends Error{}
function applyRecordChanges(source,operations,collections){
 if(!Array.isArray(operations)||operations.length>10000)throw Error('无效变更');const result=structuredClone(source),unsafe=new Set(['__proto__','prototype','constructor']);
 const set=(obj,key,value)=>{if(unsafe.has(key))throw Error('无效字段');if(!value||typeof value.exists!=='boolean')throw Error('无效字段值');if(value.exists)obj[key]=structuredClone(value.value);else delete obj[key];};
 for(const op of operations){if(!op||!collections.includes(op.collection)||typeof op.id!=='string'||!op.id||op.id.length>200||unsafe.has(op.id))throw Error('无效记录');
  if(op.collection==='priorities'){if(op.action!=='value')throw Error('无效变更');const map=result.priorities??={};const current=property(map,op.id);if(!equalRecord(current,op.before)&&!equalRecord(current,op.after))throw new RecordConflict('该项目优先级已更新');set(map,op.id,op.after);continue;}
  if(op.collection==='projects'){if(op.action!=='membership'||typeof op.present!=='boolean')throw Error('无效变更');const list=result.projects??=[];if(op.present&&!list.includes(op.id))list.push(op.id);if(!op.present)result.projects=list.filter(x=>x!==op.id);continue;}
  const list=result[op.collection]??=[];const index=list.findIndex(x=>x.id===op.id),current=list[index];
  if(op.action==='create'){if(!op.record||op.record.id!==op.id)throw Error('无效新增');if(current&&!equalRecord(current,op.record))throw new RecordConflict('该记录已存在');if(!current)list.push(structuredClone(op.record));}
  else if(op.action==='delete'){if(current&&!equalRecord(current,op.before))throw new RecordConflict('该记录已被修改，请核对后删除');if(current)list.splice(index,1);}
  else if(op.action==='update'){if(!current)throw new RecordConflict('该记录已删除');if(!op.changes||typeof op.changes!=='object')throw Error('无效修改');for(const [field,change] of Object.entries(op.changes)){if(field==='id'||unsafe.has(field))throw Error('无效字段');const actual=property(current,field);if(!equalRecord(actual,change.before)&&!equalRecord(actual,change.after))throw new RecordConflict('同一字段已被其他页面修改：'+field);set(current,field,change.after);}}
  else throw Error('无效操作');
 }
 return result;
}

/* CLOUD_RECORDS_END */
const DEFAULT_DATA = [];

const ALL_PROJECTS = [];

const STORAGE_KEY = 'project_tracker_data_v2';
const API_BASE = '';

const PRIORITY_LEVELS = [
  { key: '', label: '未设置', cls: 'priority-none' },
  { key: 'low', label: '低', cls: 'priority-low' },
  { key: 'medium', label: '中', cls: 'priority-medium' },

async function loadPriorities() {}

function getPriority(project) {
  return projectPriorities[project] || '';
}

function getPriorityInfo(key) {
  return PRIORITY_LEVELS.find(l => l.key === key) || PRIORITY_LEVELS[0];
}

function cyclePriority(project) {
  const current = getPriority(project);
  const idx = PRIORITY_LEVELS.findIndex(l => l.key === current);
  const next = PRIORITY_LEVELS[(idx + 1) % PRIORITY_LEVELS.length];
  if (next.key) {
    projectPriorities[project] = next.key;
  } else {
    delete projectPriorities[project];
  }
  savePriorities();
  console.log("[init] data length:", data.length); console.log("[init] About to render, data.length=", data.length);
  renderTable();
}

    btn.innerHTML = '<span class="priority-badge ' + info.cls + '">' + level.label + '</span> ' + level.label;

    const s=await r.json();
    data=s.data; projectPriorities=s.priorities; archive=s.archive; projects=s.projects||[...new Set([...data.map(x=>x.project),...archive.map(x=>x.project)])]; deletedProjects=s.deletedProjects||[]; cloudVersion=s.version;

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function getOverdueDays(dateStr) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr||''))return null;
  const now=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const diff=Math.floor((Date.parse(now+'T00:00:00Z')-Date.parse(dateStr+'T00:00:00Z'))/86400000);
  return diff>0?diff:null;
}

function getFilteredData() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const statusFilter = document.getElementById('filterStatus').value;
  const overdueFilter = document.getElementById('filterOverdue').value;
  const priorityFilter = document.getElementById('filterPriority').value;

  return data.map((item, idx) => ({...item, _idx: idx})).filter(item => {
    if (statusFilter === '未完成' && item.done) return false;
    if (statusFilter === '已完成' && !item.done) return false;
    if (overdueFilter) {
      const od = getOverdueDays(item.plannedDate);
      if (overdueFilter === '7' && (!od || od < 7)) return false;
      if (overdueFilter === '14' && (!od || od < 14)) return false;
    }
    if (priorityFilter) {
      const itemPri = getPriority(item.project);
      if (priorityFilter === 'none') {
        if (itemPri) return false;
      } else {
        if (itemPri !== priorityFilter) return false;
      }
    }
    if (search) {
      const haystack = (item.task + item.reason + item.note + item.project + item.status).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const filtered = getFilteredData();

  const groups = {};
  filtered.forEach(item => {
    if (!groups[item.project]) groups[item.project] = [];
    groups[item.project].push(item);
  });


  // 按优先级排序：紧急 > 高 > 中 > 低 > 无，同级按名称字母序
  const priOrder = { urgent: 0, high: 1, medium: 2, low: 3, '': 4 };
  Object.keys(groups).sort((a, b) => {
    const pa = priOrder[getPriority(a)] ?? 4;
    const pb = priOrder[getPriority(b)] ?? 4;
    if (pa !== pb) return pa - pb;
    return a.localeCompare(b, 'zh');
  }).forEach((proj, projIdx, projArr) => {
    const rows = groups[proj];

    rows.forEach((item, ri) => {
        const tr = document.createElement('tr');
        const od = getOverdueDays(item.plannedDate);

        if (item.done) {
          tr.className = 'done-row';
        } else if (od && od >= 14) {
          tr.className = 'danger-row';
        } else if (od && od >= 7) {
          tr.className = 'warn-row';
        }
        // 项目名称（同一项目合并行）+ 优先级标签
        if (ri === 0) {
          const projTd = document.createElement('td');
          projTd.rowSpan = rows.length;
          projTd.dataset.field = 'project';
          projTd.dataset.idx = item._idx;
          projTd.style.verticalAlign = 'middle';
          projTd.style.textAlign = 'center';
          // 根据项目优先级设置背景色
          const projPri = getPriority(item.project);
          let projBgColor = 'var(--soft)';
          if (projPri === 'urgent') {
            projBgColor = '#fee2e2';
          } else if (projPri === 'high') {
            projBgColor = '#ffedd5';
          } else if (projPri === 'medium') {
            projBgColor = '#dbeafe';
          } else if (projPri === 'low') {
            projBgColor = '#f1f5f9';
          }
          projTd.style.background = projBgColor;
          projTd.style.borderRight = '1px solid var(--border)';
          projTd.style.padding = '8px 6px';

          const wrap = document.createElement('div');
          wrap.className = 'proj-cell-wrap';

          // 项目名称（可编辑）
          const nameSpan = document.createElement('span');
          nameSpan.className = 'proj-name';
          nameSpan.contentEditable = true;
          nameSpan.dataset.idx = item._idx;
          nameSpan.dataset.field = 'project';
          nameSpan.textContent = item.project || '';
          nameSpan.addEventListener('blur', handleCellEdit);
          wrap.appendChild(nameSpan);
          const priorityButton=document.createElement('button'),info=getPriorityInfo(getPriority(item.project));
          priorityButton.type='button';priorityButton.className='priority-badge project-priority '+info.cls;
          priorityButton.textContent=info.label;priorityButton.setAttribute('aria-label','项目紧急程度：'+item.project+'，'+info.label);
          priorityButton.title='调整项目紧急程度';priorityButton.onclick=e=>{e.stopPropagation();showPriorityDropdown(item.project,priorityButton);};
          wrap.appendChild(priorityButton);

          projTd.appendChild(wrap);
          tr.appendChild(projTd);
        }

        // 序号
        const seqTd = document.createElement('td');
        seqTd.className = 'seq-cell';
        seqTd.textContent = ri + 1;
        tr.appendChild(seqTd);

        // 问题/待办
        const taskTd = document.createElement('td');
        taskTd.contentEditable = true;
        taskTd.textContent = item.task || '';
        taskTd.dataset.field = 'task';
        taskTd.dataset.idx = item._idx;
        taskTd.addEventListener('blur', handleCellEdit);
        tr.appendChild(taskTd);

        // 问题原因
        const reasonTd = document.createElement('td');
        reasonTd.contentEditable = true;
        reasonTd.textContent = item.reason || '';
        reasonTd.dataset.field = 'reason';
        reasonTd.dataset.idx = item._idx;
        reasonTd.addEventListener('blur', handleCellEdit);
        tr.appendChild(reasonTd);

        // Each issue has an independent processing status.
        const statusTd=document.createElement('td');
        const statusSelect=document.createElement('select');
        statusSelect.className='issue-status';statusSelect.setAttribute('aria-label','问题处理状态：'+item.task);
        ['进行中','暂停','已完成'].forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;statusSelect.appendChild(option);});
        statusSelect.value=item.done?'已完成':item.status;
        statusSelect.dataset.status=statusSelect.value;
        statusSelect.onchange=()=>setIssueStatus(item._idx,statusSelect.value);
        statusTd.appendChild(statusSelect);tr.appendChild(statusTd);

        // 超期
        const overdueTd = document.createElement('td');
        if (od && !item.done) {
          const tag = document.createElement('span');
          tag.className = 'overdue-tag ' + (od >= 14 ? 'red' : 'yellow');
          tag.textContent = '超' + od + '天';
          overdueTd.appendChild(tag);
        } else if (od && item.done) {
          overdueTd.innerHTML = '<span style="color:var(--text-light);font-size:12px">已超期</span>';
        } else {
          overdueTd.innerHTML = '<span style="color:var(--text-light);font-size:12px">—</span>';
        }
        tr.appendChild(overdueTd);

        // 计划完成日期（日历选择器）
        const dateTd = document.createElement('td');
        dateTd.className = 'date-cell';
        const dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.dataset.field = 'plannedDate';
        dateInput.dataset.idx = item._idx;
        // 尝试转换为 YYYY-MM-DD 格式
        const pv = item.plannedDate ? item.plannedDate.trim() : '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(pv)) {
          dateInput.value = pv;
        } else {
          dateInput.value = '';
          dateInput.classList.add('empty-date');
          dateInput.title = pv || '点击选择日期';
        }
        dateInput.addEventListener('change', function(e) {
          const idx = parseInt(e.target.dataset.idx);
          data[idx].plannedDate = e.target.value;
          e.target.classList.remove('empty-date');
          e.target.title = '';
          saveData();
          renderTable();
          updateStats();
        });
        dateTd.appendChild(dateInput);
        tr.appendChild(dateTd);

        // ✓ 勾选框（放在计划完成日期之后）
        const cbTd = document.createElement('td');
        cbTd.className = 'cb-wrap';
        cbTd.style.verticalAlign = 'middle';
        cbTd.style.textAlign = 'center';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.done;
        cb.dataset.idx = item._idx;
        cb.addEventListener('change', handleCheckboxChange);
        cbTd.appendChild(cb);
        tr.appendChild(cbTd);

        // 备注（放在最后）
        const noteTd = document.createElement('td');
        noteTd.contentEditable = true;
        noteTd.textContent = item.note || '';
        noteTd.dataset.field = 'note';
        noteTd.dataset.idx = item._idx;
        noteTd.addEventListener('blur', handleCellEdit);
        tr.appendChild(noteTd);

        tbody.appendChild(tr);
      });
  });

  if (filtered.length === 0) {
    const emptyTr = document.createElement('tr');
    emptyTr.innerHTML = '<td colspan="9" style="text-align:center;padding:24px;color:var(--text-light)">无匹配数据</td>';
    tbody.appendChild(emptyTr);
  }
}

function handleCellEdit(e) {
  const idx=Number(e.target.dataset.idx),field=e.target.dataset.field,val=e.target.textContent.trim();
  if(!ready || conflicted || !data[idx])return;
  if(val===(data[idx][field]||'')){if(!pendingState&&!saving)dataDirty=!sameTracker(currentTracker(),cloudBase);return;}
  if(field==='project'){
    if(!val){renderTable();showToast('项目名称不能为空','error');return;}
    const old=data[idx].project;
    if(val!==old && data.some(x=>x.project===val)){renderTable();showToast('已有同名项目，请使用不同名称','error');return;}
    projects=projectNames().map(x=>x===old?val:x);data.forEach(x=>{if(x.project===old)x.project=val;});
    if(projectPriorities[old]){projectPriorities[val]=projectPriorities[old];delete projectPriorities[old];}
    archive.forEach(x=>{if(x.project===old)x.project=val;});
  }else data[idx][field]=val;
  saveData();renderTable();updateStats();
}

function setIssueStatus(idx,status){
 if(!ready||conflicted||!data[idx]||!['进行中','暂停','已完成'].includes(status))return;
 const item=data[idx];item.status=status;item.done=status==='已完成';
 if(item.done)item.completedDate=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});else delete item.completedDate;
 saveData();renderTable();updateStats();
}

function handleCheckboxChange(e) {
  const idx = parseInt(e.target.dataset.idx);
  data[idx].done = e.target.checked;
  data[idx].status = e.target.checked ? '已完成' : '进行中';
  if (e.target.checked) {
    data[idx].completedDate = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  } else {
    delete data[idx].completedDate;
  }
  saveData();
  console.log("[init] data length:", data.length); renderTable();
  updateStats();
}

function updateStats() {
  const total = data.length;
  const done = data.filter(d => d.done).length;
  const undone = total - done;
  let warn = 0, danger = 0;
  data.forEach(item => {
    if (item.done) return;
    const od = getOverdueDays(item.plannedDate);
    if (od && od >= 14) danger++;
    else if (od && od >= 7) warn++;
  });
}

function confirmNewProject() {

async function addIssue() {
  const project = document.getElementById('addProject').value;
  if (project === '__new__' || !project) { alert('请选择或新建项目'); return; }
  const task = document.getElementById('addTask').value.trim();
  const reason = document.getElementById('addReason').value.trim();
  const plannedDate = document.getElementById('addDate').value;
  const note = document.getElementById('addNote').value.trim();

  if (!task) {
    showToast('请填写问题/待办事项', 'error');
    return;
  }

  const newItem = {
    id:document.getElementById('addModal').dataset.draftId||crypto.randomUUID(),
    project: project,
    task: task,
    reason: reason,
    status: '进行中',
    plannedDate: plannedDate || '',
    note: note,
    done: false
  };

  document.getElementById('addModal').dataset.draftId=newItem.id;
  const existing=data.findIndex(x=>x.id===newItem.id);if(existing>=0)data[existing]=newItem;else data.push(newItem);
  if(await saveData()){closeAddModal();delete document.getElementById('addModal').dataset.draftId;showToast('问题已保存到云端', 'success');}
}

// ========== 工具函数 ==========
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

let projects=[],deletedProjects=[],archive=[],cloudVersion=0,ready=false,conflicted=false,pendingState=null,saving=null,unresolvedPending=null,pendingCloud=null,cloudBase=null,legacyPendingRaw=null;
const PENDING_KEY='project_tracker_pending_v3';
// PENDING_HELPERS_START
function stableValue(value){if(Array.isArray(value))return value.map(stableValue);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).filter(k=>k!=='id').sort().map(k=>[k,stableValue(value[k])]));return value;}
function trackerSnapshot(s){return {data:s.data,priorities:s.priorities||{},archive:s.archive||[],projects:s.projects||[],deletedProjects:s.deletedProjects||[]};}
function sameTracker(a,b){return JSON.stringify(stableValue(trackerSnapshot(a)))===JSON.stringify(stableValue(trackerSnapshot(b)));}
function validPending(s){return !!s&&Array.isArray(s.data)&&Array.isArray(s.archive)&&Array.isArray(s.projects)&&Array.isArray(s.deletedProjects)&&s.priorities&&typeof s.priorities==='object'&&!Array.isArray(s.priorities);}
// PENDING_HELPERS_END
function currentTracker(){return trackerSnapshot({data,priorities:projectPriorities,archive,projects,deletedProjects});}
function lockPendingEditing(locked){document.querySelectorAll('.toolbar button').forEach(b=>b.disabled=locked);document.getElementById('tableBody').style.pointerEvents=locked?'none':'';document.getElementById('tableBody').inert=locked;}
function inspectPending(){
 try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(PRIORITY_STORAGE_KEY);}catch{}
 const raw=localStorage.getItem(PENDING_KEY);if(!raw)return;legacyPendingRaw=raw;
 let saved;try{saved=JSON.parse(raw);}catch{}
 if(validPending(saved)&&sameTracker(saved,currentTracker())){localStorage.removeItem(PENDING_KEY);return;}
 unresolvedPending=validPending(saved)?saved:{invalid:true,raw};pendingCloud=currentTracker();
 document.getElementById('pendingMessage').textContent=unresolvedPending.invalid?'本地副本格式异常，请查看后处理。':'本地副本与云端不同，请选择恢复本地副本或保留云端数据后继续编辑。';
 document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);
}
function reviewPending(){return openPendingReview();}
async function openPendingReview(){
 if(!unresolvedPending)return;
 try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法读取云端，请稍后重试');const latest=await r.json();pendingCloud=trackerSnapshot(latest);}catch(e){showToast(e.message,'error');return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay active';const panel=document.createElement('div');panel.className='modal';
 const h=document.createElement('h3');h.textContent='核对本地副本';panel.appendChild(h);
 const info=document.createElement('p');info.textContent='下方展示最新云端数据与本地副本。恢复会替换问题、项目和归档记录；请先核对。';panel.appendChild(info);
 for(const [label,value] of [['云端数据',pendingCloud],['本地副本',unresolvedPending]]){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=label;details.appendChild(summary);const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:240px;overflow:auto';pre.textContent=JSON.stringify(value,null,2);details.appendChild(pre);panel.appendChild(details);}
 const actions=document.createElement('div');actions.className='modal-actions';
 const button=(label,fn)=>{const b=document.createElement('button');b.className='btn btn-outline';b.textContent=label;b.onclick=fn;actions.appendChild(b);return b;};
 if(!unresolvedPending.invalid)button('恢复本地副本',async()=>{
  if(!confirm('确认用本地副本替换当前云端问题表？请确保已核对两份数据。'))return;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法核对云端，请稍后重试');const latest=await r.json();if(!sameTracker(latest,pendingCloud)){showToast('云端再次更新，请刷新后重新核对。本地副本仍保留。','error');return;}
   const saved=unresolvedPending;cloudVersion=latest.version;cloudBase=structuredClone(trackerSnapshot(latest));unresolvedPending=null;conflicted=false;data=structuredClone(saved.data);projectPriorities=structuredClone(saved.priorities);archive=structuredClone(saved.archive);projects=structuredClone(saved.projects);deletedProjects=structuredClone(saved.deletedProjects);overlay.remove();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);renderTable();await saveData();
  }catch(e){showToast(e.message,'error');}
 });
 button('保留云端数据',async()=>{if(!confirm('确认保留云端数据，并丢弃这份本地未同步副本？'))return;localStorage.removeItem(PENDING_KEY);unresolvedPending=null;pendingState=null;conflicted=false;dataDirty=false;await loadData();renderTable();updateStats();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);overlay.remove();});
 button('稍后处理',()=>overlay.remove());panel.appendChild(actions);overlay.appendChild(panel);document.body.appendChild(overlay);
}
function setSync(msg){
 const button=document.getElementById('btnSave');
 if(button){button.textContent=msg==='正在保存…'?'保存中…':msg==='已保存至云端'?'已保存':'保存';button.title=msg;}
 if(/失败|暂停|未同步|仍保留|尚未保存/.test(msg))showToast(msg,'error');
}
function viewArchive(){
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const title=document.createElement('h3');title.textContent='已完成记录（'+archive.length+'）';panel.appendChild(title);
 archive.forEach(x=>{const p=document.createElement('p');p.style.marginBottom='16px';p.textContent=x.project+' · '+x.task+' · 完成日期：'+(x.completedDate||'未记录')+' · 备注：'+(x.note||'');panel.appendChild(p);});
 const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.onclick=()=>overlay.remove();panel.appendChild(close);overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}
window.addEventListener('beforeunload',e=>{if(dataDirty){e.preventDefault();e.returnValue='';}});
function projectNames(){return [...new Set([...projects,...data.map(x=>x.project),...archive.map(x=>x.project)])];}
function addProjectByName(name){
 if(!ready||conflicted)return false;
 name=name.trim();
 if(!name||name.length>120){showToast('请输入不超过120字的项目名称','error');return false;}
 if(projectNames().includes(name)){showToast('项目已存在','error');return false;}
 projects.push(name);saveData();return true;
}
function removeProject(name){
 if(!ready||conflicted)return false;
 const issues=data.filter(x=>x.project===name),records=archive.filter(x=>x.project===name);
 if(!confirm('删除项目「'+name+'」？关联 '+issues.length+' 条当前问题、'+records.length+' 条归档记录将一起移入项目回收站，可恢复。'))return false;
 deletedProjects.push({name,data:issues,archive:records,priority:projectPriorities[name]||'',deletedAt:new Date().toISOString()});
 projects=projectNames().filter(x=>x!==name);data=data.filter(x=>x.project!==name);archive=archive.filter(x=>x.project!==name);delete projectPriorities[name];saveData();renderTable();return true;
}
function restoreProject(index){
 if(!ready||conflicted)return false;
 const p=deletedProjects[index];if(!p)return false;
 if(projectNames().includes(p.name)){showToast('已有同名项目，请先重命名后再恢复','error');return false;}
 projects.push(p.name);data.push(...p.data);archive.push(...p.archive);if(p.priority)projectPriorities[p.name]=p.priority;deletedProjects.splice(index,1);saveData();renderTable();return true;
}
function manageProjects(){
 if(!ready||conflicted){showToast('请先恢复云端连接并处理同步冲突','error');return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const draw=()=>{
  populateProjectSelect();
  panel.replaceChildren();
  const h=document.createElement('h3');h.textContent='项目管理';panel.appendChild(h);
  const input=document.createElement('input');input.type='text';input.placeholder='项目编号 + 名称，如 P017 新项目';input.maxLength=120;input.setAttribute('aria-label','新项目名称');panel.appendChild(input);
  const add=document.createElement('button');add.className='btn btn-success';add.textContent='添加项目';add.onclick=()=>{if(addProjectByName(input.value))draw();};panel.appendChild(add);
  projectNames().sort((a,b)=>a.localeCompare(b,'zh')).forEach(name=>{
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb';
   const label=document.createElement('span');label.textContent=name+'（'+data.filter(x=>x.project===name).length+' 条问题）';row.appendChild(label);
   const del=document.createElement('button');del.className='btn btn-outline';del.textContent='删除';del.onclick=()=>{if(removeProject(name))draw();};row.appendChild(del);panel.appendChild(row);
  });
  const rh=document.createElement('h3');rh.textContent='项目回收站（'+deletedProjects.length+'）';rh.style.marginTop='20px';panel.appendChild(rh);
  deletedProjects.forEach((p,i)=>{const row=document.createElement('div');row.style.padding='8px 0';const label=document.createElement('span');label.textContent=p.name+' ';row.appendChild(label);const b=document.createElement('button');b.className='btn btn-outline';b.textContent='恢复';b.onclick=()=>{if(restoreProject(i))draw();};row.appendChild(b);panel.appendChild(row);});
  const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.style.marginTop='16px';close.onclick=()=>overlay.remove();panel.appendChild(close);
 };
 draw();overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}
