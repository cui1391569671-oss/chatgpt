function projectNameOnly(value){return String(value||'').replace(/^\s*(?:PM|P)\s*\d+\s*[-—:：]?\s*/i,'').trim();}
function projectLabel(value,items=[]){
 const name=projectNameOnly(value),key=name.replace(/\s+/g,'').toLowerCase();
 const matches=items.filter(item=>[item.projectName,item.sourceSheet,...(item.aliases||[])].some(alias=>projectNameOnly(alias).replace(/\s+/g,'').toLowerCase()===key));
 return matches.length===1&&matches[0].projectCode?matches[0].projectCode+' '+name:name;
}
let projectLabelItems=[];
function displayProject(value){return projectLabel(value,projectLabelItems);}
async function loadProjectLabels(){try{const response=await fetch('/api/project-core-information',{cache:'no-store'});if(!response.ok)throw Error();const payload=await response.json();if(Array.isArray(payload.items))projectLabelItems=payload.items;}catch{projectLabelItems=[];}}

/* PROJECT_LABELS_END */
/* CLOUD_RECORDS_START */
const WORKSPACE_COLLECTIONS=['tasks','notes','events','expenses','maintenance','dailyRoutines','vocabulary','completedGames','driveLinks','wardrobe','outfits'];
const PROJECT_COLLECTIONS=['data','archive','deletedProjects','projects','priorities'];
function canonical(value){if(Array.isArray(value))return value.map(canonical);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));return value;}
function equalRecord(a,b){return JSON.stringify(canonical(a))===JSON.stringify(canonical(b));}
function ensureProjectIds(source){
 const out=structuredClone(source);for(const collection of ['data','archive','deletedProjects']){const used=new Set();for(const row of out[collection]||[]){if(!row.id){const text=JSON.stringify(canonical(row));let a=2166136261,b=5381;for(const c of text){a=Math.imul(a^c.charCodeAt(0),16777619);b=Math.imul(b,33)^c.charCodeAt(0);}const prefix='legacy-'+(a>>>0).toString(16)+(b>>>0).toString(16);let id=prefix,n=0;while(used.has(id))id=prefix+'-'+(++n);row.id=id;}if(used.has(row.id))throw Error('记录编号重复');used.add(row.id);}}return out;
}
const property=(obj,key)=>Object.hasOwn(obj,key)?{exists:true,value:obj[key]}:{exists:false};
function recordChanges(base,next,collections){
 const operations=[];
 for(const collection of collections){
  if(collection==='priorities'){const b=base[collection]||{},n=next[collection]||{};for(const id of new Set([...Object.keys(b),...Object.keys(n)]))if(!equalRecord(property(b,id),property(n,id)))operations.push({collection,id,action:'value',before:property(b,id),after:property(n,id)});continue;}
  if(collection==='projects'){const b=new Set(base.projects||[]),n=new Set(next.projects||[]);for(const id of new Set([...b,...n]))if(b.has(id)!==n.has(id))operations.push({collection,id,action:'membership',present:n.has(id)});continue;}
  const b=new Map((base[collection]||[]).map(x=>[x.id,x])),n=new Map((next[collection]||[]).map(x=>[x.id,x]));
  for(const id of new Set([...b.keys(),...n.keys()])){const old=b.get(id),row=n.get(id);if(equalRecord(old,row))continue;if(!old){operations.push({collection,id,action:'create',record:row});continue;}if(!row){operations.push({collection,id,action:'delete',before:old});continue;}
   const changes={};for(const field of new Set([...Object.keys(old),...Object.keys(row)]))if(field!=='id'&&!equalRecord(property(old,field),property(row,field)))changes[field]={before:property(old,field),after:property(row,field)};
   operations.push({collection,id,action:'update',changes});
  }
 }
 return operations;
}
class RecordConflict extends Error{}
function applyRecordChanges(source,operations,collections){
 if(!Array.isArray(operations)||operations.length>10000)throw Error('无效变更');const result=structuredClone(source),unsafe=new Set(['__proto__','prototype','constructor']);
 const set=(obj,key,value)=>{if(unsafe.has(key))throw Error('无效字段');if(!value||typeof value.exists!=='boolean')throw Error('无效字段值');if(value.exists)obj[key]=structuredClone(value.value);else delete obj[key];};
 for(const op of operations){if(!op||!collections.includes(op.collection)||typeof op.id!=='string'||!op.id||op.id.length>200||unsafe.has(op.id))throw Error('无效记录');
  if(op.collection==='priorities'){if(op.action!=='value')throw Error('无效变更');const map=result.priorities??={};const current=property(map,op.id);if(!equalRecord(current,op.before)&&!equalRecord(current,op.after))throw new RecordConflict('该项目优先级已更新');set(map,op.id,op.after);continue;}
  if(op.collection==='projects'){if(op.action!=='membership'||typeof op.present!=='boolean')throw Error('无效变更');const list=result.projects??=[];if(op.present&&!list.includes(op.id))list.push(op.id);if(!op.present)result.projects=list.filter(x=>x!==op.id);continue;}
  const list=result[op.collection]??=[];const index=list.findIndex(x=>x.id===op.id),current=list[index];
  if(op.action==='create'){if(!op.record||op.record.id!==op.id)throw Error('无效新增');if(current&&!equalRecord(current,op.record))throw new RecordConflict('该记录已存在');if(!current)list.push(structuredClone(op.record));}
  else if(op.action==='delete'){if(current&&!equalRecord(current,op.before))throw new RecordConflict('该记录已被修改，请核对后删除');if(current)list.splice(index,1);}
  else if(op.action==='update'){if(!current)throw new RecordConflict('该记录已删除');if(!op.changes||typeof op.changes!=='object')throw Error('无效修改');for(const [field,change] of Object.entries(op.changes)){if(field==='id'||unsafe.has(field))throw Error('无效字段');const actual=property(current,field);if(!equalRecord(actual,change.before)&&!equalRecord(actual,change.after))throw new RecordConflict('同一字段已被其他页面修改：'+field);set(current,field,change.after);}}
  else throw Error('无效操作');
 }

}

async function loadPriorities() {}

async function savePriorities() { return saveData(); }

function getPriority(project) {
  return projectPriorities[project] || '';
}

function getPriorityInfo(key) {
  return PRIORITY_LEVELS.find(l => l.key === key) || PRIORITY_LEVELS[0];
}

function cyclePriority(project) {
  const current = getPriority(project);
  const idx = PRIORITY_LEVELS.findIndex(l => l.key === current);
  const next = PRIORITY_LEVELS[(idx + 1) % PRIORITY_LEVELS.length];

    projectPriorities[project] = next.key;

    delete projectPriorities[project];

function saveData() {
  if(unresolvedPending){reviewPending();return Promise.resolve(false);}
  if(!ready || conflicted) {showToast('同步已暂停，本地副本已保留，请核对云端数据','error'); return Promise.resolve(false);}
  dataDirty=true;
  pendingState={base:structuredClone(cloudBase),data:structuredClone(data),priorities:structuredClone(projectPriorities),archive:structuredClone(archive),projects:structuredClone(projects),deletedProjects:structuredClone(deletedProjects)};
  return flushSave();
}
async function manualSave(){
  if(!ready){showToast('云端尚未连接，请稍后重试','error');return false;}
  const editor=document.activeElement?.closest('[contenteditable="true"]');
  if(editor)editor.blur(); // Commit the focused cell before taking the snapshot.
  if(unresolvedPending){reviewPending();return false;}
  const ok=await (saving||saveData());
  if(ok)showToast('已保存至云端','success');
  return ok;
}
function useCloudTracker(s){data=s.data;archive=s.archive;projects=s.projects;deletedProjects=s.deletedProjects;projectPriorities=s.priorities;cloudVersion=s.version;cloudBase=structuredClone(currentTracker());}
async function flushSave(){
 if(saving)return saving;
 lockPendingEditing(true);
 saving=(async()=>{
  while(pendingState&&!conflicted){
   const snapshot=pendingState;pendingState=null;setSync('正在保存…');
   try{
    const local=ensureProjectIds(snapshot),operations=recordChanges(snapshot.base||cloudBase,local,PROJECT_COLLECTIONS);
    const r=await fetch('/api/state/patch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operations})});const saved=await r.json();
    if(!r.ok){if(r.status===409)conflicted=true;throw Error(saved.error||'云端保存失败');}
    const cloud=trackerSnapshot(saved.state);
    if(pendingState){
     const queued=ensureProjectIds(pendingState),queuedOps=recordChanges(local,queued,PROJECT_COLLECTIONS);
     const merged=applyRecordChanges(cloud,queuedOps,PROJECT_COLLECTIONS);useCloudTracker({...merged,version:saved.state.version});cloudBase=structuredClone(cloud);pendingState={...merged,base:structuredClone(cloud)};
    }else{useCloudTracker(saved.state);dataDirty=false;if(legacyPendingRaw&&localStorage.getItem(PENDING_KEY)===legacyPendingRaw){localStorage.removeItem(PENDING_KEY);legacyPendingRaw=null;}renderTable();updateStats();setSync('已保存至云端');}
    if(window.parent!==window)window.parent.postMessage({type:'project-saved'},location.origin);
   }catch(e){pendingState=pendingState||snapshot;dataDirty=true;if(conflicted){unresolvedPending=structuredClone(pendingState);pendingCloud=structuredClone(cloudBase);document.getElementById('pendingMessage').textContent='同一记录有冲突，当前未保存输入仅保留在此页面，请核对后重试。';document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);}setSync(e.message+'；修改尚未保存，请保持页面打开并重试');return false;}
  }
  return !conflicted;
 })();try{return await saving;}finally{saving=null;if(!conflicted&&!unresolvedPending)lockPendingEditing(false);}
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function getOverdueDays(dateStr) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr||''))return null;
  const now=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const diff=Math.floor((Date.parse(now+'T00:00:00Z')-Date.parse(dateStr+'T00:00:00Z'))/86400000);
  return diff>0?diff:null;
}

function getFilteredData() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const statusFilter = (document.getElementById('filterStatus')?.value||'');
  const overdueFilter = (document.getElementById('filterOverdue')?.value||'');
  const priorityFilter = (document.getElementById('filterPriority')?.value||'');

  return data.map((item, idx) => ({...item, _idx: idx})).filter(item => {
    if (statusFilter === '未完成' && item.done) return false;
    if (statusFilter === '已完成' && !item.done) return false;
    if (overdueFilter) {
      const od = getOverdueDays(item.plannedDate);
      if (overdueFilter === '7' && (!od || od < 7)) return false;
      if (overdueFilter === '14' && (!od || od < 14)) return false;
    }
    if (priorityFilter) {
      const itemPri = getPriority(item.project);
      if (priorityFilter === 'none') {
        if (itemPri) return false;
      } else {
        if (itemPri !== priorityFilter) return false;
      }
    }
    if (search) {
      const haystack = (item.task + item.reason + item.note + displayProject(item.project) + item.status).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function handleCellEdit(e) {
  const idx=Number(e.target.dataset.idx),field=e.target.dataset.field,val=e.target.textContent.trim();
  if(!ready || conflicted || !data[idx])return;
  if(val===(data[idx][field]||'')){if(!pendingState&&!saving)dataDirty=!sameTracker(currentTracker(),cloudBase);return;}
  if(field==='project'){
    if(!val){renderTable();showToast('项目名称不能为空','error');return;}
    const old=data[idx].project;
    if(val!==old && data.some(x=>x.project===val)){renderTable();showToast('已有同名项目，请使用不同名称','error');return;}
    projects=projectNames().map(x=>x===old?val:x);data.forEach(x=>{if(x.project===old)x.project=val;});
    if(projectPriorities[old]){projectPriorities[val]=projectPriorities[old];delete projectPriorities[old];}
    archive.forEach(x=>{if(x.project===old)x.project=val;});
  }else data[idx][field]=val;
  saveData();renderTable();updateStats();
}

function setIssueStatus(idx,status){
 if(!ready||conflicted||!data[idx]||!['进行中','暂停','已完成'].includes(status))return;
 const item=data[idx];item.status=status;item.done=status==='已完成';
 if(item.done)item.completedDate=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});else delete item.completedDate;
 saveData();renderTable();updateStats();
}

function handleCheckboxChange(e) {
  const idx = parseInt(e.target.dataset.idx);
  data[idx].done = e.target.checked;
  data[idx].status = e.target.checked ? '已完成' : '进行中';
  if (e.target.checked) {
    data[idx].completedDate = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  } else {
    delete data[idx].completedDate;
  }
  saveData();
  console.log("[init] data length:", data.length); renderTable();
  updateStats();
}

function updateStats() {
  const total = data.length;
  const done = data.filter(d => d.done).length;
  const undone = total - done;
  let warn = 0, danger = 0;
  data.forEach(item => {
    if (item.done) return;
    const od = getOverdueDays(item.plannedDate);
    if (od && od >= 14) danger++;
    else if (od && od >= 7) warn++;
  });
}

async function addIssue() {
  const project = document.getElementById('addProject').value;
  if (project === '__new__' || !project) { alert('请选择或新建项目'); return; }
  const task = document.getElementById('addTask').value.trim();
  const reason = document.getElementById('addReason').value.trim();
  const plannedDate = document.getElementById('addDate').value;
  const note = document.getElementById('addNote').value.trim();

  if (!task) {
    showToast('请填写问题/待办事项', 'error');
    return;
  }

  const newItem = {
    id:document.getElementById('addModal').dataset.draftId||crypto.randomUUID(),
    project: project,
    task: task,
    reason: reason,
    status: '进行中',
    plannedDate: plannedDate || '',

    done: false
  };

  document.getElementById('addModal').dataset.draftId=newItem.id;
  const existing=data.findIndex(x=>x.id===newItem.id);if(existing>=0)data[existing]=newItem;else data.push(newItem);
  if(await saveData()){closeAddModal();delete document.getElementById('addModal').dataset.draftId;showToast('问题已保存到云端', 'success');}

  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

const TOAST_ICON = {
  success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
};
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  const icon = TOAST_ICON[type] || '';
  toast.innerHTML = icon; const msgSpan=document.createElement('span'); msgSpan.textContent=msg; toast.appendChild(msgSpan);
  toast.className = 'toast ' + (type || '');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// 点击遮罩关闭弹窗
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});


let projects=[],deletedProjects=[],archive=[],cloudVersion=0,ready=false,conflicted=false,pendingState=null,saving=null,unresolvedPending=null,pendingCloud=null,cloudBase=null,legacyPendingRaw=null;
const PENDING_KEY='project_tracker_pending_v3';
// PENDING_HELPERS_START
function stableValue(value){if(Array.isArray(value))return value.map(stableValue);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).filter(k=>k!=='id').sort().map(k=>[k,stableValue(value[k])]));return value;}
function trackerSnapshot(s){return {data:s.data,priorities:s.priorities||{},archive:s.archive||[],projects:s.projects||[],deletedProjects:s.deletedProjects||[]};}
function sameTracker(a,b){return JSON.stringify(stableValue(trackerSnapshot(a)))===JSON.stringify(stableValue(trackerSnapshot(b)));}
function validPending(s){return !!s&&Array.isArray(s.data)&&Array.isArray(s.archive)&&Array.isArray(s.projects)&&Array.isArray(s.deletedProjects)&&s.priorities&&typeof s.priorities==='object'&&!Array.isArray(s.priorities);}
// PENDING_HELPERS_END
function currentTracker(){return trackerSnapshot({data,priorities:projectPriorities,archive,projects,deletedProjects});}
function lockPendingEditing(locked){document.querySelectorAll('.toolbar button').forEach(b=>b.disabled=locked);document.getElementById('tableBody').style.pointerEvents=locked?'none':'';document.getElementById('tableBody').inert=locked;}
function inspectPending(){
 try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(PRIORITY_STORAGE_KEY);}catch{}
 const raw=localStorage.getItem(PENDING_KEY);if(!raw)return;legacyPendingRaw=raw;
 let saved;try{saved=JSON.parse(raw);}catch{}
 if(validPending(saved)&&sameTracker(saved,currentTracker())){localStorage.removeItem(PENDING_KEY);return;}
 unresolvedPending=validPending(saved)?saved:{invalid:true,raw};pendingCloud=currentTracker();
 document.getElementById('pendingMessage').textContent=unresolvedPending.invalid?'本地副本格式异常，请查看后处理。':'本地副本与云端不同，请选择恢复本地副本或保留云端数据后继续编辑。';
 document.getElementById('pendingNotice').style.display='block';lockPendingEditing(true);
}
function reviewPending(){return openPendingReview();}
async function openPendingReview(){
 if(!unresolvedPending)return;
 try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法读取云端，请稍后重试');const latest=await r.json();pendingCloud=trackerSnapshot(latest);}catch(e){showToast(e.message,'error');return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay active';const panel=document.createElement('div');panel.className='modal';
 const h=document.createElement('h3');h.textContent='核对本地副本';panel.appendChild(h);
 const info=document.createElement('p');info.textContent='下方展示最新云端数据与本地副本。恢复会替换问题、项目和归档记录；请先核对。';panel.appendChild(info);
 for(const [label,value] of [['云端数据',pendingCloud],['本地副本',unresolvedPending]]){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=label;details.appendChild(summary);const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:240px;overflow:auto';pre.textContent=JSON.stringify(value,null,2);details.appendChild(pre);panel.appendChild(details);}
 const actions=document.createElement('div');actions.className='modal-actions';
 const button=(label,fn)=>{const b=document.createElement('button');b.className='btn btn-outline';b.textContent=label;b.onclick=fn;actions.appendChild(b);return b;};
 if(!unresolvedPending.invalid)button('恢复本地副本',async()=>{
  if(!confirm('确认用本地副本替换当前云端问题表？请确保已核对两份数据。'))return;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('无法核对云端，请稍后重试');const latest=await r.json();if(!sameTracker(latest,pendingCloud)){showToast('云端再次更新，请刷新后重新核对。本地副本仍保留。','error');return;}
   const saved=unresolvedPending;cloudVersion=latest.version;cloudBase=structuredClone(trackerSnapshot(latest));unresolvedPending=null;conflicted=false;data=structuredClone(saved.data);projectPriorities=structuredClone(saved.priorities);archive=structuredClone(saved.archive);projects=structuredClone(saved.projects);deletedProjects=structuredClone(saved.deletedProjects);overlay.remove();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);renderTable();await saveData();
  }catch(e){showToast(e.message,'error');}
 });
 button('保留云端数据',async()=>{if(!confirm('确认保留云端数据，并丢弃这份本地未同步副本？'))return;localStorage.removeItem(PENDING_KEY);unresolvedPending=null;pendingState=null;conflicted=false;dataDirty=false;await loadData();renderTable();updateStats();document.getElementById('pendingNotice').style.display='none';lockPendingEditing(false);overlay.remove();});
 button('稍后处理',()=>overlay.remove());panel.appendChild(actions);overlay.appendChild(panel);document.body.appendChild(overlay);
}
function setSync(msg){
 const button=document.getElementById('btnSave');
 if(button){button.textContent=msg==='正在保存…'?'保存中…':msg==='已保存至云端'?'已保存':'保存';button.title=msg;}
 if(/失败|暂停|未同步|仍保留|尚未保存/.test(msg))showToast(msg,'error');
}
function viewArchive(){
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const title=document.createElement('h3');title.textContent='已完成记录（'+archive.length+'）';panel.appendChild(title);
 archive.forEach(x=>{const p=document.createElement('p');p.style.marginBottom='16px';p.textContent=displayProject(x.project)+' · '+x.task+' · 完成日期：'+(x.completedDate||'未记录')+' · 备注：'+(x.note||'');panel.appendChild(p);});
 const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.onclick=()=>overlay.remove();panel.appendChild(close);overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}
window.addEventListener('beforeunload',e=>{if(dataDirty){e.preventDefault();e.returnValue='';}});
function projectNames(){return [...new Set([...projects,...data.map(x=>x.project),...archive.map(x=>x.project)])];}
function addProjectByName(name){
 if(!ready||conflicted)return false;
 name=name.trim();
 if(!name||name.length>120){showToast('请输入不超过120字的项目名称','error');return false;}
 if(projectNames().includes(name)){showToast('项目已存在','error');return false;}
 projects.push(name);saveData();return true;
}
function removeProject(name){
 if(!ready||conflicted)return false;
 const issues=data.filter(x=>x.project===name),records=archive.filter(x=>x.project===name);
 if(!confirm('删除项目「'+name+'」？关联 '+issues.length+' 条当前问题、'+records.length+' 条归档记录将一起移入项目回收站，可恢复。'))return false;
 deletedProjects.push({name,data:issues,archive:records,priority:projectPriorities[name]||'',deletedAt:new Date().toISOString()});
 projects=projectNames().filter(x=>x!==name);data=data.filter(x=>x.project!==name);archive=archive.filter(x=>x.project!==name);delete projectPriorities[name];saveData();renderTable();return true;
}
function restoreProject(index){
 if(!ready||conflicted)return false;
 const p=deletedProjects[index];if(!p)return false;
 if(projectNames().includes(p.name)){showToast('已有同名项目，请先重命名后再恢复','error');return false;}
 projects.push(p.name);data.push(...p.data);archive.push(...p.archive);if(p.priority)projectPriorities[p.name]=p.priority;deletedProjects.splice(index,1);saveData();renderTable();return true;
}
function manageProjects(){
 if(!ready||conflicted){showToast('请先恢复云端连接并处理同步冲突','error');return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay active';
 const panel=document.createElement('div');panel.className='modal';
 const draw=()=>{
  populateProjectSelect();
  panel.replaceChildren();
  const h=document.createElement('h3');h.textContent='项目管理';panel.appendChild(h);
  const input=document.createElement('input');input.type='text';input.placeholder='项目名称，如 新项目';input.maxLength=120;input.setAttribute('aria-label','新项目名称');panel.appendChild(input);
  const add=document.createElement('button');add.className='btn btn-success';add.textContent='添加项目';add.onclick=()=>{if(addProjectByName(input.value))draw();};panel.appendChild(add);
  projectNames().sort((a,b)=>a.localeCompare(b,'zh')).forEach(name=>{
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb';
   const label=document.createElement('span');label.textContent=displayProject(name)+'（'+data.filter(x=>x.project===name).length+' 条问题）';row.appendChild(label);
   const del=document.createElement('button');del.className='btn btn-outline';del.textContent='删除';del.onclick=()=>{if(removeProject(name))draw();};row.appendChild(del);panel.appendChild(row);
  });
  const rh=document.createElement('h3');rh.textContent='项目回收站（'+deletedProjects.length+'）';rh.style.marginTop='20px';panel.appendChild(rh);
  deletedProjects.forEach((p,i)=>{const row=document.createElement('div');row.style.padding='8px 0';const label=document.createElement('span');label.textContent=displayProject(p.name)+' ';row.appendChild(label);const b=document.createElement('button');b.className='btn btn-outline';b.textContent='恢复';b.onclick=()=>{if(restoreProject(i))draw();};row.appendChild(b);panel.appendChild(row);});
  const close=document.createElement('button');close.className='btn btn-primary';close.textContent='关闭';close.style.marginTop='16px';close.onclick=()=>overlay.remove();panel.appendChild(close);
 };
 draw();overlay.appendChild(panel);overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);
}

document.addEventListener('DOMContentLoaded', init);
