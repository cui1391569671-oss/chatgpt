<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作台</title>
<style>
:root{--bg:#f5f6fa;--surface:#fff;--text:#18243a;--muted:#67748b;--line:#e3e8f0;--accent:#435ae8;--soft:#eef1ff;--danger:#b42318;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}a{color:var(--accent)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:var(--surface);border-right:1px solid var(--line);padding:32px 18px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:750;padding:0 14px 28px}.brand small{display:block;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:500}nav{display:grid;gap:8px}nav button,nav a{padding:12px 16px;border:0;border-radius:10px;background:transparent;text-align:left;text-decoration:none;color:var(--muted);min-height:48px}nav .active{background:var(--soft);color:var(--accent);font-weight:650}nav button:hover,nav a:hover{background:var(--bg)}.aside-footer{position:absolute;bottom:28px;left:32px;color:var(--muted);font-size:12px}main{padding:40px clamp(18px,4vw,64px);max-width:1500px;width:100%}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h1{font-size:30px;line-height:1.3;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}p{margin:6px 0}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:1px;font-weight:650;margin-bottom:10px}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 16px;min-height:44px;background:var(--surface);color:var(--text);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}.btn:hover{background:var(--bg)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#3448c7}.danger{color:var(--danger)}.status{padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:24px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px}.status.error{background:#fff3f1;color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}.stat-value{font-size:32px;font-weight:700;margin-top:12px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.card-head button{background:none;border:0;color:var(--accent);padding:8px;min-height:44px}.empty{padding:32px 12px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-weight:600}.row{display:flex;align-items:flex-start;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-content{flex:1;min-width:0}.row-title{font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}.row-meta{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere}.row input[type=checkbox]{width:22px;height:22px;margin:3px 0;accent-color:var(--accent);flex-shrink:0}.completed .row-title{text-decoration:line-through;color:var(--muted)}.tag{display:inline-block;background:var(--soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:12px;margin-right:8px}.overdue{color:var(--danger)}.actions{display:flex;gap:4px;flex-shrink:0}.actions button{border:0;background:transparent;color:var(--muted);padding:8px;min-height:44px}.actions button:hover{background:var(--bg);border-radius:8px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.filters input{flex:1;min-width:180px}.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px}.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.note-body{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);max-height:180px;overflow:hidden;margin:12px 0}.notes .card{display:flex;flex-direction:column}.notes .actions{margin-top:auto}.date-heading{margin:24px 0 4px;color:var(--muted);font-weight:600}.event-time{font-size:13px;color:var(--accent);min-width:100px}.full{grid-column:1/-1}dialog{border:1px solid var(--line);border-radius:20px;padding:28px;width:min(560px,calc(100% - 32px));max-height:90dvh;overflow:auto;color:var(--text);box-shadow:0 24px 80px #18243a25}dialog::backdrop{background:#18243a70}dialog label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}dialog textarea{min-height:150px;resize:vertical}dialog .actions{justify-content:flex-end;margin-top:24px}.form-error{color:var(--danger)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:white;border-radius:10px;padding:12px 20px;z-index:5;max-width:90vw}.hidden{display:none!important}@media(max-width:1100px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px 12px;font-size:20px}.brand small,.aside-footer{display:none}nav{display:flex;overflow:auto;gap:4px}nav button,nav a{white-space:nowrap;padding:10px 12px;flex-shrink:0}main{padding:24px 16px}header{align-items:flex-start}h1{font-size:25px}.grid,.notes{grid-template-columns:1fr}.stats{gap:10px}.card{padding:18px}.stat-value{font-size:28px}.row{flex-wrap:wrap}.row .actions{margin-left:auto;flex-basis:100%;justify-content:flex-end}.row-content{flex-basis:180px}.event-time{flex-basis:100%}.status{align-items:flex-start}.event-time{min-width:85px}.filters input{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body><div class="shell"><aside><div class="brand">我的工作台<small>PERSONAL WORKSPACE</small></div><nav aria-label="主导航"><button data-view="home" class="active">工作总览</button><button data-view="tasks">个人待办</button><button data-view="notes">我的笔记</button><button data-view="calendar">日程安排</button><a href="/projects" id="projectLink">项目问题 ↗</a><a href="/">切换工作台 ↗</a></nav><div class="aside-footer">专注今天，逐步推进。</div></aside><main><header><div><div class="eyebrow" id="today"></div><h1 id="heading">工作总览</h1><p class="muted" id="subtitle">把今天要做的事、想法和安排放在一起。</p></div><button id="add" class="btn primary" disabled>＋ 新建待办</button></header><div class="status" id="status" role="status"><span id="statusText">正在连接云端…</span><button class="btn hidden" id="recover">重新加载</button></div><div id="content" aria-busy="true"><div class="card empty">正在加载你的工作台…</div></div></main></div>
<dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><div id="fields"></div><p id="formError" class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">保存</button></div></form></dialog><div class="toast hidden" role="status" id="toast"></div>
<script>
'use strict';
const scope=location.pathname==='/work'?'work':'personal',api='/api/workspace?scope='+scope;
let state={tasks:[],notes:[],events:[]},version=0,ready=false,view='home',query='',filter='open',editing=null,kind='tasks',busy=false,conflict=false;
const $=id=>document.getElementById(id),titles={home:scope==='work'?'工作总览':'私人总览',tasks:scope==='work'?'工作待办':'个人待办',notes:scope==='work'?'工作笔记':'我的笔记',calendar:'日程安排'},subtitles={home:'把今天要做的事、想法和安排放在一起。',tasks:'为每一步设置优先级，留出专注的空间。',notes:'随手记录，再把想法变成行动。',calendar:'安排好时间，让每天的节奏更清晰。'},labels={tasks:'待办',notes:'笔记',events:'日程'};
const day=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.replace('T',' '):'未设置日期';
const priority=p=>({high:'高优先级',normal:'普通',low:'低优先级'}[p]||'普通');
function status(text,error=false){$('statusText').textContent=text;$('status').classList.toggle('error',error);$('recover').classList.toggle('hidden',!error);}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);}
function setBusy(value){busy=value;$('add').disabled=value||!ready||conflict;$('submit').disabled=value;document.querySelectorAll('#content button,#content input[type=checkbox]').forEach(x=>x.disabled=value||!ready||conflict);}
async function load(){setBusy(true);try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('读取失败（'+r.status+'）');const s=await r.json();state=s.workspace;version=s.version;ready=true;conflict=false;status('已连接云端 · '+(scope==='work'?'工作':'私人')+'数据独立保存');render();}catch(e){ready=false;status(e.message+'，请重新加载。',true);}finally{setBusy(false);$('content').setAttribute('aria-busy','false');}}
async function change(next){if(busy||!ready||conflict)return false;setBusy(true);status('正在保存…');try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:next,version})});if(r.status===409){conflict=true;throw Error('云端数据已被其他页面更新，请重新加载后再修改');}if(!r.ok)throw Error('保存失败（'+r.status+'），修改尚未保存，请重试');const s=await r.json();state=next;version=s.version;status('已保存至云端');render();return true;}catch(e){status(e.message,true);toast(e.message);return false;}finally{setBusy(false);}}
function empty(title,help){return '<div class="empty"><strong>'+esc(title)+'</strong>'+esc(help)+'</div>';}
function controls(type,id){return '<div class="actions"><button data-edit="'+type+'" data-id="'+esc(id)+'" aria-label="编辑'+labels[type]+'">编辑</button><button data-delete="'+type+'" data-id="'+esc(id)+'" aria-label="删除'+labels[type]+'">删除</button></div>';}
function taskRows(items){return items.map(t=>'<div class="row '+(t.done?'completed':'')+'"><input type="checkbox" aria-label="完成待办：'+esc(t.title)+'" data-toggle="'+esc(t.id)+'" '+(t.done?'checked':'')+'><div class="row-content"><div class="row-title">'+esc(t.title)+'</div><div class="row-meta"><span class="tag">'+priority(t.priority)+'</span><span class="'+(!t.done&&t.dueDate&&t.dueDate<day()?'overdue':'')+'">'+(t.dueDate?fmt(t.dueDate):'无截止日期')+'</span>'+(t.detail?'<p>'+esc(t.detail)+'</p>':'')+'</div></div>'+controls('tasks',t.id)+'</div>').join('');}
function eventRows(items){return items.map(e=>'<div class="row"><div class="event-time">'+esc(fmt(e.start))+'</div><div class="row-content"><div class="row-title">'+esc(e.title)+'</div><div class="row-meta">'+(e.end?'至 '+esc(fmt(e.end))+' · ':'')+esc(e.location||'未设置地点')+(e.detail?'<p>'+esc(e.detail)+'</p>':'')+'</div></div>'+controls('events',e.id)+'</div>').join('');}
function noteCards(items){return '<div class="notes">'+items.map(n=>'<article class="card"><h3 class="row-title">'+esc(n.title)+'</h3><div class="note-body">'+esc(n.body)+'</div><div class="row-meta">更新于 '+new Date(n.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'</div>'+controls('notes',n.id)+'</article>').join('')+'</div>';}
function render(){const today=day(),open=state.tasks.filter(t=>!t.done),overdue=open.filter(t=>t.dueDate&&t.dueDate<today),todayEvents=state.events.filter(e=>e.start.slice(0,10)===today).sort((a,b)=>a.start.localeCompare(b.start));$('heading').textContent=titles[view];$('subtitle').textContent=subtitles[view];$('add').textContent='＋ 新建'+(view==='notes'?'笔记':view==='calendar'?'日程':'待办');document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false');});let html='';if(view==='home'){html='<div class="stats">'+[['未完成待办',open.length],['已逾期待办',overdue.length],['今日日程',todayEvents.length],['我的笔记',state.notes.length]].map(([label,n])=>'<div class="card"><div class="muted">'+label+'</div><div class="stat-value">'+n+'</div></div>').join('')+'</div><div class="grid"><section class="card"><div class="card-head"><h2>今日关注</h2><button data-nav="tasks">全部待办 →</button></div>'+ (open.filter(t=>t.dueDate&&t.dueDate<=today).length?taskRows(open.filter(t=>t.dueDate&&t.dueDate<=today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))):empty('今天没有到期的待办','可以新增一件今天想完成的事。'))+'</section><section class="card"><div class="card-head"><h2>今日安排</h2><button data-nav="calendar">全部日程 →</button></div>'+(todayEvents.length?eventRows(todayEvents):empty('今天暂未安排日程','为会议、专注工作或个人计划留出时间。'))+'</section><section class="card full"><div class="card-head"><h2>最近笔记</h2><button data-nav="notes">全部笔记 →</button></div>'+(state.notes.length?noteCards([...state.notes].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,3)):empty('记录你的第一个想法','会议要点、灵感或工作备忘都可以放在这里。'))+'</section></div>';}
else{html='<div class="filters"><input id="search" aria-label="搜索'+titles[view]+'" placeholder="搜索'+(view==='tasks'?'待办标题和详情':view==='notes'?'笔记标题和内容':'日程、地点和详情')+'" value="'+esc(query)+'">'+(view==='tasks'?'<select id="filter" aria-label="待办状态"><option value="open">未完成</option><option value="done">已完成</option><option value="all">全部</option><option value="overdue">已逾期</option></select>':'')+'</div><div id="results"></div>';}$('content').innerHTML=html;if(view!=='home'){if(view==='tasks')$('filter').value=filter;renderResults();}setBusy(busy);}
function renderResults(){const q=query.toLowerCase();let items;if(view==='tasks'){items=state.tasks.filter(t=>(t.title+' '+t.detail).toLowerCase().includes(q)).filter(t=>filter==='all'||filter==='done'&&t.done||filter==='open'&&!t.done||filter==='overdue'&&!t.done&&t.dueDate&&t.dueDate<day()).sort((a,b)=>a.done-b.done||(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));$('results').innerHTML='<div class="card">'+(items.length?taskRows(items):empty('没有符合条件的待办','试试其他筛选条件，或新建待办。'))+'</div>';}
if(view==='notes'){items=state.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('results').innerHTML=items.length?noteCards(items):'<div class="card">'+empty('没有符合条件的笔记','新建笔记，开始记录。')+'</div>';}
if(view==='calendar'){items=state.events.filter(e=>(e.title+' '+e.location+' '+e.detail).toLowerCase().includes(q)).sort((a,b)=>a.start.localeCompare(b.start));let last='';$('results').innerHTML='<div class="card">'+(items.length?items.map(e=>{const date=e.start.slice(0,10),heading=date!==last?'<div class="date-heading">'+esc(date)+(date===day()?' · 今天':'')+'</div>':'';last=date;return heading+eventRows([e]);}).join(''):empty('没有符合条件的日程','新建日程，安排接下来的时间。'))+'</div>';}}
function field(id,label,type,value='',extra=''){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" name="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>';}
function textField(id,label,value='',max=20000){return '<label for="'+id+'">'+label+'</label><textarea id="'+id+'" name="'+id+'" maxlength="'+max+'">'+esc(value)+'</textarea>';}
function edit(type,id){if(!ready||busy||conflict)return;kind=type;editing=id||null;const item=state[type].find(x=>x.id===id)||{};$('editorTitle').textContent=(id?'编辑':'新建')+labels[type];$('formError').textContent='';let fields=field('title','标题','text',item.title,'required maxlength="200"');if(type==='tasks'){fields+=field('dueDate','截止日期','date',item.dueDate)+ '<label for="priority">优先级</label><select id="priority" name="priority"><option value="normal">普通</option><option value="high">高优先级</option><option value="low">低优先级</option></select>'+textField('detail','详情',item.detail,5000);}if(type==='notes')fields+=textField('body','笔记内容',item.body);if(type==='events')fields+=field('start','开始时间（北京时间）','datetime-local',item.start||day()+'T09:00','required')+field('end','结束时间（可选）','datetime-local',item.end)+field('location','地点或会议链接','text',item.location,'maxlength="500"')+textField('detail','日程详情',item.detail,5000);$('fields').innerHTML=fields;if(type==='tasks')$('priority').value=item.priority||'normal';$('editor').showModal();$('title').focus();}
$('form').onsubmit=async e=>{e.preventDefault();if(busy||conflict)return;const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title){$('formError').textContent='请输入标题';return;}const old=state[kind].find(x=>x.id===editing),item={...old,id:editing||crypto.randomUUID(),title};if(kind==='tasks')Object.assign(item,{dueDate:f.get('dueDate'),priority:f.get('priority'),detail:String(f.get('detail')).trim(),done:old?.done||false});if(kind==='notes')Object.assign(item,{body:String(f.get('body')),updatedAt:new Date().toISOString()});if(kind==='events'){const start=f.get('start'),end=f.get('end');if(end&&end<start){$('formError').textContent='结束时间不能早于开始时间';return;}Object.assign(item,{start,end,location:String(f.get('location')).trim(),detail:String(f.get('detail')).trim()});}const next=structuredClone(state);if(old)next[kind]=next[kind].map(x=>x.id===editing?item:x);else next[kind].push(item);if(await change(next)){$('editor').close();toast('已保存'+labels[kind]);}else $('formError').textContent=conflict?'云端已更新，请取消编辑并重新加载，再保存。':'保存未成功，内容仍保留在编辑框中。';};
$('cancel').onclick=()=>$('editor').close();$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('recover').onclick=()=>{if(!busy){$('editor').close();load();}};$('add').onclick=()=>edit(view==='notes'?'notes':view==='calendar'?'events':'tasks');document.querySelector('nav').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;query='';render();}};$('content').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderResults();}});$('content').addEventListener('change',async e=>{if(e.target.id==='filter'){filter=e.target.value;renderResults();}if(e.target.dataset.toggle){const next=structuredClone(state),t=next.tasks.find(t=>t.id===e.target.dataset.toggle);t.done=e.target.checked;if(!await change(next))e.target.checked=!e.target.checked;}});$('content').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){view=b.dataset.nav;query='';render();}if(b.dataset.edit)edit(b.dataset.edit,b.dataset.id);if(b.dataset.delete){const type=b.dataset.delete,item=state[type].find(x=>x.id===b.dataset.id);if(!confirm('删除'+labels[type]+'「'+item.title+'」？'))return;const next=structuredClone(state);next[type]=next[type].filter(x=>x.id!==item.id);await change(next);}};
document.title=scope==='work'?'工作工作台':'私人工作台';document.querySelector('.brand').replaceChildren(document.createTextNode(document.title));document.querySelectorAll('nav button').forEach(b=>b.textContent=titles[b.dataset.view]);$('projectLink').classList.toggle('hidden',scope==='personal');
$('today').textContent=new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'});load();
</script></body></html>
