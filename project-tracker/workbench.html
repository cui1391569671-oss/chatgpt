/* ========================================
   ANIMATION TOKENS
   @keyframes definitions and animation utilities
   ======================================== */

@theme {
  /* ========================================
     ANIMATION SHORTCUTS
     ======================================== */
  --animate-fade-in: fade-in 0.15s ease-out;
  --animate-slide-in: slide-in 0.2s ease-out;
  --animate-scale-in: scale-in 0.2s ease-out;
  --animate-float: float 3s ease-in-out infinite;
  --animate-orb-float: orb-float 8s ease-in-out infinite;
  --animate-pulse-glow: pulse-glow 2s ease-in-out infinite;
  --animate-shimmer: shimmer 2s infinite;
  --animate-accordion-down: accordion-down 0.2s ease-out;
  --animate-accordion-up: accordion-up 0.2s ease-out;
}

/* ========================================
   KEYFRAME DEFINITIONS
   ======================================== */

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slide-in {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}

@keyframes scale-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}

@keyframes orb-float {
  0%,
  100% {
    transform: translate(0, 0) scale(1);
  }
  33% {
    transform: translate(10px, -10px) scale(1.05);
  }
  66% {
    transform: translate(-5px, 5px) scale(0.95);
  }
}

@keyframes pulse-glow {
  0%,
  100% {
    box-shadow: var(--shadow-md);
  }
  50% {
    box-shadow: var(--glow-primary);
  }
}

@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes accordion-down {
  from {
    height: 0;
  }
  to {
    height: var(--radix-accordion-content-height);
  }
}

@keyframes accordion-up {
  from {
    height: var(--radix-accordion-content-height);
  }
  to {
    height: 0;
  }
}

@keyframes btn-shine {
  0% {
    left: -100%;
  }
  50%,
  100% {
    left: 100%;
  }
}

@keyframes ripple {
  0% {
    transform: scale(0);
    opacity: 0.6;
  }
  100% {
    transform: scale(4);
    opacity: 0;
  }
}

@keyframes glow-pulse {
  0%,
  100% {
    opacity: 0.6;
    filter: brightness(1);
  }
  50% {
    opacity: 1;
    filter: brightness(1.2);
  }
}

@keyframes skeleton-loading {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes modalFadeIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes dropdownFadeIn {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes circular-progress-spin {
  0% {
    transform: rotate(0deg);
    stroke-dashoffset: 187;
  }
  50% {
    stroke-dashoffset: 47;
  }
  100% {
    transform: rotate(360deg);
    stroke-dashoffset: 187;
  }
}

/* ========================================
   ANIMATION UTILITY CLASSES
   ======================================== */

.animate-fade-in {
  animation: fade-in 0.15s ease-out;
}

.animate-slide-in {
  animation: slide-in 0.2s ease-out;
}

.animate-scale-in {
  animation: scale-in 0.2s ease-out;
}

.animate-float {
  animation: float 3s ease-in-out infinite;
}

.animate-orb-float {
  animation: orb-float 8s ease-in-out infinite;
}

.animate-pulse-glow {
  animation: pulse-glow 2s ease-in-out infinite;
}

.animate-shimmer {
  animation: shimmer 2s infinite;
}

.animate-glow-pulse {
  animation: glow-pulse 2s ease-in-out infinite;
}

.animate-skeleton-loading {
  animation: skeleton-loading 1.5s infinite;
}

.animate-circular-progress-spin {
  animation: circular-progress-spin 1.4s ease-in-out infinite;
  transform-origin: center;
}

/* ========================================
   HOVER TRANSITION UTILITIES
   ======================================== */

.hover-glow {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.hover-glow:hover {
  transform: translateY(-2px);
}

/* ========================================
   SPARKLINE GLASS ANIMATIONS
   ======================================== */

@keyframes sparkline-grow {
  from {
    transform: scaleY(0);
    opacity: 0;
  }
  to {
    transform: scaleY(1);
    opacity: 1;
  }
}

.animate-sparkline-grow {
  animation: sparkline-grow 0.4s ease-out forwards;
  transform-origin: bottom;
}

/* ========================================
   INSIGHT CARD GLASS ANIMATIONS
   ======================================== */

@keyframes insight-fade-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-insight-fade-in {
  animation: insight-fade-in 0.3s ease-out forwards;
}

/* Role adapter only. Values come from the pinned shadcn-glass-ui Light preset. */
:root{
 --admin-radius:var(--radius);
 --admin-background:var(--semantic-surface-strong);
 --admin-foreground:var(--semantic-text);
 --admin-card:var(--card-bg);
 --admin-card-foreground:var(--semantic-text);
 --admin-popover:var(--dropdown-bg);
 --admin-popover-foreground:var(--semantic-text);
 --admin-primary:var(--semantic-primary);
 --admin-primary-foreground:var(--semantic-text-inverse);
 --admin-secondary:var(--semantic-surface-muted);
 --admin-secondary-foreground:var(--semantic-text);
 --admin-muted:var(--semantic-surface-muted);
 --admin-muted-foreground:var(--semantic-text-muted);
 --admin-accent:var(--semantic-primary-subtle);
 --admin-accent-foreground:var(--semantic-primary-text);
 --admin-destructive:var(--semantic-error);
 --admin-border:var(--semantic-border);
 --admin-input:var(--input-border);
 --admin-ring:var(--semantic-primary);
 --admin-sidebar:var(--sidebar-bg);
 --admin-sidebar-foreground:var(--semantic-text);
 --admin-sidebar-primary:var(--semantic-primary);
 --admin-sidebar-primary-foreground:var(--semantic-text-inverse);
 --admin-sidebar-accent:var(--sidebar-accent);
 --admin-sidebar-accent-foreground:var(--semantic-text);
 --admin-sidebar-border:var(--semantic-border);
 --admin-sidebar-ring:var(--semantic-primary-muted);
 --admin-chart-1:var(--semantic-primary);
 --admin-chart-2:var(--semantic-info);
 --admin-chart-3:var(--semantic-success);
 --admin-chart-4:var(--semantic-warning);
 --admin-chart-5:var(--semantic-error);
 --admin-font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;

/* Page-specific business layout. Shared controls belong to workspace.css. */
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
}
button,input,textarea,select {
  font: inherit;
}
button,a,input,textarea,select {
  outline-offset: 4px;
}
button,a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: .55;
}
a {
  color: var(--accent);
}
.shell {
  display: grid;
  grid-template-columns: 208px minmax(0,1fr);
  min-height: 100vh;
}
aside {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  font-size: 24px;
  font-weight: 750;
  padding: 0 14px 28px;
}
.brand small {
  display: block;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--muted);
  font-weight: 500;
}
nav {
  display: grid;
  gap: 4px;
}
nav button,nav a {
  padding: 8px 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  text-decoration: none;
  color: var(--muted);
  min-height: 40px;
}
nav .active {
  background: var(--soft);
  color: var(--accent);
  font-weight: 650;
}
nav button:hover,nav a:hover {
  background: var(--bg);
}
.aside-footer {
  position: absolute;
  bottom: 16px;
  left: 24px;
  color: var(--muted);
  font-size: 14px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
h1 {
  font-size: 27px;
  line-height: 1.3;
  margin: 0;
}
h2 {
  font-size: 18px;
  margin: 0;
}
h3 {
  font-size: 18px;
  margin: 0;
}
p {
  margin: 6px 0;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  color: var(--accent);
  font-size: 14px;
  letter-spacing: 1px;
  font-weight: 650;
  margin-bottom: 4px;
}
.btn {
  border: 1px solid var(--line);
  padding: 7px 12px;
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn:hover {
  background: var(--bg);
}
.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--semantic-text-inverse);
}
.primary:hover {
  background: var(--semantic-info-muted);
}
.danger {
  color: var(--danger);
}
.status {
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 15px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.status.error {
  background: var(--semantic-surface);
  color: var(--danger);
}
.stats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.card {
  padding: 16px;
  min-width: 0;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  margin-top: 4px;
}
.grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 12px;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.card-head button {
  background: none;
  border: 0;
  color: var(--accent);
  padding: 8px;
  min-height: 44px;
}
.empty {
  padding: 14px 8px;
  text-align: center;
  color: var(--muted);
}
.empty strong {
  display: block;
  color: var(--text);
  font-weight: 600;
}
.row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child {
  border-bottom: 0;
}
.row-content {
  flex: 1;
  min-width: 0;
}
.row-title {
  font-weight: 600;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.row-meta {
  color: var(--muted);
  font-size: 15px;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.row input[type=checkbox] {
  width: 22px;
  height: 22px;
  margin: 3px 0;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.completed .row-title {
  text-decoration: line-through;
  color: var(--muted);
}
.tag {
  display: inline-block;
  background: var(--soft);
  color: var(--accent);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 14px;
  margin-right: 8px;
}
.overdue {
  color: var(--danger);
}
.actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.actions button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px;
  min-height: 44px;
}
.actions button:hover {
  background: var(--bg);
  border-radius: 8px;
}
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.filters input {
  flex: 1;
  min-width: 180px;
}
.notes {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 12px;
}
.notes .actions {
  margin-top: auto;
}
.date-heading {
  margin: 14px 0 4px;
  color: var(--muted);
  font-weight: 600;
}
.event-time {
  font-size: 15px;
  color: var(--accent);
  min-width: 100px;
}
.full {
  grid-column: 1/-1;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  width: min(560px,calc(100% - 32px));
  max-height: 90dvh;
  overflow: auto;
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
dialog::backdrop {
  background: var(--modal-overlay);
}
dialog label {
  display: block;
  font-size: 16px;
  font-weight: 600;
  margin: 12px 0 4px;
}
dialog input,dialog textarea,dialog select {
  width: 100%;
  border: 1px solid var(--line);
  padding: 10px 12px;
}
dialog textarea {
  resize: vertical;
}
dialog .actions {
  justify-content: flex-end;
  margin-top: 16px;
}
.form-error {
  color: var(--danger);
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: white;
  border-radius: 10px;
  padding: 12px 20px;
  z-index: 5;
  max-width: 90vw;
}
.hidden:not(:where(.ilamy-surface *,[data-ilamy-portal],[data-ilamy-portal] *,[data-shell-root] *,[data-shell-portal] *,[data-tasks-root] *,[data-tasks-portal] *,[data-ui-root] *,[data-ui-portal] *)) {
  display: none!important;
}
@media(max-width:1100px) {
  .notes {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
  .stats {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}
@media(max-width:760px) {
  .shell {
    display: block;
  }
  aside {
    height: auto;
    position: static;
    padding: 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    padding: 0 4px 12px;
    font-size: 22px;
  }
  .brand small,.aside-footer {
    display: none;
  }
  nav {
    display: flex;
    overflow: auto;
    gap: 4px;
  }
  nav button,nav a {
    white-space: nowrap;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  header {
    align-items: flex-start;
  }
  h1 {
    font-size: 27px;
  }
  .grid,.notes {
    grid-template-columns: 1fr;
  }
  .stats {
    gap: 10px;
  }
  .card {
    padding: 18px;
  }
  .stat-value {
    font-size: 30px;
  }
  .row {
    flex-wrap: wrap;
  }
  .row .actions {
    margin-left: auto;
    flex-basis: 100%;
    justify-content: flex-end;
  }
  .row-content {
    flex-basis: 180px;
  }
  .status {
    align-items: flex-start;
  }
  .event-time {
    flex-basis: 100%;
    min-width: 85px;
  }
  .filters input {
    width: 100%;
  }
}
.calendar-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.calendar-controls {
  display: flex;
  gap: 6px;
}
.weekdays,.month-grid {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  gap: 6px;
}
.weekdays {
  color: var(--muted);
  font-size: 15px;
  text-align: center;
  margin-bottom: 8px;
}
.calendar-day:hover {
  border-color: var(--accent);
  background: var(--soft);
}
.calendar-day.outside {
  color: var(--muted);
  background: var(--bg);
}
.calendar-day.today .day-number {
  background: var(--accent);

  border-radius: 50%;

}
.calendar-count {
  font-size: 13px;
  color: var(--accent);
  white-space: nowrap;
}
.agenda .card-head {
  flex-wrap: wrap;
}
.calendar-hint {
  font-size: 14px;
  margin-top: 16px;
  color: var(--muted);
}
@media(max-width:1000px) {
  .calendar-layout {
    grid-template-columns: 1fr;
  }
}
@media(max-width:760px) {
  .calendar-day {
    min-height: 60px;
    padding: 5px;
  }
  .calendar-day.selected {
    padding: 4px;
  }
  .calendar-count {
    font-size: 12px;
  }
  .weekdays,.month-grid {
    gap: 3px;
  }
  .calendar-controls .btn {
    padding: 8px 12px;
  }
  .space-switch {
    margin-top: 0;
  }
}
.holiday-name {
  font-size: 13px;
  color: var(--semantic-error-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.calendar-day.rest-day {
  background: var(--semantic-surface);
}
.calendar-day.makeup-day {
  background: var(--semantic-surface);
}
.calendar-day.selected {
  border: 2px solid var(--accent);
  background: var(--soft);
  padding: 7px;
}
.day-heading {
  display: flex;
  align-items: center;
  gap: 4px;

}
.day-flag {
  font-size: 12px;
  border-radius: 4px;

}
.day-flag.work {
  background: var(--semantic-info-muted);

}
.holiday-detail.work {
  background: var(--semantic-surface);

}
.holiday-legend a {
  color: var(--accent);
}
.holiday-unknown {
  font-size: 14px;
  color: var(--muted);

}
@media(max-width:760px) {
  .calendar-day {
    min-height: 68px;
  }

    font-size: 12px;
  }

  }

.day-flag.festival {

.holiday-detail.festival {
  background: var(--semantic-surface);

}
.calendar-day.festival-day {
  background: var(--semantic-surface);
}
.sidebar-toggle:hover {
  background: var(--soft);

}
.nav-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
nav button,.space-switch {
  display: flex;
  align-items: center;

}
.shell.sidebar-collapsed {

.sidebar-collapsed aside {

}

@media(max-width:760px) {

.notifications {

.notifications summary {

}

}
.notification-item {

.notification-item small {

.notification-item.overdue small {

}
nav button[data-view="tasks"] {

/* Shared usability rules for both workspaces. */
.calendar-layout {
  display: grid;
  grid-template-columns: minmax(0,1.6fr) minmax(260px,1fr);
  gap: 12px;
  align-items: start;
}
.agenda {
  min-height: 180px;
}
@media(max-width:760px) {
  .shared-workspace aside nav {
    display: flex;
    flex-wrap: wrap;
    overflow: visible;
    white-space: normal;
    gap: 4px;
  }
  .shared-workspace aside nav button {
    flex: 0 0 auto;
    min-height: 44px;
  }
  .agenda {
    min-height: 0;
  }
}
.release-list .game-cover-thumb {
  height: auto;
  aspect-ratio: 2/3;
  object-fit: contain;
}
.record-cover .game-cover {

}
.nav-group {
  position: relative;
}
.nav-group>summary::-webkit-details-marker {
  display: none;
}
.nav-group.group-active>summary {
  color: var(--accent);
  background: var(--soft);
  font-weight: 650;
}
.nav-group>summary:focus-visible {
  outline: 2px solid var(--accent);
}
.nav-submenu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 180px;
  z-index: 30;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 4px;
}
.task-game-cover {
  width: 54px;
  height: 81px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 6px;
  background: var(--soft);
}
.task-cover-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted);
}
@media(max-width:760px) {
  .nav-group>summary {
    font-size: 15px;
    padding: 8px 10px;
  }
  .nav-submenu {
    min-width: 160px;
  }
  .nav-group:last-child .nav-submenu {
    left: auto;
    right: 0;
  }
}
/* Unified navigation interaction. */
.shared-workspace aside nav {
  min-height: 0;
  overflow-y: hidden;
  display: flex;
  flex: 1;
  min-width: 0;
  gap: 4px;
  overflow-x: auto;
  align-items: center;
  justify-content: safe center;
  overflow: visible;
}
.shared-workspace aside nav>button,.nav-group>summary {
  min-height: 44px;
  border-radius: 10px;
  padding: 9px 14px;
  transition: background-color 160ms ease,color 160ms ease,box-shadow 160ms ease;
}
.nav-group>summary:hover,.nav-group[open]>summary {
  background: var(--soft);
  color: var(--accent);
}
.nav-group>summary::after {
  content: '';
  font-size: 14px;
  width: 5px;
  height: 5px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
  margin-left: 3px;
  transition: transform 180ms ease;
}
.nav-group[open]>summary::after {
  transform: rotate(225deg);
}
.nav-group>summary {
  list-style: none;
  cursor: pointer;
  padding: 8px 12px;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 7px;
  border-radius: 8px;
  color: var(--muted);
  white-space: nowrap;
}
.nav-group .nav-submenu {
  top: calc(100% + 5px);
  padding: 6px;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  transform-origin: top center;
}
.nav-group .nav-submenu::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: -9px;
  height: 9px;
}
.nav-group[open] .nav-submenu {
  animation: nav-menu-enter 160ms ease-out both;
}
.shared-workspace nav .nav-submenu button {
  width: 100%;
  min-height: 44px;
  justify-content: flex-start;
  transition: background-color 140ms ease,color 140ms ease;
  border-radius: 8px;
}
.shared-workspace nav .nav-submenu button:hover {
  background: var(--soft);
  color: var(--accent);
}
@keyframes nav-menu-enter {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media(max-width:760px) {
  .shared-workspace aside nav>button,.nav-group>summary {
    padding: 8px 10px;
  }
}
/* Shared motion: feedback only; data refresh does not animate whole pages. */
:root {
  --bg: var(--semantic-surface);
  --surface: var(--semantic-surface);
  --text: var(--semantic-info-text);
  --muted: var(--semantic-info-text);
  --line: var(--semantic-text-inverse);
  --accent: var(--semantic-info-text);
  --soft: var(--semantic-surface);
  --danger: var(--semantic-error-text);
  --motion-fast: 140ms;
  --motion-enter: 180ms;
  --motion-ease: cubic-bezier(.2,.7,.2,1);
}
.btn,.actions button,.calendar-day,.filters input,.filters select,dialog input,dialog select,dialog textarea {
  transition: background-color var(--motion-fast) ease,border-color var(--motion-fast) ease,color var(--motion-fast) ease,opacity var(--motion-fast) ease;
}
dialog[open] {
  animation: workspace-enter var(--motion-enter) var(--motion-ease);
}
dialog[open]::backdrop {
  animation: workspace-backdrop var(--motion-fast) ease;
}
.toast:not(.hidden) {
  animation: workspace-fade var(--motion-fast) ease;
}
@keyframes workspace-enter {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes workspace-backdrop {
  from {
    background: transparent;
  }
  to {
    background: var(--modal-overlay);
  }
}
@keyframes workspace-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.motion-paused .calendar-day::before {
  animation-play-state: paused;
}

.checkin-list{list-style:none;padding:0;margin:0}.checkin-list li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--semantic-border)}.checkin-list li:last-child{border-bottom:0}.checkin-toggle{flex:1;min-width:0}.checkin-toggle span{overflow-wrap:anywhere}

/* Canonical workspace layout and materials. Edit owners here; do not append override sheets. */
:root {
  --bg: var(--semantic-surface);
  --surface: var(--semantic-surface);
  --card: var(--semantic-surface);
  --text: var(--semantic-text);
  --muted: var(--semantic-text-muted);
  --text-light: var(--semantic-text-muted);
  --line: var(--semantic-text-muted);
  --border: var(--semantic-border);
  --accent: var(--semantic-info-text);
  --soft: var(--semantic-surface);
  --primary: var(--semantic-text);
}
body {
  -webkit-font-smoothing: antialiased;
  scrollbar-color: var(--semantic-text-muted) transparent;
  scrollbar-width: thin;
}
.shared-workspace aside {
  background: var(--modal-overlay);
  backdrop-filter: blur(16px);
  padding: 10px 24px;
  border-color: var(--line);
}
.shared-workspace .brand {
  font-weight: 600;
  font-size: 19px;
  letter-spacing: -.5px;
}
.shared-workspace aside nav {
  justify-content: center;
  gap: 8px;
}
.shared-workspace nav>button,.shared-workspace .nav-group>summary {
  font-size: 16px;
  font-weight: 400;
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--muted);
}
.shared-workspace nav .active,.shared-workspace .nav-group.group-active>summary {
  color: var(--accent);
  background: var(--soft);
  box-shadow: none;
  font-weight: 500;
}
.shared-workspace .nav-submenu {
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  padding: 8px;
  border-color: var(--line);
}
.shared-workspace h1 {
  font-size: 34px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -1px;
}
.shared-workspace .header-title {
  gap: 18px;
}
.shared-workspace .eyebrow {
  font-size: 14px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0;
}
.shared-workspace h2 {
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -.4px;
}
.shared-workspace .card-head {
  margin-bottom: 18px;
}
.shared-workspace .card-head button {
  color: var(--accent);
  min-height: 44px;
  padding: 8px 10px;
}
.shared-workspace .grid,.shared-workspace .notes,.shared-workspace .maintenance-list {
  gap: 20px;
}
.shared-workspace .row {
  padding: 18px 2px;
  gap: 14px;
}
.shared-workspace .row-title {
  font-weight: 500;
  font-size: 17px;
}
.shared-workspace .row-meta {
  font-size: 15px;
  line-height: 1.7;
}
.shared-workspace .actions button {
  min-height: 44px;
  padding: 9px 11px;
  border-radius: 9px;
}
.shared-workspace .empty {
  padding: 30px 6px;
  font-size: 16px;
}
.shared-workspace .empty strong {
  font-weight: 500;
  font-size: 16px;
}
.shared-workspace .btn {
  padding: 9px 16px;
}
.shared-workspace .primary {
  background: var(--accent);
  border-color: var(--accent);
  padding: 10px 20px;
}
.shared-workspace .primary:hover {
  filter: brightness(.92);
  background: var(--accent);
}
.shared-workspace .filters {
  margin-bottom: 20px;
  gap: 10px;
}
.shared-workspace .filters input,.shared-workspace .filters select {
  padding: 10px 14px;
  background: var(--surface);
  border-color: var(--line);
  color: var(--text);
}
.shared-workspace input::placeholder {
  color: var(--muted);
}
.shared-workspace .tag {
  border-radius: 6px;
  padding: 3px 8px;
}
.shared-workspace .calendar-toolbar h2 {
  font-size: 25px;
  font-weight: 500;
}
.shared-workspace .calendar-controls .btn {
  min-width: 44px;
  padding: 8px 13px;
}
.shared-workspace .weekdays {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 14px;
}
.shared-workspace .calendar-day.selected {
  border: 1px solid var(--accent);
  background: var(--soft);
  padding: 10px;
  box-shadow: inset 0 0 0 1px var(--accent);
}
.shared-workspace .calendar-day.today .day-number {
  border-radius: 50%;
  background: var(--accent);
  color: var(--semantic-text-inverse);
}
.shared-workspace .calendar-day.outside {
  background: var(--bg);
  color: var(--muted);
}
.shared-workspace .calendar-day::before {
  animation: none;
  mask: none;
  -webkit-mask: none;
  height: 3px;
  width: 100%;
  opacity: .5;
}
.shared-workspace .calendar-hint {
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.8;
}
.shared-workspace .agenda .empty {
  text-align: left;
  padding: 30px 0;
}
.personal-dashboard .daily-vocabulary {
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}
.personal-dashboard .daily-word {
  border-radius: 10px;
  padding: 15px;
  background: var(--bg);
  border-color: var(--line);
}
.personal-dashboard .daily-word:last-child {
  grid-column: 1/-1;
}
.shared-workspace .daily-word h3 {
  font-size: 17px;
}
.shared-workspace .word-title-audio {
  color: var(--accent);
}
.shared-workspace .completed-game-grid {
  gap: 18px;
}
.shared-workspace .completed-game-grid .card {
  padding: 12px;
}
.shared-workspace .record-cover {
  border-radius: 9px;
}
.shared-workspace .release-item {
  border-radius: 14px;
}
.shared-workspace .release-item div {
  padding: 16px;
}
.shared-workspace .status {
  border-radius: 12px;
  padding: 14px 18px;
}
.shared-workspace dialog {
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 30px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  color: var(--text);
}
.shared-workspace dialog::backdrop {
  background: var(--modal-overlay);
  backdrop-filter: blur(4px);
}
.shared-workspace dialog h2 {
  font-size: 27px;
  margin-bottom: 22px;
}
.shared-workspace dialog label {
  font-size: 15px;
  font-weight: 500;
  margin-top: 18px;
}
.shared-workspace dialog input,.shared-workspace dialog select,.shared-workspace dialog textarea {
  border: 1px solid var(--line);
  padding: 12px 14px;
  background: var(--surface);
  color: var(--text);
}
.shared-workspace dialog .actions {
  gap: 10px;
  margin-top: 26px;
}
.shared-workspace .notification-item {
  padding: 18px;
}
.shared-workspace .btn:focus-visible,.shared-workspace input:focus-visible,.shared-workspace select:focus-visible,.shared-workspace textarea:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.shared-workspace .page-footer {
  color: var(--muted);
  padding: 30px 12px 20px;
}
.shared-workspace .clothing {
  border-radius: 14px;
}
.shared-workspace .notes .note-body {
  line-height: 1.8;
}
/* The embedded project table uses the same product tokens. */
.container .header h1 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -.8px;
}
.container .toolbar,.container .table-wrapper {
  border-radius: 16px;
}
.container .btn-primary,.container .btn-success,.container .btn-add {
  background: var(--accent);
  border-color: var(--accent);
}
.container .btn-primary:hover,.container .btn-success:hover,.container .btn-add:hover {
  background: var(--semantic-info-muted);
}
.container thead th {
  background: var(--semantic-surface);
  color: var(--semantic-text-muted);
}
.container .modal {
  border-radius: 22px;
  box-shadow: var(--shadow-sm);
}
.container input:focus-visible,.container select:focus-visible,.container textarea:focus-visible,.container button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.personal-dashboard>.full {
  grid-column: auto;
}
.shared-workspace .brand a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: inherit;
  text-decoration: none;
  min-height: 44px;
}
.shared-workspace .brand a svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.shared-workspace .brand a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}
@media(max-width:1000px) {
  .shared-workspace .calendar-layout {
    grid-template-columns: 1fr;
  }
  .personal-dashboard {
    grid-template-columns: 1fr;
  }
}
@media(max-width:760px) {
  .shared-workspace aside {
    padding: 10px 12px;
    backdrop-filter: none;
  }
  .shared-workspace aside nav {
    justify-content: flex-start;
    gap: 3px;
  }
  .shared-workspace nav>button,.shared-workspace .nav-group>summary {
    font-size: 15px;
    padding: 8px 10px;
  }
  .shared-workspace h1 {
    font-size: 29px;
  }
  .shared-workspace header {
    margin-bottom: 22px;
  }
  .shared-workspace .header-title {
    display: block;
  }
  .shared-workspace .card {
    padding: 16px;
  }
  .shared-workspace .calendar-day,.shared-workspace .calendar-day.selected {
    padding: 5px;
    min-height: 62px;
    border-radius: 7px;
  }
  .shared-workspace .calendar-toolbar h2 {
    font-size: 23px;
  }
  .shared-workspace .grid,.shared-workspace .notes {
    gap: 14px;
  }
  .shared-workspace .row {
    padding: 14px 0;
    gap: 10px;
  }
  .personal-dashboard {
    gap: 20px;
    margin-top: 20px;
  }
  .personal-dashboard .daily-vocabulary {
    grid-template-columns: 1fr;
  }
  .personal-dashboard .daily-word:last-child {
    grid-column: auto;
  }
  .shared-workspace dialog {
    padding: 22px;
    border-radius: 18px;
  }
  .shared-workspace .completed-game-grid .card {
    padding: 10px;
  }
}
@media(max-width:760px) {
  .shared-workspace nav>button,.shared-workspace .nav-group>summary {
    font-size: 14px;
    padding: 8px 6px;
  }
  .shared-workspace aside nav {
    gap: 2px;
  }
}
/* Compact hierarchy and related views share one entry. */
.shared-workspace main {
  max-width: 1440px;
}
.shared-workspace header {
  margin-bottom: 18px;
  align-items: center;
}
.shared-workspace .card {
  padding: 20px;
}
.shared-workspace .calendar-layout {
  grid-template-columns: minmax(0,1.4fr) minmax(280px,1fr);
  gap: 18px;
  align-items: start;
}
.shared-workspace .calendar-toolbar {
  margin-bottom: 16px;
}
.shared-workspace .calendar-day {
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--line);
  min-height: 66px;
  padding: 10px;
  color: var(--text);
}
.personal-dashboard {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.4fr);
  gap: 18px;
  margin-top: 18px;
}
.view-tabs {
  display: flex;
  gap: 4px;
  width: fit-content;
  padding: 4px;
  margin: 0 0 18px;
  border-radius: 12px;
  background: var(--line);
}
.view-tabs button {
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  min-height: 44px;
  padding: 8px 22px;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  transition: background .18s,color .18s;
}
.view-tabs button[aria-pressed=true] {
  background: var(--surface);
  color: var(--accent);
}
.view-tabs button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
@media(max-width:760px) {
  .shared-workspace .card {
    padding: 16px;
  }
  .shared-workspace .calendar-day {
    min-height: 58px;
  }
  .view-tabs {
    margin-bottom: 14px;
  }
}
@media(max-width:760px) {
  .shared-workspace aside nav {
    flex-wrap: nowrap;
  }
  .shared-workspace nav>button {
    flex-shrink: 0;
  }
  .shared-workspace nav>button .nav-icon {
    width: 16px;
    height: 16px;
  }
  .shared-workspace .nav-group>summary {
    white-space: nowrap;
  }
}
.shared-workspace .agenda .card-head {
  gap: 12px;
  align-items: center;
}
.shared-workspace .agenda h2 {
  font-size: 19px;
}
.shared-workspace .agenda-add {
  flex-shrink: 0;
  border-color: var(--line);
  background: var(--surface);
}
.calendar-side {
  display: grid;
  gap: 18px;
}
.shared-workspace .next-tasks .row {
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding: 14px 0;
}
.shared-workspace .next-tasks .row:last-child {
  border-bottom: 0;
}
.shared-workspace .next-tasks .actions {
  margin-left: auto;
}
.next-tasks-empty p {
  color: var(--muted);
  font-size: 16px;
  margin: 8px 0 16px;
}
.shared-workspace .next-tasks .card-head {
  margin-bottom: 10px;
}
.shared-workspace .next-tasks .row-meta p {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.shared-workspace #deleteEntertainment {
  margin-right: auto;
  color: var(--semantic-error-text);
  background: transparent;
  border-color: var(--line);
}
.shared-workspace .cover-platform {
  background: transparent;
  text-shadow: var(--shadow-sm);
  padding: 5px 0;
  color: var(--semantic-text-inverse);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .3px;
  line-height: 1.5;
}
.shared-workspace .cover-rating {
  max-width: calc(100% - 48px);
  font-size: 11px;
  background: transparent;
  color: var(--semantic-text-inverse);
  font-weight: 600;
  text-shadow: var(--shadow-sm);
  padding: 0;
}
.shared-workspace .completed-game-grid .record-cover {
  margin-bottom: 0;
}
.anime-cover-choices {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(110px,1fr));
  gap: 12px;
  max-height: 380px;
  overflow: auto;
  padding: 4px;
  margin: 12px 0;
}
.anime-cover-choices.hidden {
  display: none;
}
.anime-cover-choice {
  min-width: 0;
  padding: 6px;
  border: 1px solid var(--border,var(--semantic-border));
  border-radius: 10px;
  background: var(--card,var(--semantic-surface));
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.anime-cover-choice img {
  display: block;
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 6px;
  background: var(--semantic-surface);
}
.anime-cover-choice span {
  display: block;
  margin-top: 6px;
  font-size: 14px;
  line-height: 1.4;
}
.anime-cover-choice small {
  display: block;
  margin-top: 4px;
  color: var(--semantic-info-text);
}
.anime-cover-choice[aria-pressed=true],.anime-cover-choice:focus-visible {
  outline: 2px solid var(--semantic-info-text);
  outline-offset: 1px;
}
.repeat-weekdays {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.repeat-weekdays label {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  margin: 0;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
}
.repeat-weekdays input {
  width: 18px;
  margin: 0;
}
#repeatWeekdays {
  margin: 16px 0;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 12px;
}
#repeatWeekdays[hidden],#repeatUntilFields[hidden] {
  display: none;
}
/* Canonical workbench tokens feed the scoped ilamy theme and its Radix portals. */
#workspaceCalendar {
  --ilamy-brand: var(--accent);
  --ilamy-bg: var(--surface);
  --ilamy-ink: var(--text);
  --ilamy-line: var(--line);
  min-width: 0;
}
.calendar-full-surface {
  min-width: 0;
}
/* Project name is a shared cell for all visible issues in its group. */
.modern-project tbody .project-merged {
  vertical-align: middle;
  white-space: normal;
  overflow-wrap: anywhere;
  background: var(--semantic-surface);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  font-weight: 600;
  color: var(--text);
}
.modern-project .project-merged small {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}
.modern-project .project-group-start td {
  border-top: 1px solid var(--line);
}
.modern-project *::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}
.modern-project *::-webkit-scrollbar-thumb {
  background: var(--semantic-surface);
  border-radius: 7px;
}
.modern-project *::-webkit-scrollbar-track {
  background: var(--bg);
}
.modern-project .btn {
  padding: 8px 12px;
  font-weight: 500;
  box-shadow: none;
}
.modern-project .btn-primary,.modern-project .btn-add,.modern-project .btn-success {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--semantic-text-inverse);
}
.modern-project .btn-primary:hover,.modern-project .btn-add:hover {
  background: var(--semantic-info-muted);
  border-color: var(--semantic-info-muted);
  filter: none;
}
.modern-project :focus-visible {
  outline: 3px solid var(--modal-overlay);
  outline-offset: 3px;
}
.modern-project button:disabled {
  cursor: not-allowed;
  opacity: .5;
}
.modern-stats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.modern-stat-label {
  font-size: 14px;
  color: var(--semantic-text-muted);
}
.modern-stat-value {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1.3;
  margin: 10px 0 5px;
  font-variant-numeric: tabular-nums;
}
.modern-stat-hint {
  font-size: 13px;
  color: var(--muted);
}
.modern-project .container {
  padding: 20px;
  gap: 0;
}
.modern-project .header h1 {
  font-size: 27px;
  letter-spacing: -.6px;
  font-weight: 650;
}
.modern-project .toolbar {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 0 0 8px 8px;
  padding: 12px 18px;
  gap: 8px;
  margin-bottom: 16px;
}
.modern-project .toolbar-row {
  gap: 8px;
}
.modern-project .issue-quick-tabs {
  display: flex;
  gap: 18px;
  align-items: center;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
  background: var(--surface);
  padding: 8px 18px 0;
}
.issue-quick-tabs button {
  border: 0;
  border-bottom: 2px solid transparent;
  min-height: 44px;
  padding: 7px 0;
  background: none;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
}
.issue-quick-tabs button[aria-pressed=true] {
  border-bottom-color: var(--text);
  color: var(--text);
  font-weight: 600;
}
.issue-quick-tabs button:hover {
  color: var(--accent);
}
.modern-project .table-wrapper {
  scrollbar-gutter: stable;
}
.modern-project thead th {
  text-align: left;
  color: var(--muted);
  background: var(--semantic-surface);
  border-bottom: 1px solid var(--line);
}
.modern-project tbody td {
  border-bottom: 1px solid var(--semantic-border);
}
.modern-project .issue-group td {
  background: var(--semantic-surface);
}
.modern-project .compact-issue:hover {
  background: var(--semantic-surface);
}
.modern-project .issue-open {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 0;
  background: none;
  border: 0;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}
.issue-open span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.issue-status-dot {
  width: 12px;
  height: 12px;
  border: 1.5px solid var(--semantic-info-muted);
  border-radius: 50%;
  background: linear-gradient(90deg,var(--semantic-info-muted) 50%,white 50%);
  flex-shrink: 0;
}
.issue-status-dot.paused {
  border-color: var(--semantic-warning-muted);
  background: var(--semantic-surface);
}
.issue-status-dot.completed {
  background: var(--semantic-success-muted);
  border-color: var(--semantic-success-muted);
}
.modern-project .issue-project-name {
  color: var(--semantic-text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.issue-state-pill {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  padding: 4px 7px;
  border: 1px solid var(--semantic-border);
  border-radius: 4px;
  color: var(--semantic-info-text);
  background: var(--semantic-surface);
  font-size: 13px;
  cursor: pointer;
}
.issue-state-pill.paused {

utton><button class="btn primary" id="clothingSave">保存</button></div></form></dialog><dialog id="notifications" aria-labelledby="notificationSummary"><div class="card-head"><h2 id="notificationSummary">消息通知</h2><button class="btn" id="notificationClose" aria-label="关闭消息通知">关闭</button></div><p class="muted">按北京时间提前一天提醒，包含未完成的逾期任务；工作和私人提醒分别汇总。</p><div id="notificationList" class="notification-list"></div></dialog><dialog id="releaseDialog" class="release-dialog" aria-labelledby="releaseTitle"><div class="card-head"><h2 id="releaseTitle">今年已发售热门游戏</h2><button class="btn" id="releaseClose">关闭</button></div><p class="muted">收录 Steam 热门新品与 PlayStation 官方精选中的今年已发售游戏。中文名优先；不同平台的发售日期分别标注。</p><div class="release-toolbar"><input id="releaseSearch" aria-label="搜索已发售游戏" placeholder="搜索游戏名称"><select id="releasePlatform" aria-label="游戏平台筛选"><option value="all">全部平台</option><option value="pc">PC 游戏</option><option value="ps">PS5 游戏</option></select><button class="btn" id="releaseRefresh">刷新榜单</button></div><div id="releasedList" aria-live="polite"></div></dialog><dialog id="editor"><form id="form" novalidate><h2 id="editorTitle"></h2><div id="fields"></div><p id="formError" class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn danger hidden" id="deleteEntertainment">删除记录</button><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">保存</button></div></form></dialog><div class="toast hidden" role="status" id="toast"></div>
<script>
/* CHECKIN_RECORDS_START */
const CHECKIN_KINDS={english:'英语学习',fitness:'健身'};
function validCheckin(row){return !!row&&Object.hasOwn(CHECKIN_KINDS,row.kind)&&typeof row.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(row.date)&&!Number.isNaN(Date.parse(row.date))&&new Date(row.date).toISOString().slice(0,10)===row.date&&row.id===row.date+':'+row.kind&&typeof row.completedAt==='string'&&row.completedAt.length<=40&&Number.isFinite(Date.parse(row.completedAt));}
function setDailyCheckin(rows,kind,date,checked,completedAt){const record={id:date+':'+kind,kind,date,completedAt};if(!validCheckin(record))throw Error('打卡日期或类型无效');const next=rows.filter(row=>row.id!==record.id);if(checked)next.push(rows.find(row=>row.id===record.id)||record);return next;}

/* CHECKIN_RECORDS_END */
/* TODAY_TASKS_START */
let todayTaskData=null,todayTaskLoading=false,todayTaskError='';
function todayTasksPage(){return '<section aria-label="今日任务"><div class="card-head"><div><h2>今日任务</h2><p class="muted">数据来源于日历，按北京时间展示当天的全部条目。</p></div><div class="actions"><button class="btn" data-nav="home">返回概览</button><button class="btn" data-refresh-today '+(todayTaskLoading?'disabled':'')+'>刷新</button></div></div><div id="todayTaskResults" aria-live="polite"></div></section>';}
function renderTodayTaskResults(){const node=$('todayTaskResults');if(!node)return;let html='';if(todayTaskError)html+='<p class="form-error" role="alert">'+esc(todayTaskError)+' 当前内容保留，可点击刷新重试。</p>';if(!todayTaskData){node.innerHTML=html+(todayTaskLoading?'<div class="card empty" role="status">正在读取今日任务…</div>':'');return;}html+='<p class="muted today-task-date">'+esc(todayTaskData.date)+' · 共 '+todayTaskData.items.length+' 项</p>';const rows=todayTaskData.items;html+='<section class="card today-task-group" aria-label="今日日历清单"><div class="card-head"><h2>日历安排</h2><span class="muted">'+rows.length+' 项</span></div>'+(rows.length?rows.map(item=>'<article class="row"><div class="row-content"><div class="row-title">'+esc(item.title)+'</div><div class="row-meta"><span class="tag">'+esc(item.time)+'</span><span class="tag">'+({tasks:'待办',projects:'项目问题',events:'日程'}[item.source]||'日历')+'</span><span class="tag">'+esc(item.status)+'</span>'+(item.project?'<span>'+esc(displayProject(item.project))+'</span>':'')+'</div>'+(item.detail?'<p class="today-task-detail">'+esc(item.detail)+'</p>':'')+'</div><div class="actions">'+(item.source==='tasks'?'<button data-edit="tasks" data-id="'+esc(item.id)+'">查看待办</button>':item.source==='projects'?'<button data-nav="projects">查看项目</button>':'<button data-today-calendar="'+esc(todayTaskData.date)+'">查看日历</button>')+'</div></article>').join(''):'<div class="empty">今天的日历暂无安排。</div>')+'</section>';node.innerHTML=html;}
async function refreshTodayTasks(){if(!ready||todayTaskLoading||view!=='today')return;todayTaskLoading=true;const refresh=document.querySelector('[data-refresh-today]');if(refresh)refresh.disabled=true;renderTodayTaskResults();try{const response=await fetch('/api/today-tasks?scope='+scope,{cache:'no-store'});if(!response.ok)throw Error('读取失败（'+response.status+'）');todayTaskData=await response.json();todayTaskError='';}catch(error){todayTaskError=error.message||'今日任务读取失败';}finally{todayTaskLoading=false;if(view==='today'){renderTodayTaskResults();const refresh=document.querySelector('[data-refresh-today]');if(refresh)refresh.disabled=false;}}}
setInterval(()=>{if(!document.hidden)refreshTodayTasks();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTodayTasks();});

/* TODAY_TASKS_END */

/* REQUIREMENTS_START */
const REQUIREMENT_STATUSES={proposed:'待评估',planned:'已排期',active:'处理中',done:'已完成',dismissed:'暂不处理'};
function validRequirements(rows){const ids=new Set();return Array.isArray(rows)&&rows.length<=2000&&rows.every(r=>r&&typeof r.id==='string'&&r.id.length>0&&r.id.length<=100&&!ids.has(r.id)&&(ids.add(r.id),true)&&typeof r.title==='string'&&!!r.title.trim()&&r.title.length<=200&&typeof r.detail==='string'&&r.detail.length<=5000&&['high','normal','low'].includes(r.priority)&&typeof r.status==='string'&&Object.hasOwn(REQUIREMENT_STATUSES,r.status)&&(r.statusBeforeCompletion===undefined||typeof r.statusBeforeCompletion==='string'&&r.statusBeforeCompletion!=='done'&&Object.hasOwn(REQUIREMENT_STATUSES,r.statusBeforeCompletion))&&['createdAt','updatedAt'].every(k=>typeof r[k]==='string'&&Number.isFinite(Date.parse(r[k]))));}
function requirementWithStatus(row,status,at=new Date().toISOString()){
 if(typeof status!=='string'||!Object.hasOwn(REQUIREMENT_STATUSES,status))throw Error('无效需求状态');
 const next={...row,status,updatedAt:at};
 if(status==='done'&&row.status!=='done')next.statusBeforeCompletion=typeof row.status==='string'&&Object.hasOwn(REQUIREMENT_STATUSES,row.status)?row.status:'proposed';
 if(status!=='done')delete next.statusBeforeCompletion;
 return next;
}
function requirementCompletion(row,completed,at){
 const previous=row.statusBeforeCompletion;
 const restored=typeof previous==='string'&&previous!=='done'&&Object.hasOwn(REQUIREMENT_STATUSES,previous)?previous:'proposed';
 return requirementWithStatus(row,completed?'done':restored,at);
}

let requirementFilter='all',requirementStatusError='';
function requirementRow(r){
 const completed=r.status==='done';
 return `<article class="requirement-row ${completed?'completed':''}">
 <label class="workspace-checkbox-target"><input type="checkbox" data-requirement-toggle="${esc(r.id)}" aria-label="${completed?'取消完成需求：':'完成需求：'}${esc(r.title)}" ${completed?'checked ':''}${busy||!ready||conflict?'disabled':''}></label>
 <div class="requirement-body"><div class="requirement-heading"><h2 class="row-title">${esc(r.title)}</h2><div class="row-meta requirement-meta"><span class="tag">${esc(REQUIREMENT_STATUSES[r.status])}</span><span class="tag">${priority(r.priority)}</span><span class="requirement-date">登记于 ${esc(r.createdAt.slice(0,10))}</span></div></div>${r.detail?'<p class="requirement-detail">'+esc(r.detail)+'</p>':''}</div>
 ${controls('requirements',r.id)}</article>`;
}
function renderRequirements(){
 const node=$('results');if(!node)return;
 const selector=$('requirementFilter');if(selector)selector.value=requirementFilter;
 const q=query.trim().toLowerCase(),items=(state.requirements||[]).filter(r=>(requirementFilter==='all'||r.status===requirementFilter)&&(r.title+' '+r.detail).toLowerCase().includes(q)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 node.innerHTML=(requirementStatusError?'<p class="form-error" id="requirementStatusError" role="alert">'+esc(requirementStatusError)+'</p>':'')+'<div class="card workspace-card-compact requirements-list">'+(items.length?items.map(requirementRow).join(''):empty('暂无'+(q||requirementFilter!=='all'?'符合条件的':'')+'需求','点击“新建需求”，记下你想调整的功能。'))+'</div>';
}
document.addEventListener('change',async event=>{
 const input=event.target;if(!input.matches('input[data-requirement-toggle]'))return;
 const id=input.dataset.requirementToggle,original=(state.requirements||[]).find(r=>r.id===id);
 if(!original)return;if(busy||!ready||conflict){input.checked=original.status==='done';return;}
 requirementStatusError='';$('requirementStatusError')?.remove();
 const next=structuredClone(state),index=next.requirements.findIndex(r=>r.id===id);next.requirements[index]=requirementCompletion(original,input.checked);
 const ok=await change(next);
 if(!ok){requirementStatusError=saveError||'状态保存失败，请重试。';if(view==='requirements')renderRequirements();}
 if(view==='requirements')queueMicrotask(()=>{const target=[...document.querySelectorAll('input[data-requirement-toggle]')].find(el=>el.dataset.requirementToggle===id);(target||$('requirementFilter-control'))?.focus({preventScroll:true});});
});

/* REQUIREMENTS_END */

/* TASKS_ADAPTER_START */
// Game ownership stays in completedGames; tasks retain only an optional reference.
function gameRecords(workspace){return (workspace.completedGames||[]).filter(x=>(x.mediaType||'game')==='game');}
function validGameTaskReference(task){return task.mediaRecordId===undefined||typeof task.mediaRecordId==='string'&&task.mediaRecordId.length<=100;}
function migrateGameTasks(workspace,choices){
 if(!Array.isArray(choices)||!choices.length)throw Error('请选择要整理的游戏待办。');
 const next=structuredClone(workspace),seen=new Set();next.completedGames??=[];
 for(const choice of choices){
  if(seen.has(choice.taskId))throw Error('同一待办不能重复整理。');seen.add(choice.taskId);
  const task=next.tasks.find(x=>x.id===choice.taskId);
  if(!task||task.taskType!=='game'||task.mediaRecordId)throw Error('待办已变更，请关闭预览后重新整理。');
  let game;
  if(choice.targetId){game=gameRecords(next).find(x=>x.id===choice.targetId);if(!game)throw Error('关联游戏已移除，请重新选择。');}
  else{
   if(typeof choice.newId!=='string'||!choice.newId||choice.newId.length>100||next.completedGames.some(x=>x.id===choice.newId))throw Error('新游戏标识已被使用，请重新打开预览。');
   // A completed reminder is not evidence that a game has been completed.
   game={id:choice.newId,title:task.title,mediaType:'game',trackingStatus:'planned',platform:task.gamePlatform||'',detail:task.detail||'',completedDate:'',startedDate:'',rating:null,coverUrl:'',coverMode:'manual',progress:0,total:0,season:0,repeats:0};
   next.completedGames.push(game);
  }
  task.mediaRecordId=game.id;task.taskType='task';delete task.gamePlatform;
 }
 return next;
}

let workspaceTasks=null,tasksEditing=false;
function isTasksEditing(){return tasksEditing||!!workspaceTasks?.isEditing?.();}
function disposeWorkspaceTasks(){const node=document.getElementById('workspaceTasks');if(node)window.WorkspaceTasks?.unmount(node);workspaceTasks=null;}
function mountWorkspaceTasks(){const node=document.getElementById('workspaceTasks');if(!node)return;if(!window.WorkspaceTasks){node.textContent='待办组件加载失败，请刷新页面重试。';return;}const workspaceTasksBridge={rows:state.tasks,scope,games:gameRecords(state),openGame:id=>{if(!gameRecords(state).some(g=>g.id===id))return;view='completedGames';render();history.replaceState(null,'',location.pathname+'?view=completedGames');edit('completedGames',id);},today:day(),onEditingChange:value=>{tasksEditing=value;if(!value&&view==='home'&&scope==='personal')queueMicrotask(()=>{if(view==='home'&&!isTasksEditing())renderCalendar();});},save:async operation=>{
 let next=structuredClone(state);const ids=new Set(operation.ids||[]);
 if(operation.type==='migrateGames'){if(scope!=='personal')throw Error('仅能整理私人游戏待办。');next=migrateGameTasks(state,operation.choices);}
 else if(operation.type==='save'){const record={...operation.record};if(scope==='work')delete record.mediaRecordId;if(record.mediaRecordId&&!gameRecords(state).some(g=>g.id===record.mediaRecordId)&&state.tasks.find(t=>t.id===record.id)?.mediaRecordId!==record.mediaRecordId)throw Error('关联游戏已移除，请重新选择。');if(record.mediaRecordId||!record.id)record.taskType='task';record.title=record.title.trim();if(!record.title)throw Error('请输入待办标题');if(record.id){const index=next.tasks.findIndex(t=>t.id===record.id);if(index<0)throw Error('该待办已被移除，请关闭编辑面板后刷新。');next.tasks[index]={...next.tasks[index],...record};}else next.tasks.push({...record,id:crypto.randomUUID()});}
 else if(operation.type==='delete')next.tasks=next.tasks.filter(t=>!ids.has(t.id));
 else if(operation.type==='toggle'||operation.type==='complete')next.tasks=next.tasks.map(t=>ids.has(t.id)?{...t,done:operation.type==='complete'?true:!t.done}:t);
 else throw Error('不支持的待办操作');
 if(!await change(next))throw Error(saveError||'保存失败，输入已保留，请重试。');renderTaskBadge();workspaceTasksBridge.games=gameRecords(state);return state.tasks;
 }};workspaceTasks=window.WorkspaceTasks.mount(node,workspaceTasksBridge);}
function openWorkspaceTask(id){if(!ready||busy||conflict)return;if(view!=='tasks'&&!(view==='home'&&scope==='personal'&&workspaceTasks)){view='tasks';render();}setTimeout(()=>workspaceTasks?.open?.(id),0);}
window.addEventListener('beforeunload',event=>{if(isTasksEditing()){event.preventDefault();event.returnValue='';}});

/* TASKS_ADAPTER_END */
/* EVENT_RECURRENCE_START */
const {validCalendarRule,ruleOccurrencesOn}=window.IlamyCalendarRuntime||{validCalendarRule:()=>true,ruleOccurrencesOn:()=>[]};
function validEventRecurrence(event){
 if(!validCalendarRule(event)||event.allDay!==undefined&&typeof event.allDay!=='boolean'||event.exdates!==undefined&&(!Array.isArray(event.exdates)||event.exdates.length>10000||!event.exdates.every(x=>typeof x==='string'&&x.length<=40&&Number.isFinite(Date.parse(x))))||event.recurrenceId!==undefined&&(typeof event.recurrenceId!=='string'||!Number.isFinite(Date.parse(event.recurrenceId)))||event.uid!==undefined&&(typeof event.uid!=='string'||event.uid.length>200))return false;
 if(event.rrule)return event.recurrence===undefined;

  const split=line.indexOf('：');
  if(split<0)return [{category:'供货',value:line}];
  const name=category(line.slice(0,split)),body=line.slice(split+1),count=body.match(/（表列数量：([^）]+)）/);
  if(/运输|保险|境外险|包装|实施|安装|培训/.test(name)||!/(货架|车|提升|输送|电|软件|移载|升降|轨道|门|备件|附件|网络|IT)/.test(name))return [];
  const description=body.split('；供货方：')[0];

  const value=count?count[1].replace(/(\d)([^\d.,])/,'$1 $2'):software.length?software.join('、'):control||'待确认';

 });

 const dimensions=[];
 for(const line of lines(item.palletSize)){
  const pattern='([0-9,]+\\s*[×xX*]\\s*[0-9,]+(?:\\s*[×xX*]\\s*[0-9,]+)?\\s*(?:mm|毫米))';

 input.setAttribute('data-workspace-autocomplete','');input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-controls',list.id);input.setAttribute('aria-expanded','false');input.autocomplete='off';

 const wrapper=document.createElement('div');wrapper.className='workspace-autocomplete';input.before(wrapper);wrapper.append(input,list);
 let index=-1,items=[];
 const close=()=>{list.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');index=-1;};
 const activate=next=>{index=next;const options=[...list.querySelectorAll('[role=option]')];options.forEach((node,i)=>node.setAttribute('aria-selected',String(i===index)));if(options[index]){input.setAttribute('aria-activedescendant',options[index].id);options[index].scrollIntoView({block:'nearest'});}};

 const keydown=e=>{if(e.isComposing)return;if(['ArrowDown','ArrowUp'].includes(e.key)&&items.length){e.preventDefault();list.hidden=false;input.setAttribute('aria-expanded','true');activate(index<0?(e.key==='ArrowDown'?0:items.length-1):(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length);}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(!list.hidden&&index>=0)select(index);else onSearch();}else if(e.key==='Escape'&&!list.hidden){e.preventDefault();e.stopPropagation();close();}else if(e.key==='Tab')close();};
 const pointer=e=>{if(e.target.closest('[role=option]'))e.preventDefault();};
 const click=e=>{const option=e.target.closest('[role=option]');if(option)select(Number(option.dataset.choice));};
 const outside=e=>{if(!wrapper.contains(e.target))close();};
 input.addEventListener('workspace-autocomplete-close',close);input.addEventListener('keydown',keydown);list.addEventListener('pointerdown',pointer);list.addEventListener('click',click);document.addEventListener('pointerdown',outside);
 return {clear(){items=[];list.replaceChildren();close();},set(candidates,markup){items=candidates;index=-1;list.innerHTML=markup;list.querySelectorAll('[data-choice]').forEach((node,i)=>{node.id=list.id+'-option-'+i;node.setAttribute('role','option');node.setAttribute('aria-selected','false');node.tabIndex=-1;});list.hidden=!items.length;input.setAttribute('aria-expanded',String(!!items.length));},destroy(){input.removeEventListener('workspace-autocomplete-close',close);document.removeEventListener('pointerdown',outside);input.removeEventListener('keydown',keydown);}};

const pendingMediaCovers=new Map();
function gameCoverImageUrl(url,type='game'){
 if(type!=='game'||!url)return url;
 try{const u=new URL(url);return u.protocol==='https:'&&['shared.fastly.steamstatic.com','shared.akamai.steamstatic.com','cdn.akamai.steamstatic.com','cdn.cloudflare.steamstatic.com','images.igdb.com','images.launchbox-app.com','cdn.wikimg.net'].includes(u.hostname)?'/api/media/image?'+new URLSearchParams({url:u.href}):url;}catch{return url;}
}
async function resolveMediaSourceCovers(){
 const queue=(state.completedGames||[]).filter(item=>!item.coverUrl&&item.coverMode!=='manual'&&item.mediaSource&&item.mediaSourceId);
 let cursor=0;
 const resolve=async item=>{
  const key=mediaCoverKey(item);if(resolvedMediaCovers.has(key))return;
  if(!pendingMediaCovers.has(key))pendingMediaCovers.set(key,(async()=>{
   try{const response=await fetch('/api/media/details?'+new URLSearchParams({source:item.mediaSource,id:item.mediaSourceId,type:item.mediaType||'game',season:String(item.season||0)}),{signal:AbortSignal.timeout(12000)});
    if(response.ok)resolvedMediaCovers.set(key,(await response.json()).coverUrl||'');
   }catch{}finally{pendingMediaCovers.delete(key);}
  })());
  await pendingMediaCovers.get(key);
 };
 await Promise.all(Array.from({length:Math.min(4,queue.length)},async()=>{while(cursor<queue.length)await resolve(queue[cursor++]);}));
 if(view==='completedGames'&&queue.length)renderCompletedGames(false);
}

function retryOriginalMediaCover(image){
 const original=image.dataset.coverFallback;if(!original)return false;

}

async function compressClothing(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择 JPG、PNG 或 WebP 图片');if(file.size>15000000)throw Error('照片请控制在15 MB以内');const bitmap=await createImageBitmap(file);try{const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);for(const quality of [.8,.6,.4,.25]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=180000)return blob;}throw Error('照片压缩后仍过大，请裁剪后重试');}finally{bitmap.close();}}

function setupNavigationGroups(){const nav=document.querySelector('nav');const groups=scope==='personal'?[['生活',['maintenance','wardrobe']]]:[['记录',['notes']]];for(const [label,views] of groups){const buttons=views.map(v=>nav.querySelector('[data-view="'+v+'"]')).filter(b=>b&&!b.classList.contains('hidden'));if(!buttons.length)continue;const group=document.createElement('details');group.className='nav-group';const summary=document.createElement('summary');summary.textContent=label;summary.addEventListener('click',e=>{if(e.detail>0&&matchMedia('(hover:hover)').matches){e.preventDefault();group.open=true;}});group.append(summary);const menu=document.createElement('div');menu.className='nav-submenu';buttons.forEach(b=>menu.append(b));group.append(menu);nav.append(group);group.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover)').matches){nav.querySelectorAll('.nav-group').forEach(x=>{if(x!==group)x.open=false;});group.open=true;}});let closeTimer;group.addEventListener('mouseenter',()=>clearTimeout(closeTimer));group.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches)closeTimer=setTimeout(()=>{if(!group.contains(document.activeElement))group.open=false;},140);});group.addEventListener('keydown',e=>{if(e.key==='Escape'){group.open=false;summary.focus();}});}document.addEventListener('click',e=>{if(!nav.contains(e.target))nav.querySelectorAll('.nav-group').forEach(x=>x.open=false);});nav.addEventListener('click',e=>{if(e.target.closest('button[data-view]'))nav.querySelectorAll('.nav-group').forEach(x=>x.open=false);});}

// Workbench implementation of typing/dictation practice; no upstream code copied.
function spellingKey(value){return String(value||'').normalize('NFKC').trim().toLocaleLowerCase('en').replace(/[’‘]/g,"'").replace(/\s+/g,' ');}
function spellingMatches(answer,word){return spellingKey(answer)===spellingKey(word);}
function practiceQueue(words,scope='all',limit=20){return [...words].filter(w=>w?.word?.trim()&&(scope!=='unknown'||!String(w.mastery||'').includes('掌握'))).sort((a,b)=>String(a.lastReviewed||'').localeCompare(String(b.lastReviewed||''))||String(a.word).localeCompare(String(b.word),'en')).slice(0,Math.max(1,Math.min(100,Number(limit)||20))).map(w=>({...w}));}
function reviewedWord(word,correct,date){const count=Number.parseInt(word.reviewCount||'0',10);return {...word,mastery:correct?'已掌握':'不会',reviewCount:String((Number.isFinite(count)&&count>=0?count:0)+1),firstLearned:word.firstLearned||date,lastReviewed:date};}
function validPracticeSession(s){return !!s&&typeof s.id==='string'&&s.id.length>0&&s.id.length<=100&&['typing','dictation'].includes(s.mode)&&Number.isInteger(s.total)&&s.total>0&&s.total<=100&&Number.isInteger(s.correct)&&s.correct>=0&&s.correct<=s.total&&Number.isInteger(s.durationSeconds)&&s.durationSeconds>=0&&s.durationSeconds<=604800&&typeof s.completedOn==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s.completedOn)&&!Number.isNaN(Date.parse(s.completedOn))&&new Date(s.completedOn).toISOString().slice(0,10)===s.completedOn&&[s.startedAt,s.completedAt].every(v=>typeof v==='string'&&v.length<=40&&!Number.isNaN(Date.parse(v)))&&Date.parse(s.completedAt)>=Date.parse(s.startedAt);}

let wordPracticeController=null;
function isWordPracticing(){return !!wordPracticeController?.isEditing();}
function disposeWordPractice(){wordPracticeController?.dispose();wordPracticeController=null;}
function renderWordPractice(){
 $('heading').textContent='单词练习';$('add').classList.add('hidden');$('projectPanel').classList.add('hidden');document.body.dataset.workspaceView='vocabulary';document.body.classList.remove('project-view');
 if(wordPracticeController){wordPracticeController.update(state.vocabulary||[]);return;}
 disposeWorkspaceTasks();disposeWorkspaceCalendar();disposePersonalInfo();disposeAnnualPlans();stopWordAudio();
 $('content').innerHTML='<div id="workspaceWordPractice" data-ui-root data-ui-owner="word-practice"></div>';
 if(!window.WorkspaceWordPractice){$('workspaceWordPractice').textContent='单词练习组件加载失败，请刷新重试。';return;}
 wordPracticeController=window.WorkspaceWordPractice.mount($('workspaceWordPractice'),state.vocabulary||[],{sessions:()=>state.wordPracticeSessions||[],today:day,close(){disposeWordPractice();view='vocabularyLibrary';query='';render();history.replaceState(null,'',location.pathname+'?view=vocabularyLibrary');},async review(id,correct,session){
  const next=structuredClone(state),index=(next.vocabulary||[]).findIndex(w=>w.id===id);if(index<0)throw Error('这个单词已移除，请结束练习后刷新词库。');
  next.vocabulary[index]=reviewedWord(next.vocabulary[index],correct,day());
  if(session){next.wordPracticeSessions??=[];if(!next.wordPracticeSessions.some(s=>s.id===session.id))next.wordPracticeSessions.push({...session,completedOn:day()});}
  if(!await change(next))throw Error(saveError||'学习记录未保存，请重试。');return state.vocabulary||[];
 }});
}
$('content').addEventListener('click',e=>{if(!e.target.closest('[data-word-practice]')||scope!=='personal'||!ready||busy)return;view='vocabulary';query='';render();history.replaceState(null,'',location.pathname+'?view=vocabulary');});
window.addEventListener('beforeunload',e=>{if(isWordPracticing()){e.preventDefault();e.returnValue='';}});

let vocabularySyncLoading=false;
async function renderVocabularySync(){const node=$('vocabularySync');if(!node)return;node.textContent='正在读取表格同步状态…';try{const response=await fetch('/api/vocabulary/sync',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();if(!node.isConnected)return;node.innerHTML='<span>'+esc((data.status==='running'?'正在同步…':data.message||'等待首次同步')+(data.syncedAt?' · 最近成功 '+new Date(data.syncedAt).toLocaleString('zh-CN'):''))+'</span><a href="'+esc(data.source)+'" target="_blank" rel="noopener noreferrer">打开源表格</a><button type="button" class="btn" data-sync-vocabulary '+(!data.configured?'disabled':'')+'>刷新同步状态</button>';}catch{if(node.isConnected)node.textContent='同步状态暂时无法读取，请刷新页面重试。';}}
$('content').addEventListener('click',async e=>{if(!e.target.closest('[data-sync-vocabulary]')||vocabularySyncLoading||busy||scope!=='personal')return;vocabularySyncLoading=true;const button=e.target.closest('button');button.disabled=true;button.textContent='正在刷新…';try{await refreshWorkspace();}finally{vocabularySyncLoading=false;if(view==='vocabularyLibrary')renderVocabularySync();}});

let fitnessController=null;
function isFitnessEditing(){return !!fitnessController?.isEditing();}
function disposeFitness(){fitnessController?.dispose();fitnessController=null;}
function renderFitness(){
 if(scope!=='personal')return;
 $('heading').textContent='居家健身';$('add').classList.add('hidden');$('projectPanel').classList.add('hidden');document.body.dataset.workspaceView='fitness';document.body.classList.remove('project-view');
 if(fitnessController){fitnessController.update(state.fitnessSessions||[],state.fitnessProfiles?.[0]||null);return;}
 disposeWordPractice();disposeWorkspaceTasks();disposeWorkspaceCalendar();disposePersonalInfo();disposeAnnualPlans();stopWordAudio();
 $('content').innerHTML='<div id="workspaceFitness" data-ui-root data-ui-owner="fitness"></div>';
 if(!window.WorkspaceFitness){$('workspaceFitness').textContent='健身页面加载失败，请刷新重试。';return;}
 fitnessController=window.WorkspaceFitness.mount($('workspaceFitness'),{sessions:state.fitnessSessions||[],profile:state.fitnessProfiles?.[0]||null,today:day,async saveProfile(profile){
  if(scope!=='personal'||busy||!ready)throw Error('暂时无法保存，请稍后重试。');
  const next=structuredClone(state);next.fitnessProfiles=[profile];
  if(!await change(next))throw Error(saveError||'档案未保存，填写内容已保留。');
  toast('训练档案已保存，安排已更新');return state.fitnessProfiles[0];
 },async save(record){
  if(scope!=='personal'||busy||!ready)throw Error('暂时无法保存，请稍后重试。');
  const next=structuredClone(state);next.fitnessSessions??=[];
  if(!next.fitnessSessions.some(x=>x.id===record.id))next.fitnessSessions.push({...record,completedOn:day()});
  if(!await change(next))throw Error(saveError||'训练未保存，完成状态仍保留，请重试。');
  toast('训练记录已保存');return state.fitnessSessions||[];
 }});
}
window.addEventListener('beforeunload',event=>{if(isFitnessEditing()){event.preventDefault();event.returnValue='';}});

 if(scope!=='personal')return;
 $('heading').textContent='年度计划';$('add').classList.add('hidden');$('projectPanel').classList.add('hidden');document.body.classList.remove('project-view');document.body.dataset.workspaceView='annualPlans';
 if(annualPlanController){annualPlanController.update(state.annualPlans||[]);return;}
 disposeWorkspaceTasks();disposeWorkspaceCalendar();disposePersonalInfo();stopWordAudio();

 if(!window.WorkspaceAnnualPlans){$('workspaceAnnualPlans').textContent='年度计划组件加载失败，请刷新重试。';return;}
 annualPlanController=window.WorkspaceAnnualPlans.mount($('workspaceAnnualPlans'),{rows:state.annualPlans||[],save:async operation=>{
  if(scope!=='personal'||busy||!ready)throw Error('暂时无法保存，请稍后重试。');
  const next=structuredClone(state);next.annualPlans??=[];
  if(operation.type==='save'){const record=operation.record;if(record.id){const index=next.annualPlans.findIndex(x=>x.id===record.id);if(index<0)throw Error('该事项已删除，请刷新后重试。');next.annualPlans[index]={...record};}else next.annualPlans.push({...record,id:crypto.randomUUID()});}
  else if(operation.type==='delete')next.annualPlans=next.annualPlans.filter(x=>x.id!==operation.id);else throw Error('无效操作');
  if(!await change(next))throw Error(saveError||'保存失败，输入已保留。');return state.annualPlans||[];
 }});
}

function mountWorkbenchShell(){
 if(!window.WorkspaceShell)return;
 const legacy=document.querySelector('.shell>aside');
 legacy.dataset.legacyNavigation='';
 const root=document.createElement('div');root.id='workbenchShell';root.dataset.shellRoot='';
 const header=document.createElement('div');header.id='workbenchTopbar';header.dataset.shellRoot='';
 legacy.after(root,header);
 const canLeave=()=>{if(isCalendarEditing()||isTasksEditing()||isAnnualPlanEditing()||isWordPracticing()||isFitnessEditing()||isPersonalInfoEditing()||document.querySelector('dialog[open]')){toast('请先关闭编辑面板或处理未保存修改。');return false;}return true;};
 const snapshot=()=>({view,heading:$('heading').textContent,count:dueTaskNotifications(currentReminderTasks(),day()).length,ready:!$('notificationToggle').disabled});
 const syncLayout=()=>{document.body.dataset.workspaceView=view;document.querySelector('main').setAttribute('aria-label',$('heading').textContent);const add=$('add'),toolbar=$('content').querySelector('.filters');if(['requirements','notes','maintenance','completedGames'].includes(view)&&add&&toolbar&&add.parentElement!==toolbar)toolbar.append(add);};
 syncLayout();
 const controller=window.WorkspaceShell.mount(root,header,{
  scope,date:$('today').textContent,snapshot,canLeave,
  navigate(next){if(!canLeave())return false;view=next;query='';render();history.replaceState(null,'',location.pathname+'?view='+encodeURIComponent(next));return true;},
  notifications:()=>$('notificationToggle').click(),account:()=>$('accountToggle').click()
 });
 $('personalInfoLink').onclick=()=>{if(isCalendarEditing()||isTasksEditing()||isAnnualPlanEditing()||isWordPracticing()||isFitnessEditing())return;$('accountCenter').close();if(!canLeave())return;view='personalInfo';query='';render();history.replaceState(null,'',location.pathname+'?view=personalInfo');};
 document.body.classList.add('shadcn-workbench');
 const observer=new MutationObserver(()=>{syncLayout();controller.update?.();});
 for(const node of [$('heading'),$('notificationBadge'),$('notificationToggle')])observer.observe(node,{attributes:true,childList:true,subtree:true});
}
mountWorkbenchShell();
window.WorkspacePrimitives?.install();
