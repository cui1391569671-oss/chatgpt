function canonical(value){if(Array.isArray(value))return value.map(canonical);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));return value;}

function ensureProjectIds(source){

}
const property=(obj,key)=>Object.hasOwn(obj,key)?{exists:true,value:obj[key]}:{exists:false};
function recordChanges(base,next,collections){
 const operations=[];
 for(const collection of collections){
  if(collection==='priorities'){const b=base[collection]||{},n=next[collection]||{};for(const id of new Set([...Object.keys(b),...Object.keys(n)]))if(!equalRecord(property(b,id),property(n,id)))operations.push({collection,id,action:'value',before:property(b,id),after:property(n,id)});continue;}
  if(collection==='projects'){const b=new Set(base.projects||[]),n=new Set(next.projects||[]);for(const id of new Set([...b,...n]))if(b.has(id)!==n.has(id))operations.push({collection,id,action:'membership',present:n.has(id)});continue;}
  const b=new Map((base[collection]||[]).map(x=>[x.id,x])),n=new Map((next[collection]||[]).map(x=>[x.id,x]));
  for(const id of new Set([...b.keys(),...n.keys()])){const old=b.get(id),row=n.get(id);if(equalRecord(old,row))continue;if(!old){operations.push({collection,id,action:'create',record:row});continue;}if(!row){operations.push({collection,id,action:'delete',before:old});continue;}
   const changes={};for(const field of new Set([...Object.keys(old),...Object.keys(row)]))if(field!=='id'&&!equalRecord(property(old,field),property(row,field)))changes[field]={before:property(old,field),after:property(row,field)};
   operations.push({collection,id,action:'update',changes});
  }

}
class RecordConflict extends Error{}
function applyRecordChanges(source,operations,collections){

 for(const op of operations){if(!op||!collections.includes(op.collection)||typeof op.id!=='string'||!op.id||op.id.length>200||unsafe.has(op.id))throw Error('无效记录');
  if(op.collection==='priorities'){if(op.action!=='value')throw Error('无效变更');const map=result.priorities??={};const current=property(map,op.id);if(!equalRecord(current,op.before)&&!equalRecord(current,op.after))throw new RecordConflict('该项目优先级已更新');set(map,op.id,op.after);continue;}
  if(op.collection==='projects'){if(op.action!=='membership'||typeof op.present!=='boolean')throw Error('无效变更');const list=result.projects??=[];if(op.present&&!list.includes(op.id))list.push(op.id);if(!op.present)result.projects=list.filter(x=>x!==op.id);continue;}
  const list=result[op.collection]??=[];const index=list.findIndex(x=>x.id===op.id),current=list[index];

  else if(op.action==='delete'){if(current&&!equalRecord(current,op.before))throw new RecordConflict('该记录已被修改，请核对后删除');if(current)list.splice(index,1);}

  else throw Error('无效操作');

}

   const key=x=>x.id||x.word;const bm=new Map((b||[]).map(x=>[key(x),x])),lm=new Map(l.map(x=>[key(x),x])),rm=new Map(r.map(x=>[key(x),x]));
   const out=[];for(const id of new Set([...rm.keys(),...lm.keys(),...bm.keys()])){const item=merge(bm.get(id),lm.get(id),rm.get(id),path+'/'+id);if(item!==undefined)out.push(item);}return out;

   const out={};for(const k of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])){const value=k==='updatedAt'?[l[k],r[k]].filter(Boolean).sort().at(-1):merge(b[k],l[k],r[k],path+'/'+k);if(value!==undefined)out[k]=value;}return out;

let activeWordAudio=null,wordAudioSequence=0;

function speakWord(button){
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('当前浏览器不支持朗读，请尝试 Edge 或 Chrome。');return;}
 if(activeWordAudio===button){stopWordAudio();return;}

 const voices=window.speechSynthesis.getVoices(),voice=voices.find(v=>/^en[-_]US$/i.test(v.lang))||voices.find(v=>/^en[-_]/i.test(v.lang));if(voice)utterance.voice=voice;

function selectDailyVocabulary(vocabulary,date){
 const unique=new Map();for(const word of vocabulary||[]){const key=String(word.word||'').trim().toLowerCase();if(key&&!unique.has(key))unique.set(key,word);}
 const hash=text=>{let n=2166136261;for(const char of text){n^=char.charCodeAt(0);n=Math.imul(n,16777619);}n^=n>>>16;n=Math.imul(n,0x7feb352d);n^=n>>>15;n=Math.imul(n,0x846ca68b);return (n^(n>>>16))>>>0;};
 return [...unique.entries()].map(([key,word])=>({key,word,rank:hash(date+':'+key)})).sort((a,b)=>a.rank-b.rank||a.key.localeCompare(b.key)).slice(0,5).map(x=>x.word);
}

async function compressClothing(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择 JPG、PNG 或 WebP 图片');if(file.size>15000000)throw Error('照片请控制在15 MB以内');const bitmap=await createImageBitmap(file);try{const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);for(const quality of [.8,.6,.4,.25]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=180000)return blob;}throw Error('照片压缩后仍过大，请裁剪后重试');}finally{bitmap.close();}}
