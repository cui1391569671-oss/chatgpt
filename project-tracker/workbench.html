<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作台</title>
<style>
:root{--bg:#f5f6fa;--surface:#fff;--text:#18243a;--muted:#67748b;--line:#e3e8f0;--accent:#435ae8;--soft:#eef1ff;--danger:#b42318;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}a{color:var(--accent)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:var(--surface);border-right:1px solid var(--line);padding:32px 18px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:750;padding:0 14px 28px}.brand small{display:block;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:500}nav{display:grid;gap:8px}nav button,nav a{padding:12px 16px;border:0;border-radius:10px;background:transparent;text-align:left;text-decoration:none;color:var(--muted);min-height:48px}nav .active{background:var(--soft);color:var(--accent);font-weight:650}nav button:hover,nav a:hover{background:var(--bg)}.aside-footer{position:absolute;bottom:28px;left:32px;color:var(--muted);font-size:12px}main{padding:40px clamp(18px,4vw,64px);max-width:1500px;width:100%}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h1{font-size:30px;line-height:1.3;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}p{margin:6px 0}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:1px;font-weight:650;margin-bottom:10px}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 16px;min-height:44px;background:var(--surface);color:var(--text);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}.btn:hover{background:var(--bg)}.primary{background:var(--accent);border-color:v r:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px}.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.note-body{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);max-height:180px;overflow:hidden;margin:12px 0}.notes .card{display:flex;flex-direction:column}.notes .actions{margin-top:auto}.date-heading{margin:24px 0 4px;color:var(--muted);font-weight:600}.event-time{font-size:13px;color:var(--accent);min-width:100px}.full{grid-column:1/-1}dialog{border:1px solid var(--line);border-radius:20px;padding:28px;width:min(560px,calc(100% - 32px));max-height:90dvh;overflow:auto;color:var(--text);box-shadow:0 24px 80px #18243a25}dialog::backdrop{background:#18243a70}dialog label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}dialog textarea{min-height:150px;resize:vertical}dialog .actions{justify-content:flex-end;margin-top:24px}.form-error{color:var(--danger)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:white;border-radius:10px;padding:12px 20px;z-index:5;max-width:90vw}.hidden{display:none!important}@media(max-width:1100px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px 12px;font-size:20px}.brand small,.aside-footer{display:none}nav{display:flex;overflow:auto;gap:4px}nav button,nav a{white-space:nowrap;padding:10px 12px;flex-shrink:0}main{padding:24px 16px}header{align-items:flex-start}h1{font-size:25px}.grid,.notes{grid-template-columns:1fr}.stats{gap:10px}.card{padding:18px}.stat-value{font-size:28px}.row{flex-wrap:wrap}.row .actions{margin-left:auto;flex-basis:10 .space-switch{display:block;padding:10px 14px;border-radius:10px;text-decoration:none;margin-bottom:16px;min-height:44px;border:1px solid var(--line)!important;margin-top:12px;color:var(--accent)!important;background:var(--soft)!important}
.calendar-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px}.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.calendar-controls{display:flex;gap:6px}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekdays{color:var(--muted);font-size:13px;text-align:center;margin-bottom:8px}.calendar-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:80px;padding:8px;color:var(--text);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}.calendar-day:hover{border-color:var(--accent);background:var(--soft)}.calendar-day.outside{color:var(--muted);background:var(--bg)}.calendar-day.selected{border:2px solid var(--accent);background:var(--soft);padding:7px}.calendar-day.today .day-number{background:var(--accent);color:white;border-radius:50%;width:26px;height:26px;text-align:center}.calendar-count{font-size:11px;color:var(--accent);white-space:nowrap}.agenda .card-head{flex-wrap:wrap}.calendar-hint{font-size:12px;margin-top:16px;color:var(--muted)}@media(max-width:1000px){.calendar-layout{grid-template-columns:1fr}}@media(max-width:760px){.calendar-day{min-height:60px;padding:5px}.calendar-day.selected{padding:4px}.calendar-count{font-size:10px}.weekdays,.month-grid{gap:3px}.calendar-controls .btn{padding:8px 12px}.space-switch{margin-top:0!important}}

.holiday-name{font-size:11px;color:#a32929;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.calendar-day.rest-day{background:#fff5f3}.calendar-day.makeup-day{background:#edf6ff}.calendar-day.selected{background:var(--soft)}.day-heading{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.day-flag{font-size:10px;border-radius:4px;padding:0 3px;background:#ffe2dc;color:#a32929;line-height:18px}.day-flag.work{background:#dbeafe;color:#1d4ed8}.holiday-detail{border-radius:10px;background:#fff5f3;color:#a32929;padding:12px 14px;margin-bottom:16px;font-size:14px}.holiday-detail.work{background:#edf6ff;color:#1d4ed8}.holiday-legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:16px}.holiday-legend a{color:var(--accent)}.holiday-unknown{font-size:12px;color:var(--muted);margin:12px 0 0}@media(max-width:760px){.calendar-day{min-height:86px}.holiday-name{font-size:10px}.day-heading{gap:2px}}
.day-flag.festival{background:#f0e7ff;color:#7041a4}.holiday-detail.festival{background:#f5efff;color:#7041a4}.calendar-day.festival-day{background:#fbf8ff}

.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:24px}.sidebar-head .brand{padding:0 0 0 14px;font-size:20px}.sidebar-toggle{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}.sidebar-toggle:hover{background:var(--soft);color:var(--accent)}.nav-icon{width:20px;height:20px;flex-shrink:0}nav button,.space-switch{display:flex;align-items:center;gap:12px}.shell.sidebar-collapsed{grid-template-columns:80px minmax(0,1fr)}.sidebar-collapsed aside{padding:24px 12px}.sidebar-collapsed .brand,.sidebar-collapsed .nav-label,.sidebar-collapsed .aside-footer{display:none}.sidebar-collapsed .sidebar-head{justify-content:center}.sidebar-collapsed nav button,.sidebar-collapsed .space-switch{justify-content:center;padding:12px;width:100%;min-height:48px}.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
@media(max-width:760px){.sidebar-head{margin-bottom:12px}.sidebar-head .brand{padding:0 4px}.shell.sidebar-collapsed{display:block}.sidebar-collapsed aside{padding:12px 16px}.sidebar-collapsed .sidebar-head{justify-content:flex-end;margin-bottom:8px}.sidebar-collapsed nav button{width:48px;min-width:48px}.sidebar-collapsed .space-switch{width:48px;margin-bottom:8px}}
.notifications{margin-bottom:24px;padding:16px 20px}.notifications summary{cursor:pointer;font-weight:650;min-height:28px}.notification-list{display:grid;gap:8px;margin-top:12px}.notification-item{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:12px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.notification-item:hover{background:var(--soft)}.notification-item span{overflow-wrap:anywhere}.notification-item small{white-space:nowrap;color:var(--accent)}.notification-item.overdue small{color:var(--danger)}
nav button[data-view="tasks"]{position:relative}.task-badge{position:absolute;right:6px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#d92d20;color:#fff;font-size:11px;line-height:20px;font-weight:700;text-align:center;pointer-events:none}.sidebar-collapsed .task-badge{right:0;top:0}
</style></head>
<body><div class="shell"><aside><div class="sidebar-head"><div class="brand">我的工作台<small>PERSONAL WORKSPACE</small></div><button id="sidebarToggle" class="sidebar-toggle" aria-label="折叠侧边栏" aria-expanded="true" title="折叠侧边栏"></button></div><a id="spaceSwitch" class="space-switch" href="/personal">切换到私人工作台</a><nav aria-label="主导航"><button data-view="home" class="active">工作总览</button><button data-view="tasks">个人待办</button><button data-view="notes">我的笔记</button><button data-view="calendar">日程安排</button><button data-view="vocabulary" id="vocabularyLink" class="hidden">英语词汇</button><button data-view="projects" id="projectLink">项目问题表</button></nav><div class="aside-footer">专注今天，逐步推进。</div></aside><main><header><div><div class="eyebrow" id="today"></div><h1 id="heading">工作总览</h1></div><button id="add" class="btn primary" disabled>＋ 新建待办</button></header><div class="status hidden" id="status" role="status"><span id="statusText">正在连接云端…</span><button class="btn hidden" id="recover">重新加载</button></div><details id="notifications" class="card notifications hidden"><summary id="notificationSummary" aria-live="polite"></summary><p class="muted">提前一天提醒，按北京时间计算；仅显示未完成事项。</p><div id="notificationList" class="notification-list"></div></details><div id="projectPanel" class="hidden"><iframe id="projectFrame" title="项目问题跟进表" style="width:100%;height:calc(100dvh - 220px);min-height:600px;border:0;border-radius:12px;background:white"></iframe></div><div id="content" aria-busy="true"><div class="card empty">正在加载你的工作台…</div></div></main></div>
<dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><div id="fields"></div><p id="formError" class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">保存</button></div></form></dialog><div class="toast hidden" role="status" id="toast"></div>
<script>
'use strict';
/* HOLIDAYS_START */
const CHINA_HOLIDAYS={"2026":{"source":"https://www.gov.cn/zhengce/content/202511/content_7047090.htm","title":"国务院办公厅关于2026年部分节假日安排的通知","holidays":[{"name":"元旦","start":"2026-01-01","end":"2026-01-03"},{"name":"春节","start":"2026-02-15","end":"2026-02-23"},{"name":"清明节","start":"2026-04-04","end":"2026-04-06"},{"name":"劳动节","start":"2026-05-01","end":"2026-05-05"},{"name":"端午节","start":"2026-06-19","end":"2026-06-21"},{"name":"中秋节","start":"2026-09-25","end":"2026-09-27"},{"name":"国庆节","start":"2026-10-01","end":"2026-10-07"}],"workdays":[{"date":"2026-01-04","name":"元旦"},{"date":"2026-02-14","name":"春节"},{"date":"2026-02-28","name":"春节"},{"date":"2026-05-09","name":"劳动节"},{"date":"2026-09-20","name":"国庆节"},{"date":"2026-10-10","name":"国庆节"}]},"2027":{"source":"https://www.hko.gov.hk/tc/gts/time/calendar/pdf/files/2027.pdf","title":"香港天文台2027年公历与农历日期对照表","officialSchedule":false,"holidays":[],"workdays":[],"festivals":[{"date":"2027-01-01","name":"元旦"},{"date":"2027-02-05","name":"除夕"},{"date":"2027-02-06","name":"春节"},{"date":"2027-02-20","name":"元宵节"},{"date":"2027-04-05","name":"清明节"},{"date":"2027-05-01","name":"劳动节"},{"date":"2027-06-09","name":"端午节"},{"date":"2027-09-15","name":"中秋节"},{"date":"2027-10-01","name":"国庆节"}]}};
/* HOLIDAYS_END */
const scope=location.pathname==='/work'?'work':'personal',api='/api/workspace?scope='+scope;
let state={tasks:[],notes:[],events:[]},version=0,ready=false,view='home',query='',filter='open',editing=null,kind='tasks',busy=false,conflict=false;
const $=id=>document.getElementById(id),titles={home:scope==='work'?'工作总览':'私人总览',tasks:scope==='work'?'工作待办':'个人待办',notes:scope==='work'?'工作笔记':'我的笔记',calendar:'日历与日程',projects:'项目问题表',vocabulary:'英语词汇'},labels={tasks:'待办',notes:'笔记',events:'日程'};
let selectedDate=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'}),calendarMonth=selectedDate.slice(0,7);
const day=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.replace('T',' '):'未设置日期';
const priority=p=>({high:'高优先级',normal:'普通',low:'低优先级'}[p]||'普通');
function status(text,error=false){$('statusText').textContent=text;$('status').classList.toggle('error',error);$('status').classList.toggle('hidden',!error||view==='projects');$('recover').classList.toggle('hidden',!error);}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);}
function setBusy(value){busy=value;renderNotifications();$('add').disabled=value||!ready||conflict;$('submit').disabled=value;document.querySelectorAll('#content button,#content input[type=checkbox]').forEach(x=>x.disabled=value||!ready||conflict);}
async function load(){setBusy(true);try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('读取失败（'+r.status+'）');const s=await r.json();state=s.workspace;version=s.version;ready=true;conflict=false;status('已连接云端 · '+(scope==='work'?'工作':'私人')+'数据独立保存');render();}catch(e){ready=false;status(e.message+'，请重新加载。',true);}finally{setBusy(false);$('content').setAttribute('aria-busy','false');}}
async function change(next){if(busy||!ready||conflict)return false;setBusy(true);status('正在保存…');try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:next,version})});if(r.status===409){conflict=true;throw Error('云端数据已被其他页面更新，请重新加载后再修改');}if(!r.ok)throw Error('保存失败（'+r.status+'），修改尚未保存，请重试');const s=await r.json();state=next;version=s.version;status('已保存至云端');render();return true;}catch(e){status(e.message,true);toast(e.message);return false;}finally{setBusy(false);}}
function empty(title,help){return '<div class="empty"><strong>'+esc(title)+'</strong>'+esc(help)+'</div>';}
function controls(type,id){return '<div class="actions"><button data-edit="'+type+'" data-id="'+esc(id)+'" aria-label="编辑'+labels[type]+'">编辑</button><button data-delete="'+type+'" data-id="'+esc(id)+'" aria-label="删除'+labels[type]+'">删除</button></div>';}
function taskRows(items){return items.map(t=>'<div class="row '+(t.done?'completed':'')+'"><input type="checkbox" aria-label="完成待办：'+esc(t.title)+'" data-toggle="'+esc(t.id)+'" '+(t.done?'checked':'')+'><div class="row-content"><div class="row-title">'+(scope==='personal'&&t.taskType==='game'?'<span class="tag">游戏</span>':'')+esc(t.title)+'</div><div class="row-meta">'+(scope==='personal'&&t.taskType==='game'&&t.gamePlatform?'<span class="tag">'+esc(t.gamePlatform)+'</span>':'')+'<span class="tag">'+priority(t.priority)+'</span><span class="'+(!t.done&&t.dueDate&&t.dueDate<day()?'overdue':'')+'">'+(t.dueDate?fmt(t.dueDate):'无截止日期')+'</span>'+(t.detail?'<p>'+esc(t.detail)+'</p>':'')+'</div></div>'+controls('tasks',t.id)+'</div>').join('');}
function eventRows(items){return items.map(e=>'<div class="row"><div class="event-time">'+esc(fmt(e.start))+'</div><div class="row-content"><div class="row-title">'+esc(e.title)+'</div><div class="row-meta">'+(e.end?'至 '+esc(fmt(e.end))+' · ':'')+esc(e.location||'未设置地点')+(e.detail?'<p>'+esc(e.detail)+'</p>':'')+'</div></div>'+controls('events',e.id)+'</div>').join('');}
function noteCards(items){return '<div class="notes">'+items.map(n=>'<article class="card"><h3 class="row-title">'+esc(n.title)+'</h3><div class="note-body">'+esc(n.body)+'</div><div class="row-meta">更新于 '+new Date(n.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'</div>'+controls('notes',n.id)+'</article>').join('')+'</div>';}
function dueTaskNotifications(tasks,today){
 const date=new Date(today+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+1);const tomorrow=date.toISOString().slice(0,10);
 return tasks.filter(t=>!t.done&&t.dueDate&&t.dueDate<=tomorrow).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(t=>({task:t,label:t.dueDate<today?'已逾期':t.dueDate===today?'今天到期':'明天到期'}));
}
function renderNotifications(){
 const panel=$('notifications');panel.classList.toggle('hidden',!ready);if(!ready)return;
 const reminders=dueTaskNotifications(state.tasks,day());$('notificationSummary').textContent=reminders.length?'消息通知 · '+reminders.length+' 项待办需要关注':'消息通知 · 暂无到期提醒';
 $('notificationList').innerHTML=reminders.length?reminders.map(({task:t,label})=>'<button type="button" class="notification-item '+(label==='已逾期'?'overdue':'')+'" data-reminder="'+esc(t.id)+'" '+(busy||conflict?'disabled':'')+'><span>'+esc(t.title)+'</span><small>'+label+' · '+esc(t.dueDate)+'</small></button>').join(''):'<p class="muted">未来一天没有即将到期的待办。</p>';
}
$('notificationList').onclick=e=>{const b=e.target.closest('button[data-reminder]');if(b)edit('tasks',b.dataset.reminder);};
{setInterval(()=>{if(ready&&!busy)renderNotifications();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready&&!busy)renderNotifications();});}
function renderTaskBadge(){
 const button=document.querySelector('nav button[data-view="tasks"]');let badge=button.querySelector('.task-badge');
 if(!badge){badge=document.createElement('span');badge.className='task-badge';badge.setAttribute('aria-hidden','true');button.append(badge);}
 const count=state.tasks.filter(t=>!t.done).length;badge.textContent=count>99?'99+':String(count);badge.classList.toggle('hidden',!ready||count===0);button.setAttribute('aria-label',titles.tasks+(ready?'，'+count+' 项未完成':''));
}

function holidayInfo(date){

 const festival=year.festivals?.find(x=>x.date===date);if(festival)return {type:'festival',name:festival.name,label:festival.name+' · 节日日期'};
 const work=year.workdays.find(x=>x.date===date);if(work)return {type:'work',name:work.name,label:work.name+'调休补班'};

}

function renderVocabulary(){const all=state.vocabulary||[],q=query.toLowerCase(),level=$('vocabFilter')?.value||'all';const items=all.filter(w=>[w.word,w.meaning,w.example,w.lesson].join(' ').toLowerCase().includes(q)).filter(w=>level==='all'||level==='unknown'&&w.mastery.includes('不会')||level==='mastered'&&w.mastery.includes('掌握'));$('results').innerHTML='<p class="muted">共 '+all.length+' 个词条 · 当前显示 '+items.length+' 个</p>'+(items.length?'<div class="notes" style="margin-top:16px">'+items.map(w=>'<article class="card"><div class="card-head"><h3>'+esc(w.word)+'</h3><span class="tag">Lesson '+esc(w.lesson)+'</span></div><p class="muted">'+esc(w.phonetic)+' · '+esc(w.partOfSpeech)+'</p><p>'+esc(w.meaning)+'</p><p class="note-body">'+esc(w.example)+'</p><p class="muted">'+esc(w.mastery)+' · 复习 '+esc(w.reviewCount||'0')+' 次</p><p class="muted">首次学习 '+esc(w.firstLearned||'未记录')+' · 最近复习 '+esc(w.lastReviewed||'未记录')+'</p>'+(w.note?'<p>'+esc(w.note)+'</p>':'')+'</article>').join('')+'</div>':empty('暂无符合条件的单词','导入词汇文件，或调整搜索与筛选。'));}
function mergeVocabulary(existing,incoming){const result=[...existing],seen=new Set(existing.map(w=>w.word.trim().toLowerCase()));for(const w of incoming){const key=w.word.trim().toLowerCase();if(!seen.has(key)){result.push({...w,id:crypto.randomUUID()});seen.add(key);}}return result;}
