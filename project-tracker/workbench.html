<body><div class="shell"><aside><div class="sidebar-head"><div class="brand">我的工作台<small>PERSONAL WORKSPACE</small></div><button id="sidebarToggle" class="sidebar-toggle" aria-label="折叠侧边栏" aria-expanded="true" title="折叠侧边栏"></button></div><a id="spaceSwitch" class="space-switch" href="/personal">切换到私人工作台</a><nav aria-label="主导航"><button data-view="home" class="active">工作总览</button><button data-view="tasks">个人待办</button><button data-view="notes">我的笔记</button><button data-view="calendar">日程安排</button><button data-view="completedGames" id="completedGamesLink" class="hidden">通关游戏</button><button data-view="wardrobe" id="wardrobeLink" class="hidden">我的衣橱</button><button data-view="vocabulary" id="vocabularyLink" class="hidden">英语词汇</button><button data-view="drive" id="driveLink" class="hidden">Google Drive</button><button data-view="projects" id="projectLink">项目问题表</button></nav><div class="aside-footer">专注今天，逐步推进。</div></aside><main><header><div><div class="eyebrow" id="today"></div><h1 id="heading">工作总览</h1></div><div class="header-actions"><button id="notificationToggle" class="btn notification-toggle" aria-label="消息通知" title="消息通知" aria-haspopup="dialog" disabled><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notificationBadge" class="notification-badge hidden" aria-hidden="true"></span></button><button id="add" class="btn primary" disabled>＋ 新建待办</button></div></header><div class="status hidden" id="status" role="status"><span id="statusText">正在连接云端…</span><button class="btn hidden" id="recover">重新加载</button></div><div id="projectPanel" class="hidden"><iframe id="projectFrame" title="项目问题跟进表" style="width:100%;height:calc(100dvh - 220px);min-height:600px;border:0;border-radius:12px;background:white"></iframe></div><div id="content" aria-busy="true"><div class="card empty">正在加载你的工作台…</div></div></main></div>
<dialog id="drivePreview" class="drive-preview" aria-labelledby="drivePreviewTitle"><div class="card-head"><h2 id="drivePreviewTitle">表格预览</h2><div class="drive-preview-tools"><a id="drivePreviewExternal" class="btn" target="_blank" rel="noopener noreferrer">在 Google 中打开 ↗</a><button id="drivePreviewClose" class="btn" type="button">关闭</button></div></div><p class="muted">在此查看表格。若提示登录、没有权限或无法显示，请使用上方“在 Google 中打开”，登录有权限的账号后重试。</p><iframe id="drivePreviewFrame" title="Google 表格预览" referrerpolicy="no-referrer" allow="fullscreen"></iframe></dialog><dialog id="clothingEditor" aria-labelledby="clothingTitle"><form id="clothingForm" class="wardrobe-form"><h2 id="clothingTitle">添加衣服</h2><label for="clothingPhoto">衣服照片</label><input id="clothingPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img id="clothingPreview" class="hidden" alt="衣服预览"><label for="clothingName">名称</label><input id="clothingName" maxlength="100" required placeholder="如 白色衬衫"><label for="clothingCategory">类别</label><select id="clothingCategory"><option value="top">上装</option><option value="bottom">下装</option><option value="dress">连衣裙</option><option value="outer">外套</option><option value="shoes">鞋子</option><option value="accessory">配饰</option></select><label for="clothingColor">颜色</label><input id="clothingColor" maxlength="50" placeholder="如 白色"><fieldset id="clothingSeasons"><legend>适用季节（可多选）</legend></fieldset><p id="clothingError" class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn" id="clothingCancel">取消</button><button class="btn primary" id="clothingSave">保存衣服</button></div></form></dialog><dialog id="notifications" aria-labelledby="notificationSummary"><div class="card-head"><h2 id="notificationSummary">消息通知</h2><button class="btn" id="notificationClose" aria-label="关闭消息通知">关闭</button></div><p class="muted">按北京时间提前一天提醒，包含未完成的逾期任务；工作和私人提醒分别汇总。</p><div id="notificationList" class="notification-list"></div></dialog><dialog id="releaseDialog" class="release-dialog" aria-labelledby="releaseTitle"><div class="card-head"><h2 id="releaseTitle">今年已发售热门游戏</h2><button class="btn" id="releaseClose">关闭</button></div><p class="muted">收录 Steam 当前热门新品榜中今年已发售的游戏，按发售日期排序；不包含其他平台独占游戏，也不代表历史上榜的完整档案。</p><div class="release-toolbar"><input id="releaseSearch" aria-label="搜索已发售游戏" placeholder="搜索游戏名称"><button class="btn" id="releaseRefresh">刷新榜单</button></div><div id="releasedList" aria-live="polite"></div></dialog><dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><div id="fields"></div><p id="formError" class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">保存</button></div></form></dialog><div class="toast hidden" role="status" id="toast"></div>

function mergeWorkspace(base,local,remote){
 const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const merge=(b,l,r,path)=>{
  if(equal(l,b))return structuredClone(r);if(equal(r,b)||equal(l,r))return structuredClone(l);
  if((b===undefined||Array.isArray(b))&&Array.isArray(l)&&Array.isArray(r)){
   const key=x=>x.id||x.word;const bm=new Map((b||[]).map(x=>[key(x),x])),lm=new Map(l.map(x=>[key(x),x])),rm=new Map(r.map(x=>[key(x),x]));
   const out=[];for(const id of new Set([...rm.keys(),...lm.keys(),...bm.keys()])){const item=merge(bm.get(id),lm.get(id),rm.get(id),path+'/'+id);if(item!==undefined)out.push(item);}return out;
  }
  if(b&&l&&r&&typeof b==='object'&&typeof l==='object'&&typeof r==='object'){
   const out={};for(const k of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])){const value=k==='updatedAt'?[l[k],r[k]].filter(Boolean).sort().at(-1):merge(b[k],l[k],r[k],path+'/'+k);if(value!==undefined)out[k]=value;}return out;
  }
  throw Error('同一项内容在另一页面也被修改（'+path+'），输入仍保留，请核对后再保存。');
 };
 return merge(base,local,remote,'工作台');
}

let saveError='';
async function change(next){
 if(busy||!ready)return false;setBusy(true);saveError='';status('正在保存…');const base=structuredClone(state);let candidate=next,writeVersion=version;
 try{
  for(let attempt=0;attempt<3;attempt++){
   const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:candidate,version:writeVersion})});
   if(r.status===409){const latest=await fetch(api,{cache:'no-store'});if(!latest.ok)throw Error('读取最新数据失败，输入仍保留，请重试');const cloud=await latest.json();candidate=mergeWorkspace(base,next,cloud.workspace);writeVersion=cloud.version;continue;}
   if(!r.ok)throw Error('保存失败（'+r.status+'），修改尚未保存，请重试');const saved=await r.json();state=candidate;version=saved.version;conflict=false;status('已保存至云端');if(typeof refreshReminders==='function')refreshReminders();render();return true;

 }catch(e){saveError=e.message;status(e.message,true);toast(e.message);return false;}finally{setBusy(false);}
}
async function deleteRecord(type,id){

 try{
  for(let attempt=0;attempt<3;attempt++){
   const read=await fetch(api,{cache:'no-store'});if(!read.ok)throw Error('无法读取最新数据，未删除，请重试');const cloud=await read.json();const item=cloud.workspace[type].find(x=>x.id===id);
   if(!item){state=cloud.workspace;version=cloud.version;conflict=false;status('已保存至云端');if(typeof refreshReminders==='function')refreshReminders();render();toast('该记录已在云端删除');return true;}
   if(JSON.stringify(item)!==approved){if(!confirm('这条'+labels[type]+'已被其他页面修改：'+(item.title||item.name)+'。仍要删除最新记录吗？')){state=cloud.workspace;version=cloud.version;conflict=false;status('已连接云端');render();return false;}approved=JSON.stringify(item);}
   const next=structuredClone(cloud.workspace);next[type]=next[type].filter(x=>x.id!==id);
   const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:next,version:cloud.version})});if(r.status===409)continue;if(!r.ok)throw Error('删除失败（'+r.status+'），请重试');

  }
  throw Error('其他页面正在更新，请稍后再次删除。');
 }catch(e){status(e.message,true);toast(e.message);return false;}finally{setBusy(false);}
}

function openClothing(id){if(!ready||busy)return;const c=(state.wardrobe||[]).find(x=>x.id===id);clothingEditId=c?.id||null;clothingImage=c?.image||null;photoSequence++;clothingBlob=null;$('clothingSave').disabled=false;$('clothingForm').reset();$('clothingTitle').textContent=c?'编辑衣服':'添加衣服';$('clothingPhoto').required=!c;$('clothingName').value=c?.name||'';$('clothingCategory').value=c?.category||'top';$('clothingColor').value=c?.color||'';$('clothingError').textContent='';$('clothingPreview').classList.toggle('hidden',!c);if(c)$('clothingPreview').src=c.image;$('clothingSeasons').innerHTML='<legend>适用季节（可多选）</legend>'+Object.entries(seasons).map(([k,v])=>'<label style="display:inline-flex;align-items:center;gap:6px;margin:8px"><input style="width:auto;min-height:0" type="checkbox" name="season" value="'+k+'" '+((c?.seasons||[wardrobeSeason]).includes(k)?'checked':'')+'>'+v+'</label>').join('');$('clothingEditor').showModal();}
async function compressClothing(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择 JPG、PNG 或 WebP 图片');if(file.size>15000000)throw Error('照片请控制在15 MB以内');const bitmap=await createImageBitmap(file);try{const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);for(const quality of [.8,.6,.4,.25]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=180000)return blob;}throw Error('照片压缩后仍过大，请裁剪后重试');}finally{bitmap.close();}}

function basicOutfit(clothes,season){const pool=clothes.filter(c=>c.seasons.includes(season)),pick=cat=>pool.find(c=>c.category===cat);const dress=pick('dress'),top=pick('top'),bottom=pick('bottom');let result=top&&bottom?[top.id,bottom.id]:dress?[dress.id]:[];if(!result.length)return [];for(const cat of ['outer','shoes','accessory']){if(cat==='outer'&&season==='summer')continue;const c=pick(cat);if(c)result.push(c.id);}return result;}
